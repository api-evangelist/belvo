- aid: belvo:belvo-bank-accounts-brazil-api
  name: Belvo Bank Accounts (Brazil) API
  description: >-
    To receive inflow payments to your organization's bank account, you must register the bank accounts
    (individual and business) using Belvo's Payments API.


    - **Individual** bank accounts must be created for each payer (your customer).

    - **Business** bank accounts need to be created for the beneficiary of the payment (your organization).


    {% admonition type="info" name="Resource Versioning" %}
      This endpoint supports resource-level versioning. By including the header `X-Belvo-API-Resource-Version:
    Payments-BR.V2`, you can access the latest (V2) request and response formats. If the header is not
    provided, the default (V1) format will be used. See the API documentation for details on the differences
    between versions.
    {% /admonition %}
