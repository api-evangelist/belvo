- aid: belvo:belvo-current-employments-mexico-api
  name: Belvo Current Employments Mexico API
  description: >-
    The Current Employments resource provides real-time access to the current employment status of individuals
    in Mexico. This resource offers detailed information about whether an individual is currently employed
    or unemployed, along with their active employment records.


    ## Key Features


    - **Real-time Employment Status**: Get up-to-date information about an individual's current employment
    situation

    - **Current vs Historical**: Unlike Employment Records, this resource focuses specifically on current
    employment status rather than historical employment data

    - **Comprehensive Employment Details**: When employed, receive detailed information including employer
    details, salary information, and employment duration

    - **Unemployment Status**: Clear indication when an individual is currently unemployed


    When an individual is **employed**, you will receive:

    - Personal identification data (name, birth date, NSS, CURP)

    - Current employment status

    - Employer information (name, RFC, ID)

    - Employment location (state)

    - Duration of employment (days employed)

    - Salary information (base and monthly salary)
