- aid: belvo:belvo-payment-authorizations-brazil-api
  name: Belvo Payment Authorizations (Brazil) API
  description: >-
    A Payment Authorization is the consent that your user gives you to charge (debit money from) their
    accounts. You need to perform one Payment Authorization per ‘contract’ (for example, if your company
    does both electricity and water but they are billed separately, then you will create two separate
    Payment Authorizations).


    Once the user confirms the authorization, you will need to listen for a a `PAYMENT_AUTHORIZATION`
    webhook with the status set to `AUTHORIZED`. Once you receive this webhook, the authorization process
    is complete, and you will be able to charge your user.


    {% admonition type="info" name="What is a charge?" %}

    A **charge** represents the individual payment (debit) that your customer will make.

    {% /admonition %}


    {% admonition type="danger" name="Version Header" %}
      The Payment Authorization resource requires that you send through the `X-Belvo-API-Resource-Version`
    header set to `Payments-BR.V2`.
    {% /admonition %}
  humanURL: https://developers.belvo.com/apis/belvoopenapispec/links
  baseURL: https://api.belvo.com/api
