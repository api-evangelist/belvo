aid: belvo
url: https://raw.githubusercontent.com/api-evangelist/belvo/refs/heads/main/apis.yml
name: Belvo
kind: company
description: Belvo is a Latin American open-finance API platform that lets companies
  connect to bank, fiscal, and employment institutions across Mexico, Brazil, and
  Colombia to aggregate accounts, balances, transactions, owners, and income data,
  and to initiate account-to-account payments over Brazil's Pix / Open Finance rails.
