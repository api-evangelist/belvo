aid: belvo
name: Belvo
review:
  question: Does Belvo expose a documented public WebSocket or streaming API?
  answer: false
  date: '2026-06-21'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    Belvo's asynchronous surface is delivered as outbound HTTP webhooks (server
    POSTs JSON event payloads to a customer-registered URL), not as a streaming
    transport the client connects to. There is no documented Server-Sent Events
    (SSE) or WebSocket endpoint. Under current API Evangelist scope, neither an
    SSE nor a WebSocket AsyncAPI document was authored because no client-facing
    streaming channel is documented. The webhook surface is modeled in the
    OpenAPI document (POST /api/webhooks/) and described below.
findings:
  summary: |
    Belvo does not publish a documented public WebSocket or SSE streaming API.
    The platform is a RESTful HTTPS API under https://api.belvo.com using HTTP
    Basic authentication (Secret Key ID as username, Secret Key Password as
    password). Asynchronous delivery is handled through outbound webhooks:
    Belvo POSTs event notifications to a customer-registered HTTPS URL when
    aggregation resources (accounts, owners, transactions) finish processing and
    when payment intents, charges, and transactions change state. Belvo expects
    a 2XX response within five seconds and retries otherwise. This is a
    server-to-client callback, not a bidirectional or long-lived stream.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.belvo.com
      documented: true
    - protocol: Webhook
      scheme: https
      note: Outbound HTTP POST callbacks to a customer-registered URL for aggregation and payment events. Expects 2XX within five seconds; retried on failure.
      documented: true
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events endpoint is documented.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the Belvo API reference or developer portal as of the review date.
  endpointsConfirmedRest:
    - POST   https://api.belvo.com/api/links/
    - GET    https://api.belvo.com/api/links/
    - GET    https://api.belvo.com/api/links/{id}/
    - PATCH  https://api.belvo.com/api/links/{id}/
    - DELETE https://api.belvo.com/api/links/{id}/
