sources:
  - url: https://developers.belvo.com/apis/belvoopenapispec
    type: APIReference
    note: All documented endpoints are HTTPS REST under https://api.belvo.com; no WebSocket mentioned.
  - url: https://developers.belvo.com/developer_resources/resources-webhooks-aggregation
    type: Documentation
    note: Aggregation webhooks are outbound HTTP POST callbacks to a customer URL, not a client-connected stream.
  - url: https://developers.belvo.com/docs/payments-webhooks
    type: Documentation
    note: Payment webhooks deliver Payment Intent / Charge / Transaction state changes via outbound POST; expects 2XX within five seconds.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No client-facing streaming (SSE or WebSocket) surface exists. Belvo's only
    asynchronous mechanism is outbound webhooks, which are modeled in the
    OpenAPI document and described in this review. No AsyncAPI document was
    authored because there is no streaming channel a client subscribes to.
