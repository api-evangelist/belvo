    - POST   https://api.belvo.com/api/accounts/
    - GET    https://api.belvo.com/api/accounts/{id}/
    - GET    https://api.belvo.com/api/transactions/
    - POST   https://api.belvo.com/api/transactions/
    - GET    https://api.belvo.com/api/transactions/{id}/
    - GET    https://api.belvo.com/api/balances/
    - POST   https://api.belvo.com/api/balances/
    - GET    https://api.belvo.com/api/owners/
    - POST   https://api.belvo.com/api/owners/
    - GET    https://api.belvo.com/api/incomes/
    - POST   https://api.belvo.com/api/incomes/
    - GET    https://api.belvo.com/api/recurring-expenses/
    - POST   https://api.belvo.com/api/recurring-expenses/
