      - unconfirmed
      - token_required
      description: "The current status of the link. For more information, see our <a href=\"https://developers.belvo.com/docs/links-and-institutions#links\" target=\"_blank\">Link</a> article in the devportal.\nWe return one of the following values:\n  - `valid`\n  - `invalid`\n  - `unconfirmed`\n  - `token_required`\n"
      example: valid
    InvalidLinkError:
      type: object
      title: Invalid Link
      description: 'This error occurs when you try to access an account but the user credentials are no longer valid, prompting an error from the institution.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_link`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_link" target="_blank">400 invalid_link errors</a>.

            '
          example: invalid_link
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_link` errors, the description is:\n  \n  - `The link has been invalidated. You may need to update link credentials`.\n"
          example: The link has been invalidated. You may need to update link credentials
        request_id:
          $ref: '#/components/schemas/request_id'
    InvalidCredentialsStorageError:
      type: object
      title: Invalid Credentials Storage
      description: 'This error occurs when you attempted to create a **recurrent** link where you set `credentials_storage` to either `nostore` or to a date range between `1d` to `365d`.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_credentials_storage`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_credentials_storage" target="_blank">400 invalid_credentials_storage errors</a>.

            '
          example: login_error
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_credentials_storage` errors, the description can be one of the following:\n\n  - `Recurrent links must store the credentials`\n  \n"
          example: Recurrent links must store the credentials
        request_id:
          $ref: '#/components/schemas/request_id'
    RequestTimeoutError:
      type: object
      title: Request Timeout
      description: 'Belvo has a limit regarding the time it takes to log in, retrieve account data, and log out. A timeout occurs when there is a very high amount of data and everything could not be obtained within the allotted time.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`request_timeout`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#408-request_timeout" target="_blank">408 request_timeout errors</a>.

            '
          example: request_timeout
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `request_timeout` errors, the description is:\n  \n  - `The request timed out, you can retry asking for less data by changing your query parameters`.\n"
          example: The request timed out, you can retry asking for less data by changing your query parameters
        request_id:
          $ref: '#/components/schemas/request_id'
    common_pagination_properties:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: The total number of results in your Belvo account.
          example: 130
        next:
          type:
          - string
          - 'null'
          format: uri
          description: 'The URL to next page of results. Each page consists of up to 100 items. If there are not enough results for an additional page, the value is `null`.


            In our documentation example, we use `{endpoint}` as a placeholder value. In production, this value will be replaced by the actual endpoint you are currently using (for example, `accounts` or `owners`).

            '
          example: https://sandbox.belvo.com/api/{endpoint}/?link=1bd948f7-245d-4313-b604-34d1044cb908&page=2
        previous:
          type:
          - string
          - 'null'
          format: uri
          description: 'The URL to the previous page of results. If there is no previous page, the

            value is `null`.

            '
          example: null
    InvalidResourcesError:
      type: object
      title: Invalid Resources
      description: 'This error occurs when you attempted to create a link where you added resources in `fetch_resources` that are unsupported by the institution.

        '
      properties:
        field:
          type: string
          description: 'The request parameter that is causing the error. For invalid resources, this will be set to `resources`.

            '
          example: resources
        code:
          type: string
          description: 'A unique error code (`invalid`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid" target="_blank">400 invalid_period errors</a>.

            '
          example: invalid
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid` errors relating to `fetch_resources`, the description is:\n  \n  - `The institution only supports the following resources: (comma-separated list of supported resources)`.\n"
          example: 'The institution only supports the following resources: EMPLOYMENT_RECORDS, OWNERS'
        request_id:
          $ref: '#/components/schemas/request_id'
    EnumLinkRefreshRate:
      type:
      - string
      - 'null'
      default: 7d
      enum:
      - 6h
      - 12h
      - 24h
      - 7d
      - 30d
      - null
      description: "The update refresh rate for the recurrent link. For more information, check out our <a href=\"https://developers.belvo.com/docs/links-and-institutions#recurrent-links\" target=\"_blank\">recurrent link documentation</a> in our DevPortal.\nWe return one of the following enum values:\n  - `6h`\n  - `12h`\n  - `24h`\n  - `7d` (default)\n  - `30d` (once a month)\n  - `null` (for single links)\n"
      example: 7d
    save_data:
      type: boolean
      default: true
      description: 'Indicates whether or not to persist the data in Belvo. By default, this is set to `true` and we return a 201 Created response.


        When set to `false`, the data won''t be persisted and we return a 200 OK response.

        '
      example: true
    created_by:
      type: string
      format: uuid
      description: The unique ID for the user that created this item.
      example: bcef7f35-67f2-4b19-b009-cb38795faf09
    external_id:
      type: string
      minLength: 3
      maxLength: 256
      description: 'An additional identifier for the link, provided by you, to store in the Belvo database. **Cannot** include any Personal Identifiable Information (PII). **Must** be at least three characters long.



        If we identify that the identifier contains PII, we will force a `null` value. For more information, see our <a href="https://developers.belvo.com/docs/link-creation-best-practices#adding-your-own-identifier" target="_blank">Link creation article</a>.

        '
      example: 56ab5706-6e00-48a4-91c9-ca55968678d9
    created_at:
      type: string
      format: date-time
      description: 'The ISO-8601 timestamp of when the data point was created in Belvo''s database.

        '
      example: '2022-02-09T08:45:50.406032Z'
    UnconfirmedLinkError:
      type: object
      title: Unconfirmed Link
      description: 'This error occurs when you try to access a link that was paused previously (and as such is not active now).


        A Link''s status is set to `unconfirmed_link` when your user has not completed the Link creation process successfully (for example, they might not provide a valid MFA token).

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`unconfirmed_link`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-unconfirmed_link" target="_blank">400 unconfirmed_link errors</a>.

            '
          example: unconfirmed_link
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `unconfirmed_link` errors, the description is:\n  \n  - `The link creation has not been completed yet`.\n"
          example: The link creation has not been completed yet
        request_id:
          $ref: '#/components/schemas/request_id'
    LoginError:
      type: object
      title: Login Error
      description: "This error can occur when:\n\n  - the credentials that your user provides are incorrect or missing.\n  - the MFA token your user provides is not supported by Belvo.\n  - there is an issue with the institution that prevents logins.\n  - the user's account is either locked or the user does not have permission to access their internet banking.\n"
      properties:
        code:
          type: string
          description: 'A unique error code (`login_error`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-login_error" target="_blank">400 login_error errors</a>.

            '
          example: login_error
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `login_error` errors, the description can be one of the following:\n\n  - `Invalid credentials provided to login to the institution`\n  - `A MFA token is required by the institution, but it's not supported yet by Belvo.`\n  - `Impossible to login, something unexpected happened while logging into the institution. Try again later.`\n  - `Login not attempted due to invalid credentials`\n  - `Missing credentials to login to the institution`\n  - `The user account access was forbidden by the institution`\n  - `The user account is locked, user needs to contact the institution to unlock it`\n  \n"
          example: Invalid credentials provided to login to the institution
        request_id:
          $ref: '#/components/schemas/request_id'
    InvalidPeriodError:
      type: object
      title: Invalid Period
      description: 'This error occurs when you request incomes for a link within a given date range, however, the period between `date_from` and `date_to` is less than 90 days.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_period`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_period" target="_blank">400 invalid_period errors</a>.

            '
          example: invalid_period
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_period` errors, the description is:\n  \n  - `The number of days between date_from and date_to must be at least 90 days`.\n"
          example: The number of days between date_from and date_to must be at least 90 days
        request_id:
          $ref: '#/components/schemas/request_id'
    UnsupportedOperationError:
      type: object
      title: Unsupported Operation
      description: 'This error occurs when you try to access some data operation that Belvo does not support for an institution. For example, trying to access the Balances resource for fiscal institutions.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`unsupported_operation`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-unsupported_operation" target="_blank">400 unsupported_operation errors</a>.

            '
          example: unsupported_operation
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `unsupported_operation` errors, the description is:\n  \n  - `The resource you are trying to access is not supported by this institution`.\n"
          example: The resource you are trying to access is not supported by this institution
        request_id:
          $ref: '#/components/schemas/request_id'
    fetch_resources_fiscal_mexico:
      type: array
      description: "An array of resources that you would like to receive a historical update for.\n\nFor **Fiscal Mexico** (SAT), you can select the following resources:\n  - `FINANCIAL_STATEMENTS`\n  - `INVOICES`\n  - `TAX_COMPLIANCE_STATUS`\n  - `TAX_RETENTIONS`\n  - `TAX_RETURNS`\n  - `TAX_STATUS`\n"
      items:
        type: string
        enum:
        - FINANCIAL_STATEMENTS
        - INVOICES
        - TAX_COMPLIANCE_STATUS
        - TAX_RETENTIONS
        - TAX_RETURNS
        - TAX_STATUS
      example:
      - FINANCIAL_STATEMENTS
      - INVOICES
      - TAX_COMPLIANCE_STATUS
      - TAX_RETENTIONS
      - TAX_RETURNS
      - TAX_STATUS
    Link:
      type: object
      x-tags:
      - Links
      properties:
        id:
          $ref: '#/components/schemas/id'
        institution:
          type: string
          description: 'Belvo''s name for the institution.

            '
          example: erebor_mx_retail
        access_mode:
          $ref: '#/components/schemas/EnumLinkAccessModeResponse'
        last_accessed_at:
          $ref: '#/components/schemas/last_accessed_at'
        created_at:
          $ref: '#/components/schemas/created_at'
        external_id:
          $ref: '#/components/schemas/external_id'
        institution_user_id:
          type: string
          pattern: '[A-Za-z0-9\-=_]{44}'
          description: '> 📘 Info

            >

            > Only applicable for links created **after 08-02-2022**.



            A unique 44-character string that can be used to identify a user at a given institution.



            📚 Check out our <a href="https://developers.belvo.com/docs/link-creation-best-practices#avoiding-duplicated-links" target="_blank">Avoiding duplicated links</a> DevPortal article for more information and tips on how to use it.

            '
          example: test_institution_user_id_1234567890abcdef123
        status:
          $ref: '#/components/schemas/EnumLinkStatus'
        created_by:
          $ref: '#/components/schemas/created_by'
        refresh_rate:
          $ref: '#/components/schemas/EnumLinkRefreshRate'
        credentials_storage:
          $ref: '#/components/schemas/credentials_storage'
        fetch_resources:
          type: array
          description: 'An array of resources that you will receive a historical update for.

            '
          items:
            type: string
            description: A Belvo resource that the institution supports.
            example: ACCOUNTS
          example:
          - ACCOUNTS
          - TRANSACTIONS
        stale_in:
          $ref: '#/components/schemas/stale_in'
    ValidationError:
      type: object
      title: Validation Error
      description: 'This error occurs when make a request that does not include all the required fields or includes invalid data.

        '
      properties:
        code:
          type: string
          description: "A unique error code (`null`, `does_not_exist`, `required`) that allows you to classify and handle the error programmatically.\n\n\nℹ️ Check our DevPortal for more information on how to handle:\n  - <a href=\"https://developers.belvo.com/docs/belvo-api-errors#400-blank\" target=\"_blank\">400 blank errors</a>\n  - <a href=\"https://developers.belvo.com/docs/belvo-api-errors#400-null\" target=\"_blank\">400 null errors</a>\n  - <a href=\"https://developers.belvo.com/docs/belvo-api-errors#400-does_not_exist\" target=\"_blank\">400 does_not_exist errors</a>\n  - <a href=\"https://developers.belvo.com/docs/belvo-api-errors#400-required\" target=\"_blank\">400 required errors</a>\n"
          example: required
        message:
          type: string
          description: "A short description of the error. \n\n\nFor validation errors, the description can be (among others):\n  \n  - `This field is required.`\n  - `Object with name=narnia does not exist.`\n  - `This field may not be null.`\n  - `This field may not be blank.`\n"
          example: This field is required.
        request_id:
          $ref: '#/components/schemas/request_id'
        field:
          type:
          - string
          - 'null'
          description: 'Name of the field where the error was encountered.

            '
          example: link
  responses:
    428_token_required_error:
      description: MFA Token Required
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TokenRequiredResponse'
    408_request_timeout_error:
      description: Request Timeout
      content:
