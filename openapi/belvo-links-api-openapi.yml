openapi: 3.2.0
info:
  title: Belvo API Docs Links API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Links
  description: 'A **Link** is a set of credentials associated to an end-user''s access to an **institution**. You will need to register a **Link** before accessing information from that specific end-user, such as account or transaction details.


    We recommend using the Belvo Hosted Widget to manage the connection process.'
paths:
  /api/links/:
    get:
      tags:
      - Links
      operationId: ListLinks
      summary: List links
      description: '## ▶️ Usage


        With the List Links method, you can:


        1. List all links elated to your Belvo account (without using any query parameters).

        2. Get the details of a specific `link.id` (using the `id` query parameter).


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.'
      parameters:
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/institution'
      - $ref: '#/components/parameters/institution__in'
      - $ref: '#/components/parameters/access_mode'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      - $ref: '#/components/parameters/created_by__not_in'
      - $ref: '#/components/parameters/external_id'
      - $ref: '#/components/parameters/external_id__in'
      - $ref: '#/components/parameters/institution_user_id'
      - $ref: '#/components/parameters/institution_user_id__in'
      - $ref: '#/components/parameters/refresh_rate'
      - $ref: '#/components/parameters/status_links'
      - $ref: '#/components/parameters/status__in_links'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of link objects.
                      items:
                        $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    post:
      tags:
      - Links
      operationId: RegisterLink
      summary: Register a new link
      description: '## ▶️ Usage


        Register a new link (a connection between your user and their institution) using the Belvo API.


        > 👍 We really recommend using our Connect Widget to handle link creation and link status updates.


        To make things easier, we''ve included custom examples for the links you can create for each of our products. Just click on the type of link you want to create in the **Body Params** section below.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/LinksRequestEmploymentBrazil'
              - $ref: '#/components/schemas/LinksRequestEmploymentMexico'
              - $ref: '#/components/schemas/LinksRequestFiscalMexico'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    patch:
      tags:
      - Links
      operationId: PatchLinks
      summary: Complete a links request
      description: 'Used to resume a Link register session that was paused because an MFA token

        was required by the institution.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBody'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/links/{id}/:
    get:
      tags:
      - Links
      operationId: DetailLink
      summary: Get a link's details
      description: Get the details of a specific link.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The `link.id` you want to get detailed information about.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    patch:
      tags:
      - Links
      operationId: ModifyLinkDataRetrieval
      summary: Modify a link's data retrieval
      description: 'Modify the data retrieval settings for a specific link. At present you can:


        - Change a link''s access mode from `single` to `recurrent` or from `recurrent` to `single`.

        - Modify they `stale_in` period for the link.

        - Modify the historical resources you want to retrieve for the link (`fetch_resources`).


        ## Changing a link''s `access_mode`


        When you change a link from `single` to `recurrent`, the next day a historical update of the core resources for the link is triggered (resulting in you receiving `historical_update` webhooks for the link). You are billed for these historical updates.


        ## Modifying `stale_in`


        If you only modify the `stale_in` period for a link, this will not trigger a historical update. In order to trigger a historical update for the link, you must change the `access_mode`.


        ## Modifying `fetch_resources`


        If you only modify the `fetch_resources` for a link, this will not trigger a historical update. In order to trigger a historical update for the link, you must change the `access_mode`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
        description: The `link.id` you want to change the `access_mode`, `stale_in`, or `fetch_resources` for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAccessMode'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    put:
      tags:
      - Links
      operationId: UpdateLink
      summary: Update a link's credentials
      description: 'Update the credentials of a specific link. If the successfully updated link is a recurrent one, we automatically trigger an update of the link. If we find fresh data, you''ll receive historical update webhooks.


        > 👍 Use our Connect Widget

        >

        > We recommend using our Connect Widget to handle updating invalid or token_required links.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The `link.id` you want to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinksPutRequest'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    delete:
      tags:
      - Links
      operationId: DestroyLink
      summary: Delete a link
      description: 'Delete a specific link and all the associated data (for example: transactions, accounts, invoices, tax returns, employments, and so on) for that link from your Belvo account. This action is irreversible, and you will not be able to recover the deleted data.


        {% admonition type="success" name="Use the X-Belvo-Request-Mode: async header" %}

        We highly recommend setting the `X-Belvo-Request-Mode` header to `async` to enable asynchronous deletion. This way, you will avoid the rate limit of 5 deletions per minute. When set, the endpoint will respond with a `202 Accepted` status and provide a request ID for tracking the deletion process. Once the process is complete, you will receive a `link_deleted` webhook notification.


        If you do not set this header, the endpoint will respond with a `204 No Content` status, but you will be subject to the rate limit of 5 deletions per minute. If you exceed this limit, you will receive a `429 Too Many Requests` error.

        {% /admonition %}'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The `link.id` that you want to delete.
      - name: X-Belvo-Request-Mode
        in: header
        required: false
        schema:
          type: string
          enum:
          - async
        description: 'Set to `async` to enable asynchronous deletion, which bypasses rate limiting. When set, the endpoint returns a `202 Accepted` response with a request ID. You will later receive a webhook notification when the deletion is complete.

          '
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    format: uuid
                    description: The unique identifier for tracking the async deletion request.
                required:
                - request_id
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/links/{id}/refresh/:
    post:
      tags:
      - Links
      operationId: RefreshHistoricalDataForLink
      summary: Trigger a historical update for a link
      description: '{% admonition type="warning" name="Concurrent Request Limit" %}

        To prevent duplicate requests, this endpoint has a 10-minute cooldown period per link. If you attempt to refresh the same link within 10 minutes of a previous request, you will receive a `409 Conflict` error with the message `"The link has already been refreshed. Please wait X minutes before trying again."`.

        {% /admonition %}


        Use this method to trigger a historical update for a specific link (single or recurrent). Use the `fetch_resources` parameter to specify which resources you want to update. If you do not specify this parameter, the historical update will be performed for all resources supported by the institution that the link is associated with.


        On a successful request, our API will respond with a `202` status code and a `request_id` that you can later use to associate a given `historical_update` webhook to this request.


        {% admonition type="info" name="Does not update link definition" %}

        This endpoint does not update the link definition itself, only the historical data for the specified resources. If you want to change the link''s `fetch_resources` permanently, you should use the **Modify a link''s data retrieval** method instead.

        {% /admonition %}'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
        description: The `link.id` you want to refresh.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fetch_resources:
                  type: array
                  description: "An array of resources that you would like to receive a historical update for. If you do not specify this field, the historical update will be performed for all resources supported by the institution.\n\n{% admonition type=\"warning\" name=\"Unsupported Resources for a Link\" %}\n  If you specify a resource that is not supported by the institution, we return a `400 Bad Request` error, specifying which resources are supported for the given link.\n{% /admonition %}\n"
                  items:
                    type: string
                    description: A Belvo resource that the institution supports.
                    example: ACCOUNTS
                  example:
                  - ACCOUNTS
                  - TRANSACTIONS
                  - OWNERS
      responses:
        '202':
          description: Historical Refresh Request Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: The unique ID for this request. We recommend you store this value to later identify which webhook event relates to an asynchronous request.
                    example: b5d0106ac9cc43d5b36199fe831f6bbe
                required:
                - request_id
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '409':
          $ref: '#/components/responses/409_link_already_refreshed'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    omit:
      name: omit
      in: query
      description: Omit certain fields from being returned in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    created_at__lte:
      name: created_at__lte
      in: query
      description: Return items that were last updated in Belvo's database before or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-03-30'
    external_id__in:
      name: external_id__in
      in: query
      description: Return links with these external IDs.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          minLength: 3
          maxLength: 256
          example: InternalUser4001
    status_links:
      name: status
      in: query
      description: Return links with this status. Choose between `valid`, `invalid`, `unconfirmed`, or `token_required`.
      schema:
        type: string
        example: invalid
    page_size:
      name: page_size
      in: query
      description: 'Indicates how many results to return per page. By default we return 100 results per page.


        ℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).

        '
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    institution__in:
      name: institution__in
      in: query
      description: Return results only for these institutions (use the Belvo-designated names, such as `ofmockbank_br_retail` and `planet_mx_employment`).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-z_]{1,40}$
          minLength: 1
          maxLength: 40
          example: planet_mx_retail
    id:
      name: id
      in: query
      description: Return information only for this resource `id`.
      schema:
        type: string
        format: uuid
        example: 24ccab1d-3a86-4136-a6eb-e04bf52b356f
    institution_user_id:
      name: institution_user_id
      in: query
      description: Return links with this specific institution user ID.
      schema:
        type: string
        example: test_institution_user_id_1234567890abcdef123
    institution_user_id__in:
      name: institution_user_id__in
      in: query
      description: Return links with these institution user IDs.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: test_institution_user_id_1234567890abcdef123
    created_at__range:
      name: created_at__range
      in: query
      description: Return accounts that were last updated in Belvo's database between two dates (in `YYYY-MM-DD` format). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          format: date
          example: '2022-03-03'
        example:
        - '2022-01-01'
        - '2022-12-31'
    refresh_rate:
      name: refresh_rate
      in: query
      description: Return links with this refresh rate. Choose between `6h`, `12h`, `24h`, `7d`, `30d`, or `null` (for single links).
      schema:
        type: string
        pattern: ^((\d{1,3}h)?(\d{1,3}m)?(\d{1,3}d)?|null)$
        example: 24h
    status__in_links:
      name: status__in
      in: query
      description: Return links with these statuses. Choose between `valid`, `invalid`, `unconfirmed`, or `token_required`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: invalid
    institution:
      name: institution
      in: query
      description: Return results only for this institution (use the Belvo-designated name, such as `planet_mx_employment`).
      schema:
        type: string
        pattern: ^[a-z_]{1,40}$
        minLength: 1
        maxLength: 40
        example: planet_mx_retail
    created_at__gte:
      name: created_at__gte
      in: query
      description: Return items that were last updated in Belvo's database after or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-04'
    fields:
      name: fields
      in: query
      description: Return only the specified fields in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    external_id:
      name: external_id
      in: query
      description: Return links with this external ID.
      schema:
        type: string
        minLength: 3
        maxLength: 256
        example: InternalUser4000
    access_mode:
      name: access_mode
      in: query
      description: Return links only with this access mode. Can be either `single` or `recurrent`.
      example: single
      schema:
        type: string
        enum:
        - single
        - recurrent
        example: single
    page:
      name: page
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    id__in:
      name: id__in
      in: query
      description: Return information for these resource `id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 6b3dea0f-be29-49d1-aabe-1a6d588642e6
    created_at__lt:
      name: created_at__lt
      in: query
      description: Return items that were last updated in Belvo's database before this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-04-01'
    created_at:
      name: created_at
      in: query
      description: Return items that were last updated in Belvo's database on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    created_by__not_in:
      name: created_by__not_in
      in: query
      description: Return links that were not created by these Belvo users.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: d9475f4d-c511-4732-9ef0-93b5672f43d3
    created_at__gt:
      name: created_at__gt
      in: query
      description: Return items that were last updated in Belvo's database after this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
  schemas:
    last_accessed_at:
      type:
      - string
      - 'null'
