          description: The base amount of the salary, before any deductions or bonuses.
          example: 1033.09
        retained_amount:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: The amount retained by Brazil's *Instituto Nacional do Seguro Social* (INSS).
