openapi: 3.2.0
info:
  title: Belvo API Docs Tax returns API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Tax returns
paths:
  /api/tax-returns/:
    get:
      tags:
      - Tax returns
      operationId: ListTaxReturns
      summary: List tax returns
      description: '## ▶️ Usage


        With the List Tax Returns method, you can:


        1. List tax returns related to a specific `link.id` (using the `link` query parameter).

        2. Get the details of a specific `tax-return.id` (using the `id` query parameter).

        3. **[Not Recommended]** List all tax returns related to your Belvo account (without using any query parameters).


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.


        ## 🔔 Multiple Schemas


        As a link can have both yearly and monthly tax returns, the response will include a mix of these two types of tax returns (and thus difference schemas).'
      parameters:
      - $ref: '#/components/parameters/link'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/link__in'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      - $ref: '#/components/parameters/ejercicio'
      - $ref: '#/components/parameters/ejercicio__lt'
      - $ref: '#/components/parameters/ejercicio__lte'
      - $ref: '#/components/parameters/ejercicio__gt'
      - $ref: '#/components/parameters/ejercicio__gte'
      - $ref: '#/components/parameters/ejercicio__range'
      - $ref: '#/components/parameters/tipo_declaracion'
      - $ref: '#/components/parameters/tipo_declaracion__in'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: "An array of:\n\n  - Tax Return Personal (Yearly) objects\n  - Tax Return Personal (Monthly) objects\n  - Tax Return Business (Yearly) objects\n  - Tax Return Business (Monthly) objects\n  \n  > \U0001F6A7 Multiple Schemas\n  >\n  > As a link can have both yearly and monthly tax returns, the response will include a mix of these two types of tax returns (and thus difference schemas).\n"
                      items:
                        anyOf:
                        - $ref: '#/components/schemas/TaxReturnPersonal'
                        - $ref: '#/components/schemas/TaxReturnPersonalMonthly'
                        - $ref: '#/components/schemas/TaxReturnBusiness'
                        - $ref: '#/components/schemas/TaxReturnBusinessMonthly'
              examples:
                TaxReturnPersonal:
                  $ref: '#/components/examples/TaxReturnPersonalListPaginated'
                TaxReturnPersonalMonthlyPFAE:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPaginatedPFAE'
                TaxReturnPersonalMonthlyPFAI:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPaginatedPFAI'
                TaxReturnBusiness:
                  $ref: '#/components/examples/TaxReturnBusinessListPaginated'
                TaxReturnBusinessMonthly:
                  $ref: '#/components/examples/TaxReturnBusinessListMonthlyPaginated'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    post:
      tags:
      - Tax returns
      operationId: RetrieveTaxReturns
      summary: Retrieve tax returns for a link
      description: Retrieve tax return information for a specific fiscal link.
      parameters:
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/TaxReturnsMonthlyRequest'
              - $ref: '#/components/schemas/TaxReturnsYearlyRequest'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/TaxReturnPersonal'
                  - $ref: '#/components/schemas/TaxReturnPersonalMonthly'
                  - $ref: '#/components/schemas/TaxReturnBusiness'
                  - $ref: '#/components/schemas/TaxReturnBusinessMonthly'
              examples:
                TaxReturnPersonal:
                  $ref: '#/components/examples/TaxReturnPersonalList'
                TaxReturnPersonalMonthlyPFAE:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPFAE'
                TaxReturnPersonalMonthlyPFAI:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPFAI'
                TaxReturnBusiness:
                  $ref: '#/components/examples/TaxReturnBusinessList'
                TaxReturnBusinessMonthly:
                  $ref: '#/components/examples/TaxReturnBusinessListMonthly'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/TaxReturnPersonal'
                  - $ref: '#/components/schemas/TaxReturnPersonalMonthly'
                  - $ref: '#/components/schemas/TaxReturnBusiness'
                  - $ref: '#/components/schemas/TaxReturnBusinessMonthly'
              examples:
                TaxReturnPersonal:
                  $ref: '#/components/examples/TaxReturnPersonalList'
                TaxReturnPersonalMonthlyPFAE:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPFAE'
                TaxReturnPersonalMonthlyPFAI:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPFAI'
                TaxReturnBusiness:
                  $ref: '#/components/examples/TaxReturnBusinessList'
                TaxReturnBusinessMonthly:
                  $ref: '#/components/examples/TaxReturnBusinessListMonthly'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/tax-returns/{id}/:
    get:
      tags:
      - Tax returns
      operationId: DetailTaxReturn
      summary: Get a tax return's details
      description: Get the details of a specific tax return.
      parameters:
      - name: id
        in: path
        required: true
        description: The `tax-return.id` you want to get detailed information about.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TaxReturnPersonal'
                - $ref: '#/components/schemas/TaxReturnPersonalMonthly'
                - $ref: '#/components/schemas/TaxReturnBusiness'
                - $ref: '#/components/schemas/TaxReturnBusinessMonthly'
              examples:
                TaxReturnPersonal:
                  $ref: '#/components/examples/TaxReturnPersonalListDetail'
                TaxReturnPersonalMonthlyPFAE:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPFAEDetail'
                TaxReturnPersonalMonthlyPFAI:
                  $ref: '#/components/examples/TaxReturnPersonalListMonthlyPFAIDetail'
                TaxReturnBusiness:
                  $ref: '#/components/examples/TaxReturnBusinessListDetail'
                TaxReturnBusinessMonthly:
                  $ref: '#/components/examples/TaxReturnBusinessListMonthlyDetail'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    delete:
      tags:
      - Tax returns
      operationId: DestroyTaxReturn
      summary: Delete a tax return
      description: Delete a specific tax return from your Belvo account.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the tax return you want to delete.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    omit:
      name: omit
      in: query
      description: Omit certain fields from being returned in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    created_at__lte:
      name: created_at__lte
      in: query
      description: Return items that were last updated in Belvo's database before or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-03-30'
    link:
      name: link
      in: query
      description: 'The `link.id` you want to filter by.


        ℹ️ We highly recommend adding the `link.id` filter in order to improve your performance.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    ejercicio__lt:
      name: ejercicio__lt
      in: query
      description: Return tax returns for before this year (`YYYY`).
      schema:
        type: integer
        pattern: ^[0-9]{4}$
        minimum: 1900
        minLength: 4
        maxLength: 4
        example: 2017
    page_size:
      name: page_size
      in: query
      description: 'Indicates how many results to return per page. By default we return 100 results per page.


        ℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).

        '
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    id:
      name: id
      in: query
      description: Return information only for this resource `id`.
      schema:
        type: string
        format: uuid
        example: 24ccab1d-3a86-4136-a6eb-e04bf52b356f
    ejercicio__lte:
      name: ejercicio__lte
      in: query
      description: Return tax returns for this year and earlier (`YYYY`).
      schema:
        type: integer
        pattern: ^[0-9]{4}$
        minimum: 1900
        minLength: 4
        maxLength: 4
        example: 2017
    ejercicio__gt:
      name: ejercicio__gt
      in: query
      description: Return tax returns for after this year (`YYYY`).
      schema:
        type: integer
        pattern: ^[0-9]{4}$
        minimum: 1900
        minLength: 4
        maxLength: 4
        example: 2017
    created_at__range:
      name: created_at__range
      in: query
      description: Return accounts that were last updated in Belvo's database between two dates (in `YYYY-MM-DD` format). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          format: date
          example: '2022-03-03'
        example:
        - '2022-01-01'
        - '2022-12-31'
    ejercicio__range:
      name: ejercicio__range
      in: query
      description: Return tax returns for this range of years (`YYYY`). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: integer
          pattern: ^[0-9]{4}$
          minimum: 1900
          minLength: 4
          maxLength: 4
          example: 2017
        example:
        - 2015
        - 2021
    ejercicio:
      name: ejercicio
      in: query
      description: Return tax returns for exactly this year (`YYYY`).
      schema:
        type: integer
        pattern: ^[0-9]{4}$
        minimum: 1900
        minLength: 4
        maxLength: 4
        example: 2017
    link__in:
      name: link__in
      in: query
      description: Return results only for these `link.id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 5722d0ba-69d7-42dc-8ff5-33767b83c5d6
    created_at__gte:
      name: created_at__gte
      in: query
      description: Return items that were last updated in Belvo's database after or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-04'
    fields:
      name: fields
      in: query
      description: Return only the specified fields in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    tipo_declaracion__in:
      name: tipo_declaracion__in
      in: query
      description: Return tax returns with these declaration types.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: Commercial
    page:
      name: page
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    tipo_declaracion:
      name: tipo_declaracion
      in: query
      description: Return tax returns with this declaration type.
      schema:
        type: string
        example: Normal
    id__in:
      name: id__in
      in: query
      description: Return information for these resource `id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 6b3dea0f-be29-49d1-aabe-1a6d588642e6
    created_at__lt:
      name: created_at__lt
      in: query
      description: Return items that were last updated in Belvo's database before this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-04-01'
    created_at:
      name: created_at
      in: query
      description: Return items that were last updated in Belvo's database on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    ejercicio__gte:
      name: ejercicio__gte
      in: query
      description: Return tax returns for this year or later (`YYYY`).
      schema:
        type: integer
        pattern: ^[0-9]{4}$
        minimum: 1900
        minLength: 4
        maxLength: 4
        example: 2017
    created_at__gt:
      name: created_at__gt
      in: query
      description: Return items that were last updated in Belvo's database after this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
  schemas:
    TaxReturnBusiness:
      type: object
      additionalProperties: true
      title: Tax Return Business (Yearly)
      x-tags:
      - Tax returns
      required:
      - id
      - collected_at
      - created_at
      - informacion_general
      - datos_adicionales
      - estado_resultados
      - estado_posicion_financiera_balance
      - conciliacion_entre_resultado_contable_fiscal
      - deducciones_autorizadas
      - cifras_cierre_ejercicio
      - determinacion_del_impuesto_sobre_la_renta
      - dividendos_o_utilidades_distribuidos
      - detalle_pago_r1_isr_personas_morales
      - pdf
      - receipt_pdf
      properties:
        id:
          $ref: '#/components/schemas/id'
        collected_at:
          $ref: '#/components/schemas/collected_at'
        created_at:
          $ref: '#/components/schemas/created_at'
        informacion_general:
          type:
          - object
          - 'null'
          description: 'General information regarding the tax return (year, RFC, return type,

            person/company name, and so on).

            '
        datos_adicionales:
          type:
          - object
          - 'null'
          description: Additional data regarding the tax return.
        estado_resultados:
          type:
          - object
          - 'null'
          description: 'Detailed information about the legal entity''s yearly profit and loss.


            > **Note**: For tax returns submitted for the 2022 tax year and later, this field will return null as it is no longer a required field when submitting your tax return.

            '
        estado_posicion_financiera_balance:
          type:
          - object
          - 'null'
          description: 'Details regarding balance sheet of the legal entity.


            > **Note**: For tax returns submitted for the 2022 tax year and later, this field will return null as it is no longer a required field when submitting your tax return.

            '
        conciliacion_entre_resultado_contable_fiscal:
          type:
          - object
          - 'null'
          description: 'Details regarding the accounting reconciliation.


            > **Note**: For tax returns submitted for the 2022 tax year and later, this field will return null as it is no longer a required field when submitting your tax return.

            '
        deducciones_autorizadas:
          type:
          - object
          - 'null'
          description: Details regarding the legal entity's deductions.
        cifras_cierre_ejercicio:
          type:
          - object
          - 'null'
          description: Details regarding key numbers at the end of the fiscal exercise.
        determinacion_del_impuesto_sobre_la_renta:
          type:
          - object
          - 'null'
          description: Details regarding the final tax return.
        dividendos_o_utilidades_distribuidos:
          type:
          - object
          - 'null'
          description: Details regarding distributed dividends.
        detalle_pago_r1_isr_personas_morales:
          type:
          - object
          - 'null'
          description: Details of the tax payment.
        ingressos:
          type:
          - object
          - 'null'
          description: '> **Note**: Only applicable for tax return filed on or after 2022. For tax returns filed before 2022, this field will return `null`.


            Details regarding the total amounts earned in the fiscal year.

            '
        determinacion:
          type:
          - object
          - 'null'
          description: '> **Note**: Only applicable for tax return filed on or after 2022. For tax returns filed before 2022, this field will return `null`.


            Details regarding the tax due or tax credit.

            '
        pdf:
          type:
          - string
          - 'null'
          format: binary
          description: Tax return PDF as a binary.
          example: =PDF-STRING=
        receipt_pdf:
          type:
          - string
          - 'null'
          format: binary
          description: 'The acknowledgement receipt from the fiscal institution confirming that

            they received the tax return.

            '
          example: =PDF-STRING=
    InstitutionUnavailableError:
      type: object
      title: Institution Unavailable
      description: 'This error occurs when the institution''s website that you''re trying to access is down due to maintenance or other issues, which means Belvo is unable to create new links or retrieve new data.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`institution_unavailable`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-institution_unavailable" target="_blank">400 institution_unavailable errors</a>.

            '
          example: institution_unavailable
        message:
          type: string
          description: "A short description of the error.\n\n\nFor `institution_unavailable` errors, the description is:\n  \n  - `The financial institution is unavailable`.\n"
          example: The financial institution is unavailable
        request_id:
          $ref: '#/components/schemas/request_id'
    InvalidFetchHistorical:
      type: object
      title: Invalid Fetch Resources
      description: 'This error occurs when you attempted to create a link where you set `credentials_storage` to `nostore` and did not send any resources in the `fetch_resources`. For links where we don''t store credentials, you must send through an array of resources in `fetch_resources`.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_fetch_resources`) that allows you to classify and handle the error programmatically.



