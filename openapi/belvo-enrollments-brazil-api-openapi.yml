openapi: 3.2.0
info:
  title: Belvo API Docs Enrollments (Brazil) API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Enrollments (Brazil)
paths:
  /payments/br/enrollments/:
    post:
      tags:
      - Enrollments (Brazil)
      operationId: CreateEnrollmentBrazil
      summary: Enroll a new user device
      description: '## ▶️ Usage


        With the **Enroll a new user device** method, you can begin the enrollment process for a new device to allow for Biometric payments.


        > 🚧 Create a customer first

        >

        > Before you can enroll a user device, you must first create a customer.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentBiometricPix'
      responses:
        '201':
          description: OK (Created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentBiometricPix'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    get:
      tags:
      - Enrollments (Brazil)
      operationId: ListEnrollmentsBrazil
      summary: List enrollments
      description: '## ▶️ Usage


        With the List Enrollments method, you can:


        1. (Recommended) List enrollments related to a specific CPF (using the `customer__identifier` query parameter).

        2. List enrollments related to a specific `customer.id` and `institution.id` (using the `customer` and `institution` query parameters).

        3. List enrollments according to a specific status (using the `status` query parameter).

        4. **[Not Recommended]** List all enrollements related to your Belvo account (without using any query parameters).


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.'
      parameters:
      - $ref: '#/components/parameters/customer_identifier'
      - $ref: '#/components/parameters/customer'
      - $ref: '#/components/parameters/external_id__payments'
      - $ref: '#/components/parameters/external_id__in__payments'
      - $ref: '#/components/parameters/institution'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/status_enrollments'
      - $ref: '#/components/parameters/status__in_enrollments'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of enrollment objects.
                      items:
                        $ref: '#/components/schemas/EnrollmentBiometricPix'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/enrollments/{enrollment_id}/:
    get:
      tags:
      - Enrollments (Brazil)
      operationId: DetailEnrollmentBrazil
      summary: Get details about an enrollment
      description: Get details regarding a specific device enrollment.
      parameters:
      - name: enrollment_id
        required: true
        in: path
        description: The `enrollment.id` you want to get details for.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentBiometricPix'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/enrollments/complete-redirection/:
    post:
      tags:
      - Enrollments (Brazil)
      operationId: CompleteEnrollmentRedirectionBrazil
      summary: Complete enrollment after redirection
      description: '## ▶️ Usage


        Use this endpoint to complete the enrollment process after the user is redirected back from the institution. The request body should match the parameters received in the callback URL, either for a successful or error callback.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Successful Callback
                required:
                - state
                properties:
                  state:
                    type: string
                    description: The value of the `state` query parameter you received in the callback URL.
                    example: abc123
                  code:
                    type: string
                    description: The value of the `code` query parameter you received in the callback URL.
                    example: xyz456
                  id_token:
                    type: string
                    description: The value of the `id_token` query parameter you received in the callback URL.
                    example: idtoken789
              - type: object
                title: Error Callback
                required:
                - state
                - error
                - error_description
                properties:
                  state:
                    type: string
                    description: The value of the `state` query parameter you received in the callback URL.
                    example: abc123
                  error:
                    type: string
                    description: The value of the `error` query parameter you received in the callback URL.
                    example: access_denied
                  error_description:
                    type: string
                    description: The value of the `error_description` query parameter you received in the callback URL.
                    example: The user denied access.
      responses:
        '200':
          description: OK (Enrollment Successfully Updated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentBiometricPix'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    customer_identifier:
      name: customer__identifier
      in: query
      description: The CPF of the customer you want to get results for.
      schema:
        type: string
        minLength: 11
        maxLength: 14
        example: 23100299900
    status__in_enrollments:
      name: status__in
      in: query
      description: "Return enrollments with these statuses:\n  - `PENDING`\n  - `SUCCEEDED`\n  - `CANCELED`\n  - `FAILED`\n"
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: PENDING
    customer:
      name: customer
      in: query
      description: The `customer.id` you want to get results for.
      schema:
        type: string
        format: uuid
        example: 24e5b3a5-19aa-40fe-91e5-4db7f22ecc2d
    page:
      name: page
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    external_id__in__payments:
      name: external_id__in
      in: query
      description: Return objects with these external IDs.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 446bdd9f-5b3e-4c05-9159-7a5c87cfc810
    external_id__payments:
      name: external_id
      in: query
      description: Return objects with this external ID.
      schema:
        type: string
        format: uuid
        example: 295ebb46-65b8-47de-85cd-34ffbc327c09
    page_size:
      name: page_size
      in: query
      description: 'Indicates how many results to return per page. By default we return 100 results per page.


        ℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).

        '
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    institution:
      name: institution
      in: query
      description: Return results only for this institution (use the Belvo-designated name, such as `planet_mx_employment`).
      schema:
        type: string
        pattern: ^[a-z_]{1,40}$
        minLength: 1
        maxLength: 40
        example: planet_mx_retail
    status_enrollments:
      name: status
      in: query
      description: "Return enrollments with the given status. Can be either:\n  - `PENDING`\n  - `SUCCEEDED`\n  - `CANCELED`\n  - `FAILED`\n"
      schema:
        type: string
        example: PENDING
  responses:
    408_request_timeout_error:
      description: Request Timeout
      content:
        application/json:
          schema:
            type: array
            title: Request Timeout
            description: "Belvo has a limit regarding the time it takes to log in, retrieve account data, and log out. A timeout occurs when there is a very high amount of data and everything could not be obtained within the allotted time.\n  \n"
            items:
              $ref: '#/components/schemas/RequestTimeoutError'
    403_access_denied_error:
      description: Access to Belvo API denied
      content:
        application/json:
          schema:
            type: array
            description: 'This error occurs when you try to access Belvo''s resource without the correct permissions.

              '
            items:
              $ref: '#/components/schemas/AccessToResourceDenied'
    401_unauthorized_error:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: array
            items:
              anyOf:
              - $ref: '#/components/schemas/UnauthorizedError'
              - $ref: '#/components/schemas/ConsentWithoutAccountsError'
    404_not_found_error:
      description: Not Found Error
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/NotFoundError'
    500_unexpected_error:
      description: Unexpected Error
      content:
        application/json:
          schema:
            type: array
            title: Unexpected Error
            description: "This error occurs when we (Belvo) have encountered an internal system error (sorry about that) or due to an unsupported response from the institution.\n  \n"
            items:
              $ref: '#/components/schemas/UnexpectedError'
  schemas:
    request_id:
      type: string
      pattern: '[a-f0-9]{32}'
      description: 'A 32-character unique ID of the request (matching a regex pattern of: `[a-f0-9]{32}`). Provide this ID when contacting the Belvo support team to accelerate investigations.

        '
      example: 9e7b283c6efa449c9c028a16b5c249fb
    ConsentWithoutAccountsError:
      type: object
      title: Consent Without Accounts
      description: 'This error occurs when your user has removed accounts associated with the consent they provided. For example, when your user first generated their consent, they had a checking and a loan account at the institution but has closed those accounts since then.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`consent_without_accounts`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#401-consent_without_accounts" target="_blank">401 consent_without_accounts errors</a>.

            '
          example: consent_without_accounts
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid` errors relating to `fetch_resources`, the description is:\n  \n  - `The institution only supports the following resources: (comma-separated list of supported resources)`.\n"
          example: 'The institution only supports the following resources: EMPLOYMENT_RECORDS, OWNERS'
        request_id:
          $ref: '#/components/schemas/request_id'
    UnauthorizedError:
      type: object
      title: Unauthorized Error
      description: 'This error occurs when you try to make an API call using incorrect Belvo API credentials (either your secret key or secret password, or both, are incorrect).

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`authentication_failed`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#401-authentication_failed" target="_blank">401 authentication_failed errors</a>.

            '
          example: authentication_failed
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `authentication_failed` errors, the description is:\n\n  - `Invalid Secret Keys`.\n"
          example: Invalid Secret Keys
        request_id:
          $ref: '#/components/schemas/request_id'
    400_validation_error:
      type: object
      title: Validation Error
      required:
      - code
      - message
      - request_id
      description: 'This error occurs when the parameters provided did not match the expected fields or the item you are trying to create is already in our database, leading to a field validation errors.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`null`, `does_not_exist`, `required`, `already_registered`, `invalid_choice`, `max_length`, `min_length`, `blank`, `null`, `cancellation_error`, `idempotency_key_invalid`) that allows you to classify and handle the error programmatically.

            '
          example: required
        message:
          type: string
          description: "A short description of the error.\n\n\nThe description can be (among others):\n\n  - `This field is required.`\n  - `Object with name=narnia does not exist.`\n  - `This field may not be null.`\n  - `This field may not be blank.`\n  - `This customer is already registered`\n  - `Ensure this field has at least 2 characters.`\n  - `Ensure this field has no more than 4 characters.`\n  - `Entered value is not valid.`\n  - `You must set all required fields: username, password, username_type.`\n  - `Payment Intent cannot be canceled because it is not SCHEDULED.`\n  - `Payment Intent cannot be canceled as the cutoff time (23:59:00) has passed.`\n  - `The provided idempotency key is invalid.`\n"
          example: This field is required.
        request_id:
          $ref: '#/components/schemas/request_id'
        field:
          type:
          - string
          - 'null'
          description: 'Name of the field where the error was encountered.


            > **Note**: This field is only present when the error is related to a specific field.

            '
          example: institution
    AccessToResourceDenied:
      type: object
      title: Access to Belvo API denied
      description: 'This error occurs when you try to access Belvo''s resource without the correct permissions.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`access_to_resource_denied`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#403-access_to_resource_denied" target="_blank">403 access_to_resource_denied</a>.

            '
          example: access_to_resource_denied
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `access_to_resource_denied` errors, the description is:\n  \n  - `You don't have access to this resource.`.\n"
          example: You don't have access to this resource.
        request_id:
          $ref: '#/components/schemas/request_id'
    UnexpectedError:
      type: object
      title: Unexpected Error
      description: 'This error occurs when we (Belvo) have encountered an internal system error (sorry about that) or due to an unsupported response from the institution.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`unexpected_error`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#500-unexpected_error" target="_blank">500 unexpected_error errors</a>.

            '
          example: unexpected_error
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `unexpected_error` errors, the description is:\n  \n  - `Belvo is unable to process the request due to an internal system issue or to an unsupported response from an institution`.\n"
          example: Belvo is unable to process the request due to an internal system issue or to an unsupported response from an institution
        request_id:
          $ref: '#/components/schemas/request_id'
    external_id__payments:
      type: string
      format: uuid
      description: "An additional unique identifier for the resource for internal purposes.\n\n{% admonition type=\"success\" name=\"Highly Recommended\" %}\n  We recommend using this field to store your own unique identifier for each resource (customer, bank account, payment intent, or enrollment). This can be useful for tracking the resource in your system and for debugging purposes.\n{% /admonition %}\n"
      example: 4b8a81a0-e33c-45a6-8567-479efb105f73
    NotFoundError:
      type: object
      title: Not Found
      properties:
        code:
          type: string
          description: 'A unique error code (`not_found`) that allows you to classify and handle the error programmatically.

            '
          example: not_found
        message:
          type: string
          description: "A short description of the error.\n\n\nFor `not_found` errors, the description is:\n\n  - `Not found`\n"
          example: Not found
        request_id:
          $ref: '#/components/schemas/request_id'
    CreateEnrollmentBiometricPix:
      type: object
      description: Request body to create a new device enrollment.
      required:
      - type
      - details
      properties:
        type:
          type: string
          enum:
          - open_finance_biometric_pix
          description: "The type of enrollment. For \U0001F1E7\U0001F1F7 Brazil's OFPI, can be either:\n\n  - `open_finance_biometric_pix`: For biometric payments using the PIX network.\n"
          example: open_finance_biometric_pix
        details:
          type: object
          required:
          - customer
          - institution
          - platform
          - risk_signals
          description: 'The details of the enrollment to be created.

            '
          properties:
            customer:
              type: string
              format: uuid
              description: Belvo's unique ID to reference the customer.
              example: c860809f-e96d-4d50-9588-f40ffab77302
            institution:
              type: string
              format: uuid
              description: Belvo's unique ID to reference the payer's institution.
              example: 600f1b4a-1ef9-4f89-b341-1a35f0c32cc0
            name:
              type: string
              maxLength: 140
              description: 'A human-readable name for the device enrollment.

                '
              example: 600f1b4a-Mobile
            callback_url:
              type: string
              format: uri
              description: 'The URL to redirect your user to after the enrollment process is completed.

                '
              example: https://example.com/enrollment-in-progress
            platform:
              type: string
              enum:
              - ANDROID
              - BROWSER
              - CROSS_PLATFORM
              - IOS
              description: "The platform of the device to be enrolled. Can be either:\n\n  - `ANDROID`: For Android devices.\n  - `BROWSER`: For web browsers.\n  - `CROSS_PLATFORM`: For cross-platform devices.\n  - `IOS`: For iOS devices.\n"
              example: ANDROID
            risk_signals:
              type: object
              description: Details regarding the device to be enrolled. This is the JSON-formatted object received from the Belvo Android or iOS SDK.
    EnrollmentBiometricPix:
      type: object
      description: Details regarding the device enrollment for Biometric payments.
      properties:
        id:
          type: string
          format: uuid
          description: Belvo's unique identifier of the enrollment.
          example: 600f1b4a-1ef9-4f89-b341-1a35f0c32cc0
        created_by:
          type: string
          format: uuid
          description: The Belvo ID of the merchant that created the enrollment.
          example: dbdce1e9-d089-4b7d-804b-51dd07748202
        created_at:
          type: string
          format: date-time
          description: The ISO-8601 timestamp of when the data point was created in Belvo's database.
          example: '2024-11-26T11:20:57.389056Z'
        updated_at:
          type: string
          format: date-time
          description: The ISO-8601 timestamp of when the enrollment was last updated.
          example: '2024-11-26T11:20:57.389058Z'
        external_id:
          $ref: '#/components/schemas/external_id__payments'
        type:
          type: string
          enum:
          - open_finance_biometric_pix
          description: "The type of enrollment. For \U0001F1E7\U0001F1F7 Brazil's OFPI, can be either:\n\n  - `open_finance_biometric_pix`: For biometric payments using the PIX network.\n"
          example: open_finance_biometric_pix
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - CANCELED
          - FAILED
          description: 'The status of the device enrollment. Can be either:


            - `PENDING`: The enrollment is pending.

            - `SUCCEEDED`: The enrollment was successful.

            - `CANCELED`: The enrollment was canceled.

            - `FAILED`: The enrollment failed.

            '
          example: PENDING
        status_reason_code:
          type:
          - string
          - 'null'
          description: "A machine-readable code providing the reason for a failed enrollment. Only present when `status` is `FAILED`.\n\nPossible values:\n  - `send_risk_signals_failed`: Enrollment rejected due to timeout while sending risk signals.\n  - `redirection_to_institution_failed`: Enrollment rejected because the redirection to the institution was not successfully completed.\n  - `biometric_registration_failed`: Enrollment rejected because the biometric registration was not completed successfully within the allowed time.\n  - `too_many_device_registration_attempts`: Enrollment rejected due to too many failed device registration attempts.\n  - `rejected_by_user`: Enrollment was manually cancelled by the user.\n  - `device_not_supports_biometric_authentication`: Enrollment rejected because the device is not compatible with biometric authentication.\n  - `institution_infra_failed`: Enrollment rejected due to infrastructure issues at the institution.\n  - `blocked_by_institution_security_policy`: Enrollment rejected due to the institution security policy decisions based on risk evaluation.\n  - `redirection_back_from_institution_failed`: Enrollment rejected because the redirection back from the institution was not successfully completed.\n  - `biometric_validation_error`: Enrollment failed due to biometric validation or public key registration issues.\n  - `rejected_other`: Enrollment rejected for an unspecified reason.\n  - `canceled_due_to_expiration`: Enrollment canceled due to expiration of validity period.\n"
          example: biometric_registration_failed
        status_reason_message:
          type:
          - string
          - 'null'
          description: 'A human-readable message providing more details about the reason for a failed enrollment. Only present when `status` is `FAILED`. Please see `status_reason_code` for example messages for each reason code.

            '
          example: Enrollment rejected because the biometric registration was not completed successfully within the allowed time.
        details:
          type: object
          description: Details regarding the enrollment
          properties:
            status:
              type: string
              enum:
              - AWAITING_ACCOUNT_HOLDER_VALIDATION
              - AWAITING_ENROLLMENT
              - AUTHORIZED
              - REJECTED
              - REVOKED
              description: "The status of the Biometric payments enrollment. Can be either:\n\n  - `AWAITING_ACCOUNT_HOLDER_VALIDATION`: The account holder needs to validate the enrollment by sending their biometric data.\n  - `AWAITING_ENROLLMENT`: The enrollment information has been sent to the institution and is being evaluated.\n  - `AUTHORIZED`: The enrollment has been authorized.\n  - `REJECTED`: The institution has rejected the enrollment.\n  - `REVOKED`: The user or the institution has revoked the enrollment.\n"
              example: AWAITING_ACCOUNT_HOLDER_VALIDATION
            customer:
              type: string
              format: uuid
              description: Belvo's unique ID to reference the customer.
              example: c860809f-e96d-4d50-9588-f40ffab77302
            institution:
              type: string
              format: uuid
              description: Belvo's unique ID to reference the institution the device is enrolled at.
              example: 600f1b4a-1ef9-4f89-b341-1a35f0c32cc0
            platform:
              type: string
              enum:
              - ANDROID
              - BROWSER
              - CROSS_PLATFORM
              - IOS
              description: "The platform of the device to be enrolled. Can be either:\n\n  - `ANDROID`: For Android devices.\n  - `BROWSER`: For web browsers.\n  - `CROSS_PLATFORM`: For cross-platform devices.\n  - `IOS`: For iOS devices.\n"
              example: ANDROID
            name:
              type:
              - string
              - 'null'
              description: 'An internal name for this device enrollment.

                '
              example: 600f1b4a-Mobile
            callback_url:
              type: string
              format: uri
              description: 'The URL to redirect your user to after the enrollment process is completed.

                '
              example: https://example.com/enrollment-in-progress
            redirect_url:
              type: string
              format: uri
              description: 'The URL to redirect the user to complete their enrollment at the institution.

                '
              example: https://www.acmecorp.com/checkout/3487321
            risk_signals:
              type: string
              description: An obfuscated string (`******`) used to indicate that risk signals have been provided.
              example: '******'
            expires_at:
              type: string
              format: date-time
              description: 'The ISO-8601 timestamp of when the enrollment will expire. After this time, the enrollment will no longer be valid and the `status` will transition to `CANCELED` and the `status_reason_code` will be set to `canceled_due_to_expiration`.

                '
              example: '2026-12-26T11:20:57.389056Z'
        metadata:
          type: object
          description: 'Optional and customizable object where you can provide any additional key-value pairs for your internal purposes. For example, an internal reference number for the enrollment.



            ⚠️ **Note**: You can only provide up to 50 keys (keys can have up to 50 characters each and each value can be up to 500 characters). We do not support nested objects, only ASCII values.

            '
          example:
            internal_reference_id: GGq73487w2
    RequestTimeoutError:
      type: object
      title: Request Timeout
      description: 'Belvo has a limit regarding the time it takes to log in, retrieve account data, and log out. A timeout occurs when there is a very high amount of data and everything could not be obtained within the allotted time.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`request_timeout`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#408-request_timeout" target="_blank">408 request_timeout errors</a>.

            '
          example: request_timeout
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `request_timeout` errors, the description is:\n  \n  - `The request timed out, you can retry asking for less data by changing your query parameters`.\n"
          example: The request timed out, you can retry asking for less data by changing your query parameters
        request_id:
          $ref: '#/components/schemas/request_id'
    common_pagination_properties:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: The total number of results in your Belvo account.
          example: 130
        next:
          type:
          - string
          - 'null'
          format: uri
          description: 'The URL to next page of results. Each page consists of up to 100 items. If there are not enough results for an additional page, the value is `null`.


            In our documentation example, we use `{endpoint}` as a placeholder value. In production, this value will be replaced by the actual endpoint you are currently using (for example, `accounts` or `owners`).

            '
          example: https://sandbox.belvo.com/api/{endpoint}/?link=1bd948f7-245d-4313-b604-34d1044cb908&page=2
        previous:
          type:
          - string
          - 'null'
          format: uri
          description: 'The URL to the previous page of results. If there is no previous page, the

            value is `null`.

            '
          example: null
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: "Belvo employs **basic authentication** using your secret keys (You can find your API secret keys in your Belvo Dashboard, under the **Developers** section).\n\n\nTo authenticate, you need to use your API `secretId` as the `username` and your API `secretPassword` as the `password`. These credentials need to be **Base64 encoded** and included in the `Authorization` header of your HTTP requests. For example:\n\n\n```shell\ncurl -X GET https://sandbox.belvo.com/api/ \\\n  -H \"Authorization: Basic $(echo -n 'YOUR_SECRET_ID:YOUR_SECRET_PASSWORD' | base64)\"\n```\n\nReplace `YOUR_SECRET_ID` and `YOUR_SECRET_PASSWORD` with your actual credentials. **Never expose your credentials in client-side code or public repositories**."
