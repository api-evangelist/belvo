          $ref: '#/components/schemas/request_id'
    PatchBankAccountActive:
      type: object
      title: Patch bank account active status
      required:
      - active
      properties:
        active:
          type: boolean
          description: 'When set to `false`, deactivates this bank account. A deactivated account no longer counts toward uniqueness for the same institution, agency, and account number, so you can register a new bank account with the same banking details (for example, after correcting the holder name, CPF/CNPJ, or other metadata).


            When set to `true`, reactivates a previously deactivated bank account.

            '
          example: false
    CreateBankAccountOfpiIndividual:
      type: object
