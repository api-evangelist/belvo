openapi: 3.2.0
info:
  title: Belvo API Docs Bank Accounts (Brazil) API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Bank Accounts (Brazil)
  description: 'To receive inflow payments to your organization''s bank account, you must register the bank accounts (individual and business) using Belvo''s Payments API.


    - **Individual** bank accounts must be created for each payer (your customer).

    - **Business** bank accounts need to be created for the beneficiary of the payment (your organization).


    {% admonition type="info" name="Resource Versioning" %}

    This endpoint supports resource-level versioning. By including the header `X-Belvo-API-Resource-Version: Payments-BR.V2`, you can access the latest (V2) request and response formats. If the header is not provided, the default (V1) format will be used. See the API documentation for details on the differences between versions.

    {% /admonition %}'
paths:
  /payments/br/bank-accounts/:
    post:
      tags:
      - Bank Accounts (Brazil)
      operationId: RegisterBankAccountBrazil
      summary: Register a new bank account
      description: Register a new bank account from which to send or request funds.
      parameters:
      - $ref: '#/components/parameters/header_version'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreateBankAccountV2'
              - $ref: '#/components/schemas/CreateBankAccountOfpiBusiness'
              - $ref: '#/components/schemas/CreateBankAccountOfpiIndividual'
      responses:
        '201':
          description: OK (Created)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BankAccountV2'
                - $ref: '#/components/schemas/BankAccountOfpiResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    get:
      tags:
      - Bank Accounts (Brazil)
      operationId: ListBankAccountBrazil
      summary: List all bank accounts
      description: List all bank accounts associated with your Belvo account.
      parameters:
      - $ref: '#/components/parameters/header_version'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      - $ref: '#/components/parameters/number'
      - $ref: '#/components/parameters/number__in'
      - $ref: '#/components/parameters/customer'
      - $ref: '#/components/parameters/external_id__payments'
      - $ref: '#/components/parameters/external_id__in__payments'
      - $ref: '#/components/parameters/institution'
      - $ref: '#/components/parameters/holder__type'
      - $ref: '#/components/parameters/holder__type__in'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of bank account objects.
                      items:
                        oneOf:
                        - $ref: '#/components/schemas/BankAccountV2'
                        - $ref: '#/components/schemas/BankAccountOfpiResponse'
              examples:
                OfpiBusinessPixInfo:
                  $ref: '#/components/examples/ResponseBankAccountBusinessPixInfoPaginated'
                OfpiIndividualPixInfo:
                  $ref: '#/components/examples/ResponseBankAccountIndividualPixInfoPaginated'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/bank-accounts/{id}/:
    patch:
      tags:
      - Bank Accounts (Brazil)
      operationId: PatchBankAccountBrazil
      summary: Activate or deactivate a bank account
      description: 'Updates whether a bank account is active by setting `active` to `true` or `false`.


        Setting `active` to `false` deactivates the bank account identified in the path. Deactivated accounts are ignored for duplicate checks on the same institution, agency, and account number, which lets you register a new bank account with the same banking details when you need to fix incorrect holder information (such as name or CPF/CNPJ) or similar mistakes from an initial registration.'
      parameters:
      - $ref: '#/components/parameters/header_version'
      - name: id
        required: true
        in: path
        description: The `bank-account.id` you want to activate or deactivate.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBankAccountActive'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BankAccountV2'
                - $ref: '#/components/schemas/BankAccountOfpiResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    get:
      tags:
      - Bank Accounts (Brazil)
      operationId: DetailBankAccountBrazil
      summary: Get details about a bank account
      description: Get the details about a specific bank account
      parameters:
      - $ref: '#/components/parameters/header_version'
      - name: id
        required: true
        in: path
        description: The `bank-account.id` you want to get detailed information about.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BankAccountV2'
                - $ref: '#/components/schemas/BankAccountOfpiResponse'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  schemas:
    RequestTimeoutError:
      type: object
      title: Request Timeout
      description: 'Belvo has a limit regarding the time it takes to log in, retrieve account data, and log out. A timeout occurs when there is a very high amount of data and everything could not be obtained within the allotted time.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`request_timeout`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#408-request_timeout" target="_blank">408 request_timeout errors</a>.

            '
          example: request_timeout
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `request_timeout` errors, the description is:\n  \n  - `The request timed out, you can retry asking for less data by changing your query parameters`.\n"
          example: The request timed out, you can retry asking for less data by changing your query parameters
        request_id:
          $ref: '#/components/schemas/request_id'
    HolderResponseOfpiIndividual:
      type: object
      title: OFPI Brazil 🇧🇷 INDIVIDUAL
      required:
      - type
      - information
      description: Details regarding the individual bank account holder.
      properties:
        type:
          type: string
          enum:
          - INDIVIDUAL
          description: The type of bank account. For individuals, this must be set to `INDIVIDUAL`.
          example: INDIVIDUAL
          default: INDIVIDUAL
        information:
          $ref: '#/components/schemas/HolderInformationIndividualOfpiResponse'
    request_id:
      type: string
      pattern: '[a-f0-9]{32}'
      description: 'A 32-character unique ID of the request (matching a regex pattern of: `[a-f0-9]{32}`). Provide this ID when contacting the Belvo support team to accelerate investigations.

        '
      example: 9e7b283c6efa449c9c028a16b5c249fb
    ConsentWithoutAccountsError:
      type: object
      title: Consent Without Accounts
      description: 'This error occurs when your user has removed accounts associated with the consent they provided. For example, when your user first generated their consent, they had a checking and a loan account at the institution but has closed those accounts since then.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`consent_without_accounts`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#401-consent_without_accounts" target="_blank">401 consent_without_accounts errors</a>.

            '
          example: consent_without_accounts
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid` errors relating to `fetch_resources`, the description is:\n  \n  - `The institution only supports the following resources: (comma-separated list of supported resources)`.\n"
          example: 'The institution only supports the following resources: EMPLOYMENT_RECORDS, OWNERS'
        request_id:
          $ref: '#/components/schemas/request_id'
    BankAccountV2:
      type: object
      title: V2 - Bank Account
      required:
      - id
      - created_at
      - updated_at
      - active
      - external_id
      - metadata
      - holder
      - details
      properties:
        id:
          $ref: '#/components/schemas/id'
        created_at:
          $ref: '#/components/schemas/created_at'
        updated_at:
          $ref: '#/components/schemas/updated_at'
        active:
          type: boolean
          description: Indicates if the bank account is active (and can be used to receive funds).
          example: true
        holder:
          type: object
          description: Details of the account holder.
          required:
          - name
          - identifier
          properties:
            name:
              type: string
              maxLength: 120
              pattern: ^([A-Za-zÀ-ÖØ-öø-ÿ,.@:&*+_<>()!?/\\$%\d' -]{0,120})$
              description: The full name or business name of the account holder.
              example: Frangos Enlatados
            identifier:
              type: string
              minLength: 11
              maxLength: 14
              pattern: ^(?:[0-9]{11}|[0-9]{14})$
              description: 'The CPF (11 digits) or CNPJ (14 digits) of the account holder.

                '
              example: '12345678901122'
        details:
          type: object
          description: Details of the bank account.
          required:
          - account_type
          - agency
          - institution
          - number
          properties:
            institution:
              type: string
              format: uuid
              description: The Belvo ID of the financial institution.
              example: f512d996-583a-4a91-8b5b-eba2e103b068
            account_type:
              type: string
              enum:
              - CHECKINGS
              - SAVINGS
              - PAYMENTS
              description: "The type of bank account. Can be either:\n  - `CHECKINGS` (also known as Conta Corrente in Brazil)\n  - `SAVINGS` (also known as Conta Poupança in Brazil)\n  - `PAYMENTS` (also known as Conta de Pagamento Instantâneo or Conta de Pagamento in Brazil)\n"
              example: CHECKINGS
            agency:
              type: string
              minLength: 1
              maxLength: 4
              pattern: ^[0-9]{1,4}$
              description: The agency (branch number) of the institution where the account was created.
              example: '0444'
            number:
              type: string
              pattern: ^[0-9]{1,20}$
              minLength: 1
              maxLength: 20
              description: "The bank account number.\n\n{% admonition type=\"info\" name=\"Valid Account Number characters\" %}\n  You can only send through numbers (`^[0-9]+$`) in the string. For example, `\"457220\"` is a valid bank account number, while \"`45722-0`\" is invalid as it contains a hyphen (`-`).\n{% /admonition %}\n"
              example: '457220'
        external_id:
          $ref: '#/components/schemas/external_id__payments'
        metadata:
          $ref: '#/components/schemas/metadata__payments'
    created_by:
      type: string
      format: uuid
      description: The unique ID for the user that created this item.
      example: bcef7f35-67f2-4b19-b009-cb38795faf09
    UnauthorizedError:
      type: object
      title: Unauthorized Error
      description: 'This error occurs when you try to make an API call using incorrect Belvo API credentials (either your secret key or secret password, or both, are incorrect).

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`authentication_failed`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#401-authentication_failed" target="_blank">401 authentication_failed errors</a>.

            '
          example: authentication_failed
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `authentication_failed` errors, the description is:\n\n  - `Invalid Secret Keys`.\n"
          example: Invalid Secret Keys
        request_id:
          $ref: '#/components/schemas/request_id'
    HolderResponseOfpiBusiness:
      type: object
      title: OFPI Brazil 🇧🇷 BUSINESS
      required:
      - type
      - information
      description: Details regarding the business bank account holder.
      properties:
        type:
          type: string
          enum:
          - BUSINESS
          description: The type of bank account. For businesses, this must be set to `BUSINESS`.
          example: BUSINESS
          default: BUSINESS
        information:
          $ref: '#/components/schemas/HolderInformationBusinessOfpiResponse'
    created_at:
      type: string
      format: date-time
      description: 'The ISO-8601 timestamp of when the data point was created in Belvo''s database.

        '
      example: '2022-02-09T08:45:50.406032Z'
    400_validation_error:
      type: object
      title: Validation Error
      required:
      - code
      - message
      - request_id
      description: 'This error occurs when the parameters provided did not match the expected fields or the item you are trying to create is already in our database, leading to a field validation errors.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`null`, `does_not_exist`, `required`, `already_registered`, `invalid_choice`, `max_length`, `min_length`, `blank`, `null`, `cancellation_error`, `idempotency_key_invalid`) that allows you to classify and handle the error programmatically.

            '
          example: required
        message:
          type: string
          description: "A short description of the error.\n\n\nThe description can be (among others):\n\n  - `This field is required.`\n  - `Object with name=narnia does not exist.`\n  - `This field may not be null.`\n  - `This field may not be blank.`\n  - `This customer is already registered`\n  - `Ensure this field has at least 2 characters.`\n  - `Ensure this field has no more than 4 characters.`\n  - `Entered value is not valid.`\n  - `You must set all required fields: username, password, username_type.`\n  - `Payment Intent cannot be canceled because it is not SCHEDULED.`\n  - `Payment Intent cannot be canceled as the cutoff time (23:59:00) has passed.`\n  - `The provided idempotency key is invalid.`\n"
          example: This field is required.
        request_id:
          $ref: '#/components/schemas/request_id'
        field:
          type:
          - string
          - 'null'
          description: 'Name of the field where the error was encountered.


            > **Note**: This field is only present when the error is related to a specific field.

            '
          example: institution
    updated_at:
      type: string
      format: date-time
      description: 'The ISO-8601 timestamp of when the data point was updated in Belvo''s database.

        '
      example: '2022-02-09T08:45:50.406032Z'
    CreateBankAccountOfpiBusiness:
      type: object
      title: V1 - OFPI Business
      required:
      - institution
      - holder
      - details
      properties:
        institution:
          type: string
          format: uuid
          description: Belvo's unique ID for the institution that the bank account is created in.
          example: f512d996-583a-4a91-8b5b-eba2e103b068
        external_id:
          $ref: '#/components/schemas/external_id__payments'
        holder:
          type: object
          title: OFPI
          required:
          - type
          - information
          description: Details regarding the business bank account holder.
          properties:
            type:
              type: string
              enum:
              - BUSINESS
              description: The type of bank account. For business bank accounts, this must be set to `BUSINESS`.
              example: BUSINESS
              default: BUSINESS
            information:
              type: object
              description: Additional information about the bank account holder required in order to create the account for OFPI.
              title: BUSINESS
              required:
              - name
              - identifier
              - identifier_type
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: The full name of the business
                  example: Gustavo Veloso Entertainment Universe
                identifier_type:
                  type: string
                  enum:
                  - CNPJ
                  description: 'The customer''s ID document type. For businesses in Brazil, this must be set to `CNPJ`.

                    '
                  example: CNPJ
                  default: CNPJ
                identifier:
                  type: string
                  minLength: 14
                  maxLength: 14
                  pattern: ^\d{14}$
                  description: The CNPJ document number.
                  example: 00000000000191
        details:
          $ref: '#/components/schemas/BankAccountDetailsOfpi'
    metadata__payments:
      type: object
      description: "Optional and customizable object where you can provide any additional key-value pairs for your internal purposes. For example, an internal reference number for the payment intent.\n\n{% admonition type=\"info\" name=\"Metadata Limitations\" %}\n  You can only provide up to 50 keys (keys can have up to 50 characters each and each value can be up to 500 characters). We do not support nested objects, only ASCII values.\n{% /admonition %}\n"
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 500
        pattern: ^[-]*$
      example:
        internal_reference_id: GGq73487w2
    BankAccountOfpiResponse:
      type: object
      title: V1 - Bank Account (No Request Header)
      required:
      - id
      - created_at
      - institution
      - created_by
      - holder
      - customer
      - details
      properties:
        id:
          $ref: '#/components/schemas/id'
        created_at:
          $ref: '#/components/schemas/created_at'
        created_by:
          $ref: '#/components/schemas/created_by'
        customer:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Belvo''s unique ID for the customer associated with the bank account.


            For `BUSINESS` bank accounts, this field is `null`.

            '
          example: null
        external_id:
          $ref: '#/components/schemas/external_id__payments'
        institution:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Belvo''s unique ID for the institution that the bank account is created in.


            For `BUSINESS` bank accounts that Belvo creates for organizations, this field is set to `null`.

            '
          example: null
        details:
          $ref: '#/components/schemas/BankAccountDetailsOfpi'
        holder:
          oneOf:
          - $ref: '#/components/schemas/HolderResponseOfpiIndividual'
          - $ref: '#/components/schemas/HolderResponseOfpiBusiness'
    id:
      type: string
      format: uuid
      description: 'Belvo''s unique identifier for the current item.

        '
      example: 0d3ffb69-f83b-456e-ad8e-208d0998d71d
    CreateBankAccountV2:
      type: object
      title: V2 - Bank Account
      required:
      - holder
      - details
      properties:
        holder:
          type: object
          description: Details of the account holder.
          required:
          - name
          - identifier
          properties:
            name:
              type: string
              maxLength: 120
              pattern: ^([A-Za-zÀ-ÖØ-öø-ÿ,.@:&*+_<>()!?/\\$%\d' -]{0,120})$
              description: The full name or business name of the account holder.
              example: Frangos Enlatados
            identifier:
              type: string
              minLength: 11
              maxLength: 14
              pattern: ^(?:[0-9]{11}|[0-9]{14})$
              description: 'The CPF (11 digits) or CNPJ (14 digits) of the account holder.

                '
              example: '12345678901122'
        details:
          type: object
          description: Details of the bank account.
          required:
          - account_type
          - agency
          - institution
          - number
          properties:
            account_type:
              type: string
              enum:
              - CHECKINGS
              - SAVINGS
              - PAYMENTS
