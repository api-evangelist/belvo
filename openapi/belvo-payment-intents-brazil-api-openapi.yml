    ChargeBrazil:
      type: object
      title: Charge (V1 - Bank Account Beneficiary)
      required:
      - id
      - created_at
      - failure_code
      - failure_message
      - status
      - updated_at
      - amount
      - beneficiary
      - provider
      - metadata
      - payment_method_details
      - payment_method_information
      properties:
        id:
          $ref: '#/components/schemas/id'
        created_at:
          $ref: '#/components/schemas/created_at'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The ISO-8601 timestamp of when the status of the charge was last updated.

            '
          example: '2022-02-09T08:45:50.406032Z'
        created_by:
          $ref: '#/components/schemas/created_by'
        customer:
          type: string
          format: uuid
          description: Belvo's unique ID for the customer that the charge was created for.
          example: 531aa631-70a0-4eeb-ab97-51dea3e90c89
        payment_intent:
          type: string
          format: uuid
          description: The `payment_intent.id` associated with this charge.
          example: 50c04229-7b1d-4a53-951c-8ad53e10c6ca
        status:
          type: string
          enum:
          - CANCELED
          - PENDING
          - SCHEDULED
          - SUCCEEDED
          - FAILED
          - PARTIAL
          description: "The current status of the charge. Can be one of the following values:\n\n  - `CANCELED`\n  - `PENDING`\n  - `SCHEDULED`\n  - `SUCCEEDED`\n  - `FAILED`\n  - `PARTIAL`\n"
          example: PENDING
        amount:
          type:
          - string
          - 'null'
          description: 'The amount of the charge.

            '
          example: '100.12'
        currency:
          type: string
          enum:
          - BRL
          description: 'The currency of the amount paid. For 🇧🇷 Brazil, the value must be `BRL` (Brazilian Real).

            '
          example: BRL
        description:
          type: string
          description: 'The description of the payment.

            '
          example: Training shoes
        statement_description:
          type: string
          maxLength: 50
          description: 'The description that will appear on the customer''s bank statement (if provided).

            '
          example: Super Shoe Store - Brown Sneakers
        beneficiary:
          type: string
          format: uuid
          description: Belvo's unique ID used to identify the beneficiary’s bank account.
          example: 58524ccc-89ac-4ab6-b62b-c3da3f19a722
        provider:
          $ref: '#/components/schemas/EnumPaymentLinkProvider'
        payment_method_type:
          type: string
          enum:
          - open_finance
          description: 'Selected payment method type. For 🇧🇷 Brazil''s OFPI, the value must be `open_finance`.

            '
          example: open_finance
        payment_method_details:
          $ref: '#/components/schemas/ChargePaymentMethodDetailsOfpi'
        payment_method_information:
          $ref: '#/components/schemas/PaymentMethodInformationOfpi'
        payer_information:
          description: 'Information about the payer''s bank account.


            > **Note**: This object is only returned when the charge `status` is `SUCCEEDED`.

            '
          allOf:
          - $ref: '#/components/schemas/ChargePayerInformation'
        transactions:
          type: array
          description: An array of Transaction objects relating to the charge.
          items:
            $ref: '#/components/schemas/paymentTransaction'
        failure_code:
          type:
          - string
          - 'null'
          description: 'Error code that explains the reason behind a payment being unsuccessful (if applicable).

            '
          example: null
        failure_message:
          type:
          - string
          - 'null'
          description: 'Further information regarding the `failure_code`.

            '
          example: null
        metadata:
          type: object
          description: 'Optional and customizable object where you can provide any additional key-value pairs for your internal purposes. For example, an internal reference number.



            ⚠️ **Note**: You can only provide up to 50 keys (keys can have up to 50 characters each and each value can be up to 500 characters). We do not support nested objects, only ASCII values.

            '
          example:
            internal_reference_id: GGq73487w2
