          format: uuid
          example: 446bdd9f-5b3e-4c05-9159-7a5c87cfc810
    amount__lt:
      name: amount__lt
      in: query
      description: Return results only for less than this amount.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 1000.02
    created_at__range:
      name: created_at__range
      in: query
