    IdempotencyConflictError:
      type: object
      title: Idempotency Conflict Error
      required:
      - code
      - message
      - request_id
      description: 'The API responds with this error when it receives a request containing an idempotency key that has been previously used in another request which hasn''t yet finished processing. To correctly maintain an idempotent state, the server cannot process duplicate requests simultaneously.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`idempotency_key_conflict`) that allows you to classify and handle the error programmatically.

            '
          example: idempotency_key_conflict
        message:
          type: string
          description: "A short description of the error.\n\nFor `idempotency_key_conflict` errors, the description is:\n\n  - `A request with this idempotency key is already being processed.`\n"
          example: A request with this idempotency key is already being processed.
        request_id:
          $ref: '#/components/schemas/request_id'
    IdempotencyMismatchError:
      type: object
      title: Idempotency Key Mismatch Error
      required:
      - code
      - message
      - request_id
      description: 'This error occurs when a request is made with an idempotency key that was previously used with a different request payload. Each unique idempotency key must be associated with the same request body.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`idempotency_payload_mismatch`) that allows you to classify and handle the error programmatically.

            '
          example: idempotency_payload_mismatch
        message:
          type: string
          description: "A short description of the error.\n\nFor `idempotency_payload_mismatch` errors, the description is:\n\n  - `A different request with the same idempotency key already exists.`\n"
          example: A different request with the same idempotency key already exists.
        request_id:
          $ref: '#/components/schemas/request_id'
