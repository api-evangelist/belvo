openapi: 3.2.0
info:
  title: Belvo API Docs Payment Intents (Brazil) API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Payment Intents (Brazil)
  description: 'A **payment intent** is a single point of access to create payments using any payment method offered by Belvo.


    A payment intent captures all payment information (such as the amount to be charged, the description of the payment, the provider, and so on) and guides your customers through the payment flow.'
paths:
  /payments/br/payment-intents/:
    post:
      tags:
      - Payment Intents (Brazil)
      operationId: CreatePaymentIntentBrazil
      summary: Create a new Payment Intent
      description: 'Create a Payment Intent.


        You can create Payment Intent in the following configurations:


        |Beneficiary|Customer (Payer)|Example|

        |---|---|---|

        |Pix Key|Already registered with Belvo|Pix Key (With Existing Customer)|

        |Pix Key|Register with Belvo at time of Payment Intent request|Pix Key (With New Customer)|

        |Bank Account (Already Registered)|Already Registered |Bank Account (With Existing Customer)|

        |Bank Account (Already Registered)|Register with Belvo at time of Payment Intent request|Bank Account (With New Customer)|

        |Bank Account (Register at time of Payment Intent request)|Register with Belvo at time of Payment Intent request|Bank Account (With New Customer and Beneficiary Bank Account)|


        {% admonition type="warning" name="Pix Payments" %}

        When you create Payment Intents using a Pix Key, you have to make a **PATCH Complete a Payment Intent** request to complete the Payment Intent creation.

        {% /admonition %}'
      parameters:
      - $ref: '#/components/parameters/header_idempotency_key'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreatePaymentIntentPixKeys'
              - $ref: '#/components/schemas/CreatePaymentIntentPixKeysAndCustomer'
              - $ref: '#/components/schemas/CreatePaymentIntentOfpi'
              - $ref: '#/components/schemas/CreatePaymentIntentAndCustomerOfpi'
              - $ref: '#/components/schemas/CreatePaymentIntentAndBankAccountAndCustomerOfpi'
      responses:
        '201':
          description: OK (Created)
          headers:
            Belvo-Idempotency-Key:
              $ref: '#/components/headers/header_idempotency_key_response'
            Belvo-Idempotency-Status:
              $ref: '#/components/headers/header_idempotency_key_status_response'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PaymentIntentPixKeys'
                - $ref: '#/components/schemas/PaymentIntentOfpi'
              examples:
                PaymentIntentResponsePixKeyInitial:
                  $ref: '#/components/examples/PaymentIntentResponsePixKeyInitial'
                PaymentIntentResponseOfpiBankAccount:
                  $ref: '#/components/examples/PaymentIntentResponseOfpiBankAccount'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '409':
          $ref: '#/components/responses/409_idempotency_conflict_error'
        '422':
          $ref: '#/components/responses/422_idempotency_mismatch_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    get:
      tags:
      - Payment Intents (Brazil)
      operationId: ListPaymentIntentsBrazil
      summary: List all payment intents
      description: List all payment intents associated with your Belvo account.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/amount'
      - $ref: '#/components/parameters/amount__gt'
      - $ref: '#/components/parameters/amount__gte'
      - $ref: '#/components/parameters/amount__lt'
      - $ref: '#/components/parameters/amount__lte'
      - $ref: '#/components/parameters/amount__range'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      - $ref: '#/components/parameters/customer'
      - $ref: '#/components/parameters/customer__in'
      - $ref: '#/components/parameters/external_id__payments'
      - $ref: '#/components/parameters/external_id__in__payments'
      - $ref: '#/components/parameters/ordering__payment-intents'
      - $ref: '#/components/parameters/provider'
      - $ref: '#/components/parameters/payment_method_type'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/status_payment-intents'
      - $ref: '#/components/parameters/status__in_payment-intents'
      - $ref: '#/components/parameters/updated_at'
      - $ref: '#/components/parameters/updated_at__gt'
      - $ref: '#/components/parameters/updated_at__gte'
      - $ref: '#/components/parameters/updated_at__lt'
      - $ref: '#/components/parameters/updated_at__lte'
      - $ref: '#/components/parameters/updated_at__range'
      responses:
        '200':
          description: OK
          headers:
            Belvo-Idempotency-Key:
              $ref: '#/components/headers/header_idempotency_key_response'
            Belvo-Idempotency-Status:
              $ref: '#/components/headers/header_idempotency_key_status_response'
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of payment intent objects.
                      items:
                        $ref: '#/components/schemas/PaymentIntentOfpi'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/payment-intents/{id}/:
    patch:
      tags:
      - Payment Intents (Brazil)
      operationId: PatchPaymentIntentBrazil
      summary: Complete a payment intent
      description: Complete a new payment intent.
      parameters:
      - name: id
        required: true
        in: path
        description: The `payment-intent.id` you want to complete the payment for.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PatchPaymentIntentPixKeys'
              - $ref: '#/components/schemas/PatchPaymentIntentOfpi'
      responses:
        '200':
          description: OK (Confirmed)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PaymentIntentPixKeys'
                - $ref: '#/components/schemas/PaymentIntentOfpi'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    get:
      tags:
      - Payment Intents (Brazil)
      operationId: DetailPaymentIntentBrazil
      summary: Get details about a payment intent
      description: Get the details about a specific payment intent.
      parameters:
      - name: id
        required: true
        in: path
        description: The `payment-intent.id` you want to get detailed information about.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentOfpi'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/payment-intents/{id}/cancel/:
    post:
      tags:
      - Payment Intents (Brazil)
      operationId: CancelPaymentIntentBrazil
      summary: Cancel a scheduled payment intent
      description: 'Cancel a scheduled (one-off) payment intent.


        We respond with a `204 - No Content` and will inform you via webhook that the payment intent was canceled successfully.


        > **Note**: The latest you can cancel a scheduled payment intent is by **23:59:00 (GMT-3)** on the day **before** the scheduled payment date.'
      parameters:
      - name: id
        required: true
        in: path
        description: The scheduled `payment-intent.id` you want to cancel.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      responses:
        '204':
          description: No content
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/payment-intents/{payment_intent_id}/charges/:
    get:
      tags:
      - Payment Intents (Brazil)
      operationId: ListChargesBrazil
      summary: List all charges for a payment intent
      description: List all charges associated with a payment intent.
      parameters:
      - name: payment_intent_id
        required: true
        in: path
        description: The `payment-intent.id` the charges belong to.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - name: status
        in: query
        description: Return results only for this value.
        schema:
          type: string
          example: SUCCEEDED
      - name: status__in
        in: query
        description: Return results for listed status.
        schema:
          type: string
          example: PENDING,SUCCEEDED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of charge objects.
                      items:
                        $ref: '#/components/schemas/ChargeBrazil'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/payment-intents/{payment_intent_id}/charges/{charge_id}/:
    get:
      tags:
      - Payment Intents (Brazil)
      operationId: DetailChargesBrazil
      summary: Get details about a charge for a payment intent
      description: Get the details about a specific charge associated with a payment intent.
      parameters:
      - name: payment_intent_id
        required: true
        in: path
        description: The `payment-intent.id` the charge belongs to.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      - name: charge_id
        required: true
        in: path
        description: The `charge.id` you want details about.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeBrazil'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /payments/br/payment-intents/{payment_intent_id}/charges/{charge_id}/cancel/:
    post:
      tags:
      - Payment Intents (Brazil)
      operationId: CancelChargeBrazil
      summary: Cancel a scheduled charge
      description: 'Cancel a scheduled charge.


        We respond with a `204 - No Content` and will inform you via webhook that the charge was canceled successfully.


        > **Note**: The latest you can cancel a scheduled charge is by **23:59:00 (GMT-3)** on the day **before** the scheduled payment date.'
      parameters:
      - name: payment_intent_id
        required: true
        in: path
        description: The scheduled `payment-intent.id` the charge belongs to.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      - name: charge_id
        required: true
        in: path
        description: The scheduled `charge.id` you want to cancel.
        schema:
          type: string
          format: uuid
          example: a3b92311-1888-449f-acaa-49ae28d68fcd
      responses:
        '204':
          description: No content
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/400_validation_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  schemas:
    NextStepDisplayConfirmationRequiredOfpi:
      type: object
      title: OFPI - Display Confirmation Required
      description: 'Object detailing the next steps you should follow for a specific `next_step` type.

        '
      properties:
        type:
          type: string
          enum:
          - open_finance_display_payment_method_information
          - open_finance_display_confirmation_required
          - open_finance_display_needs_redirect
          - open_finance_display_payment_processing
          - open_finance_display_payment_succeeded
          - open_finance_display_payment_failed
          description: 'The type of `next_step` you need to follow.

            '
          example: open_finance_display_confirmation_required
        open_finance_display_confirmation_required:
          $ref: '#/components/schemas/DisplayConfirmationRequiredOfpi'
        ready_to_confirm:
          type: boolean
          default: true
          description: "Boolean that indicates whether the payment intent is ready to be confirmed. \n\n  **Note:** When set to `true`, you need to confirm the payment by making a PATCH request sending through `confirm: true`.\n"
          example: true
    paymentTransaction:
      type: object
      required:
      - id
      - created_at
      - created_by
      - amount
      - currency
      - description
      - transaction_type
      - beneficiary
      - payer
      - charge
      properties:
        id:
          $ref: '#/components/schemas/id'
        created_at:
          $ref: '#/components/schemas/created_at'
        created_by:
          $ref: '#/components/schemas/created_by'
        amount:
          type: string
          description: 'The transaction amount.



            **Note**: The amount displayed is always positive as we indicate the direction of the transaction in `transaction_type` parameter.

            '
          example: '1020.00'
        currency:
          $ref: '#/components/schemas/EnumPaymentsCurrency'
        description:
          type: string
          maxLength: 128
          description: 'The description of the payment.

            '
          example: Training shoes
        transaction_type:
          $ref: '#/components/schemas/EnumPaymentTransactionType'
        beneficiary:
          type: string
          format: uuid
          description: 'Belvo''s unique ID used to identify the beneficiary''s bank account.

            '
          example: a80d5a9d-20ae-479a-8dd7-ff3443bcbbfc
        payer:
          description: '**Note**: For OFPI, this will return an empty object `{}`.

            '
        payment_intent:
          type: string
          format: uuid
          description: The unique ID of the payment intent associated with the transaction.
          example: 004a28bb-fac2-4172-884b-5b6ea15314ad
        customer:
          type: string
          format: uuid
          description: Belvo's unique ID for the customer asscociated with this transaction.
          example: 9eebd63b-3339-44a9-8a5a-72bb6cb2f310
    EnumPaymentTransactionType:
      type: string
      enum:
      - INFLOW
      - OUTFLOW
      description: "The direction of the transaction.\n\n  - `INFLOW` indicates money coming into the account.\n  - `OUTFLOW` indicates money coming out of the account.\n"
      example: INFLOW
    400_validation_error:
      type: object
      title: Validation Error
      required:
      - code
      - message
      - request_id
      description: 'This error occurs when the parameters provided did not match the expected fields or the item you are trying to create is already in our database, leading to a field validation errors.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`null`, `does_not_exist`, `required`, `already_registered`, `invalid_choice`, `max_length`, `min_length`, `blank`, `null`, `cancellation_error`, `idempotency_key_invalid`) that allows you to classify and handle the error programmatically.

            '
          example: required
        message:
          type: string
          description: "A short description of the error.\n\n\nThe description can be (among others):\n\n  - `This field is required.`\n  - `Object with name=narnia does not exist.`\n  - `This field may not be null.`\n  - `This field may not be blank.`\n  - `This customer is already registered`\n  - `Ensure this field has at least 2 characters.`\n  - `Ensure this field has no more than 4 characters.`\n  - `Entered value is not valid.`\n  - `You must set all required fields: username, password, username_type.`\n  - `Payment Intent cannot be canceled because it is not SCHEDULED.`\n  - `Payment Intent cannot be canceled as the cutoff time (23:59:00) has passed.`\n  - `The provided idempotency key is invalid.`\n"
          example: This field is required.
        request_id:
          $ref: '#/components/schemas/request_id'
        field:
          type:
          - string
          - 'null'
          description: 'Name of the field where the error was encountered.


            > **Note**: This field is only present when the error is related to a specific field.

            '
          example: institution
    CreatePaymentIntentAndCustomerOfpi:
      type: object
      title: Bank Account (With New Customer)
      description: Create a payment intent using a bank account as the beneficiary and a register a new customer.
      required:
      - amount
      - customer
      - description
      - allowed_payment_method_types
      - payment_method_details
      - confirm
      properties:
        amount:
          type: string
          title: string
          pattern: \d+(?:\.\d{1,2})?
          example: '1234.12'
          description: 'Amount to be paid by your customer. For OFPI, you can send through numbers with up to two decimal points, separated by a `.` period. For example: `1234.12`

            '
        customer:
          $ref: '#/components/schemas/CreateCustomerOfpi'
        external_id:
          $ref: '#/components/schemas/external_id__payments'
        description:
          type: string
          description: 'A human-readable description of the payment.

            '
          example: Shoe payment
        statement_description:
          type: string
          maxLength: 50
          description: 'A description that will appear on the customer''s bank statement (recommended).



            > **Note**: If you do not use the `statement_description` parameter, the `description` value will be used as the statement description.

            '
          example: Super Shoe Store - Brown Sneakers
        allowed_payment_method_types:
          type: array
          description: A list of payment method types allowed in this payment intent. For Brazil (OFPI), this value must be set to `open_finance`.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/EnumPaymentLinkAllowedPaymentMethod'
        payment_method_details:
          type: object
          description: Details about the OFPI payment method.
          required:
          - open_finance
          properties:
            open_finance:
              oneOf:
              - $ref: '#/components/schemas/PaymentIntentPaymentMethodDetailsBodyIndividualRequestOfpiBankAccount'
              - $ref: '#/components/schemas/PaymentIntentPaymentMethodDetailsBodyBusinessRequestOfpiBankAccount'
        confirm:
          type: boolean
          default: false
          description: 'Boolean that confirms the payment intent.


            > 📘 Provide `payer_institution`

            >

