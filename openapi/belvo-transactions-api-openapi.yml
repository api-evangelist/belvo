openapi: 3.2.0
info:
  title: Belvo API Docs Transactions API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Transactions
  description: A **transaction** contains the detailed information of each movement inside an account. For example, a purchase at a store or a restaurant.
paths:
  /api/transactions/:
    get:
      tags:
      - Transactions
      operationId: ListTransactions
      summary: List transactions
      description: '## ▶️ Usage


        With the List Transactions method, you can:


        1. **[Required]** List transactions related to a specific `link.id` (using the `link` query parameter).

        2. Filter the returned transactions using query parameters (see the Filtering responses section below).

        3. Get the details of a specific `transaction.id` (using the `id` query parameter along with the `link` query parameter).


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.'
      parameters:
      - $ref: '#/components/parameters/link__required'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/link__in'
      - $ref: '#/components/parameters/account'
      - $ref: '#/components/parameters/account__in'
      - $ref: '#/components/parameters/account__balance__available'
      - $ref: '#/components/parameters/account__balance__available__lt'
      - $ref: '#/components/parameters/account__balance__available__lte'
      - $ref: '#/components/parameters/account__balance__available__gt'
      - $ref: '#/components/parameters/account__balance__available__gte'
      - $ref: '#/components/parameters/account__balance__available__range'
      - $ref: '#/components/parameters/account__balance__current'
      - $ref: '#/components/parameters/account__balance__current__gt'
      - $ref: '#/components/parameters/account__balance__current__gte'
      - $ref: '#/components/parameters/account__balance__current__lt'
      - $ref: '#/components/parameters/account__balance__current__lte'
      - $ref: '#/components/parameters/account__balance__current__range'
      - $ref: '#/components/parameters/account_type'
      - $ref: '#/components/parameters/account_type__in'
      - $ref: '#/components/parameters/accounting_date'
      - $ref: '#/components/parameters/accounting_date__gt'
      - $ref: '#/components/parameters/accounting_date__gte'
      - $ref: '#/components/parameters/accounting_date__lt'
      - $ref: '#/components/parameters/accounting_date__lte'
      - $ref: '#/components/parameters/accounting_date__range'
      - $ref: '#/components/parameters/amount'
      - $ref: '#/components/parameters/amount__gt'
      - $ref: '#/components/parameters/amount__gte'
      - $ref: '#/components/parameters/amount__lt'
      - $ref: '#/components/parameters/amount__lte'
      - $ref: '#/components/parameters/amount__range'
      - $ref: '#/components/parameters/collected_at'
      - $ref: '#/components/parameters/collected_at__gt'
      - $ref: '#/components/parameters/collected_at__gte'
      - $ref: '#/components/parameters/collected_at__lt'
      - $ref: '#/components/parameters/collected_at__lte'
      - $ref: '#/components/parameters/collected_at__range'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      - $ref: '#/components/parameters/currency'
      - $ref: '#/components/parameters/currency__in'
      - $ref: '#/components/parameters/credit_card_data__bill_name__in'
      - $ref: '#/components/parameters/reference'
      - $ref: '#/components/parameters/reference__in'
      - $ref: '#/components/parameters/status_transactions'
      - $ref: '#/components/parameters/status__in_transactions'
      - $ref: '#/components/parameters/type_transactions'
      - $ref: '#/components/parameters/type__in_transactions'
      - $ref: '#/components/parameters/value_date'
      - $ref: '#/components/parameters/value_date__gt'
      - $ref: '#/components/parameters/value_date__gte'
      - $ref: '#/components/parameters/value_date__lt'
      - $ref: '#/components/parameters/value_date__lte'
      - $ref: '#/components/parameters/value_date__range'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                title: Transactions (OFDA Brazil)
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of transaction objects (OFDA Brazil).
                      items:
                        $ref: '#/components/schemas/TransactionOpenFinanceBrazil'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    post:
      tags:
      - Transactions
      operationId: RetrieveTransactions
      summary: Retrieve transactions for a link
      description: 'Retrieve transactions for one or more accounts from a specific link.


        > 📘 Transaction Periods and Retrieval

        >

        > When retrieving transactions, it is important to understand that the available transaction data ranges depend on each institution. If you try to access older information than what we can access, we will return all the data we can read within that date range. For example, if you request transactions for the last year and we can only access the last six months, we will return the information corresponding to these six months of data.'
      parameters:
      - $ref: '#/components/parameters/async'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request body for the Retrieve Transactions method.
              required:
              - link
              - date_from
              - date_to
              properties:
                link:
                  $ref: '#/components/schemas/link_request'
                account:
                  type: string
                  format: uuid
                  description: If provided, we return transactions only from this account.
                  example: d4617561-1c01-4b2f-83b6-a594f7b3bc57
                date_from:
                  $ref: '#/components/schemas/date_from'
                date_to:
                  $ref: '#/components/schemas/date_to'
                token:
                  $ref: '#/components/schemas/token'
                save_data:
                  $ref: '#/components/schemas/save_data'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionOpenFinanceBrazil'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionOpenFinanceBrazil'
        '202':
          $ref: '#/components/responses/202_accepted_response'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    patch:
      tags:
      - Transactions
      operationId: PatchTransactions
      summary: Complete a transactions request
      description: 'Used to resume a Transaction retrieve session that was paused because an MFA

        token was required by the institution.'
      parameters:
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBody'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionOpenFinanceBrazil'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionOpenFinanceBrazil'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/transactions/{id}/:
    get:
      tags:
      - Transactions
      operationId: DetailTransaction
      summary: Get a transaction's details
      description: Get the details of a specific transaction.
      parameters:
      - name: id
        in: path
        required: true
        description: The `transaction.id` you want to get detailed information about.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionOpenFinanceBrazil'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    delete:
      tags:
      - Transactions
      operationId: DestroyTransaction
      summary: Delete a transaction
      description: 'Delete a specific transaction from your Belvo account.


        > ❗️ Rate limited

        >

        > This endpoint is rate limited. You can only delete 5 items per minute. If you exceed this limit, you will receive a `429` status code.'
      parameters:
      - name: id
        in: path
        required: true
        description: The `transaction.id` that you want to delete.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    omit:
      name: omit
      in: query
      description: Omit certain fields from being returned in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    accounting_date__gte:
      name: accounting_date__gte
      in: query
      description: Return transactions that were processed by the institution on this date (`YYYY-MM-DD`) or later.
      schema:
        type: string
        format: date
        example: '2022-05-04'
    created_at__lte:
      name: created_at__lte
      in: query
      description: Return items that were last updated in Belvo's database before or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-03-30'
    async:
      name: X-Belvo-Request-Mode
      in: header
      description: 'Recommended header parameter to make your POST request asynchronous (thus preventing timeouts and improving your data flow).


        When you make an asynchronous request, Belvo responds with a `202 - Accepted` payload, including the `request_id`. Once we have retrieved the requested information, you will receive a webhook with the link and request IDs.

        '
      schema:
        type: string
        enum:
        - async
        example: async
    accounting_date__lte:
      name: accounting_date__lte
      in: query
      description: Return transactions that were processed by the institution on this date (`YYYY-MM-DD`) or earlier.
      schema:
        type: string
        format: date
        example: '2022-03-01'
    account_type:
      name: account_type
      in: query
      description: Return information only for transactions matching this account type, as designated by the institution.
      schema:
        type: string
        example: Cuentas de efectivo
    status_transactions:
      name: status
      in: query
      description: Return transactions with this status. Can be either `PENDING`, `PROCESSED`, or `UNCATEGORIZED`.
      schema:
        type: string
        example: PENDING
    link__required:
      name: link
      in: query
      required: true
      description: 'The `link.id` you want to filter by.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    account__balance__available__lt:
      name: account__balance__available__lt
      in: query
      description: Return transactions that have a `account.balance.available` less than this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 6000.02
    page_size:
      name: page_size
      in: query
      description: 'Indicates how many results to return per page. By default we return 100 results per page.


        ℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).

        '
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    accounting_date__lt:
      name: accounting_date__lt
      in: query
      description: Return transactions that were processed by the institution before this date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
        example: '2022-03-02'
    credit_card_data__bill_name__in:
      name: credit_card_data__bill_name__in
      in: query
      description: Return transactions for one of these bill names.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          maxLength: 50
          example: feb-2022
    currency__in:
      name: currency__in
      in: query
      description: Return results that have funds or balances in one of these three-letter currency codes.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: ^[A-Z]{3}$
          example: BRA
    account__balance__current__gte:
      name: account__balance__current__gte
      in: query
      description: Return transactions that have a `account.balance.current` greater than or equal to this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 4019.02
    amount__gt:
      name: amount__gt
      in: query
      description: Return results only for more than this amount.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 1000.02
    account__balance__current__lt:
      name: account__balance__current__lt
      in: query
      description: Return transactions that have a `account.balance.current` less than this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 3000.02
    account__balance__current:
      name: account__balance__current
      in: query
      description: Return transactions that have a `account.balance.current` matching exactly this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 4000.02
    value_date__lte:
      name: value_date__lte
      in: query
      description: Return results for this date (`YYYY-MM-DD`) or earlier.
      schema:
        type: string
        format: date
        example: '2022-03-01'
    account:
      name: account
      in: query
      description: 'The `account.id` you want to filter by.


        ℹ️ We highly recommend adding either the `link.id` or the `account.id` filters in order to improve your performance.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    collected_at:
      name: collected_at
      in: query
      description: Return items that were retrieved from the institution on this date (`YYYY-MM-DD` or full `ISO-8601` timestamp).
      schema:
        type: string
        format: date
        example: '2022-05-01'
    type__in_transactions:
      name: type__in
      in: query
      description: Return transactions with this types. Can be either `INFLOW` or `OUTFLOW`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - OUTFLOW
          - INFLOW
          example: INFLOW
    collected_at__gt:
      name: collected_at__gt
      in: query
      description: Return items that were retrieved from the institution after this date (`YYYY-MM-DD` or full `ISO-8601` timestamp).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    account__balance__available:
      name: account__balance__available
      in: query
      description: Return transactions that have a `account.balance.available` matching exactly this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 4000.02
    amount__lt:
      name: amount__lt
      in: query
      description: Return results only for less than this amount.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 1000.02
    created_at__range:
      name: created_at__range
      in: query
      description: Return accounts that were last updated in Belvo's database between two dates (in `YYYY-MM-DD` format). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          format: date
          example: '2022-03-03'
        example:
        - '2022-01-01'
        - '2022-12-31'
    account__balance__available__lte:
      name: account__balance__available__lte
      in: query
      description: Return transactions that have a `account.balance.available` less than or equal to this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 5999.02
    account_type__in:
      name: account_type__in
      in: query
      description: Return information only for transactions matching these account types, as designated by the institution.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: Depositos Ahorro
    amount__range:
      name: amount__range
      in: query
      description: Return results between this amount range. The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          example: 2000.02
        example:
        - 100
        - 5000
    link__in:
      name: link__in
      in: query
      description: Return results only for these `link.id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 5722d0ba-69d7-42dc-8ff5-33767b83c5d6
    account__balance__current__range:
      name: account__balance__current__range
      in: query
      description: Return transactions that have a `account.balance.current` within a range. The first value indicates the start of the range and the second value indicates the end of the range. of two values.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: number
          example: 4350
        example:
        - 100
        - 5000
    value_date:
      name: value_date
      in: query
      description: Return results for exactly this date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    account__balance__current__lte:
      name: account__balance__current__lte
      in: query
      description: Return transactions that have a `account.balance.current` less than or equal to this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 2999.02
    created_at__gte:
      name: created_at__gte
      in: query
