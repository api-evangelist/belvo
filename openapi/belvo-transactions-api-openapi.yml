      - 'null'
      description: 'Information regarding the bill that this transaction appears on.

        '
      properties:
        id:
          type: string
          format: uuid
          description: 'The unique identifier created by Belvo used to reference the current credit card bill.


            > **Note**: This field is only returned for ''closed'' bills (meaning the billing period has ended and the bill has been emitted). If the billing period is still ongoing, we return `null`.

            '
