  schemas:
    TransactionLoanDataCharges:
      type:
      - object
      - 'null'
      required:
      - type
      - info
      - amount
      description: Details regarding the charges associated with this payment. Only applicable when `is_detached` = `true`.
      properties:
        type:
          type: string
          maxLength: 140
          pattern: ^[\w\W\s]{0,140}$
          description: 'The type of charge.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network when the `charges` field is present

            '
          example: MULTA_ATRASO_PAGAMENTO
        info:
          type: string
          maxLength: 140
          pattern: ^[\w\W\s]{0,140}$
          description: 'Additional information regarding the charge `type`.

            '
          example: Late payment charge.
        amount:
          type: number
          format: float
          pattern: ^-?\d{1,15}\.\d{2,4}$
          description: 'The amount of the charge.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network when the `charges` field is present

            '
          example: 8903.77
    last_accessed_at:
      type:
      - string
      - 'null'
      format: date-time
      description: 'The ISO-8601 timestamp of Belvo''s most recent successful access to the institution for the given link.

        '
      example: '2021-03-09T10:28:40.000Z'
    EnumInstitutionType:
      type: string
      enum:
      - bank
      - fiscal
      - employment
      description: "The type of institution. We return one of the following values:\n\n  - `bank`\n  - `fiscal`\n  - `employment`\n"
    EnumTransactionCategory:
      type:
      - string
      - 'null'
      enum:
      - Bills & Utilities
      - Credits & Loans
      - Deposits
      - Fees & Charges
      - Food & Groceries
      - Home & Life
      - Income & Payments
      - Insurance
      - Investments & Savings
      - Online Platforms & Leisure
      - Personal Shopping
      - Taxes
      - Transfers
      - Transport & Travel
      - Unknown
      - Withdrawal & ATM
      - null
      description: "The name of the transaction category.\n\n> **Get transaction categorization**\nWith transaction categorization, we clean and categorize transactions for you, turning raw data into actionable insights. To enable this feature, just <a href=\"https://belvo.com/contact/?utm_source=documentation\" target=\"_blank\">reach out</a> to us, and we'll get right to it.\n\nWe return one of the following enum values:\n\n  - `Bills & Utilities`\n  - `Credits & Loans`\n  - `Deposits`\n  - `Fees & Charges`\n  - `Food & Groceries`\n  - `Home & Life`\n  - `Income & Payments`\n  - `Insurance`\n  - `Investments & Savings`\n  - `Online Platforms & Leisure`\n  - `Personal Shopping`\n  - `Taxes`\n  - `Transfers`\n  - `Transport & Travel`\n  - `Unknown`*\n  - `Withdrawal & ATM`\n  - `null`\n\n\n  \\* For clients not using our Transaction Categorization product, we return `null` instead.\n"
      example: Income & Payments
    EnumAccountLoanDataFeeChargeType:
      type: string
      enum:
      - SINGLE
      - PER_INSTALLMENT
      description: "Indicates the type of charge. We return one of the following values:\n\n  - `SINGLE`\n  - `PER_INSTALLMENT`\n\n   > **Non-nullable:** A value must be returned by Brazil's open finance network if the `fees` field is available.\n"
      example: SINGLE
    EnumAccountLoanDataInterestRateDataTaxType:
      type: string
      enum:
      - NOMINAL
      - EFFECTIVE
      description: "The type of interest rate tax. We return one of the following values:\n\n  - `NOMINAL`\n  - `EFFECTIVE`\n  \n  > **Non-nullable:** A value must be returned by Brazil's open finance network.\n"
      example: NOMINAL
    InstitutionUnavailableError:
      type: object
      title: Institution Unavailable
      description: 'This error occurs when the institution''s website that you''re trying to access is down due to maintenance or other issues, which means Belvo is unable to create new links or retrieve new data.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`institution_unavailable`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-institution_unavailable" target="_blank">400 institution_unavailable errors</a>.

            '
          example: institution_unavailable
        message:
          type: string
          description: "A short description of the error.\n\n\nFor `institution_unavailable` errors, the description is:\n  \n  - `The financial institution is unavailable`.\n"
          example: The financial institution is unavailable
        request_id:
          $ref: '#/components/schemas/request_id'
    EnumTransactionStatus:
      type:
      - string
      - 'null'
      enum:
      - PENDING
      - PROCESSED
      - UNCATEGORIZED
      - null
      description: "The status of the transaction. We return one of the following values:\n\n  - `PROCESSED` (The transaction has been processed by the institution.)\n  - `PENDING` (The institution clearly states that the transaction has not yet been processed.)\n  - `UNCATEGORIZED` (deprecated)\n  - `null` (deprecated)\n  \n"
      example: PROCESSED
    InvalidFetchHistorical:
      type: object
      title: Invalid Fetch Resources
      description: 'This error occurs when you attempted to create a link where you set `credentials_storage` to `nostore` and did not send any resources in the `fetch_resources`. For links where we don''t store credentials, you must send through an array of resources in `fetch_resources`.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_fetch_resources`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_fetch_resources" target="_blank">400 invalid_fetch_resources errors</a>.

            '
          example: invalid_fetch_resources
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_fetch_resources` errors, the description can be one of the following:\n\n  - `Single links without stored credentials must fetch resources`\n  \n"
          example: Single links without stored credentials must fetch resources
        request_id:
          $ref: '#/components/schemas/request_id'
    AccountCreditDataOpenFinanceBrazil:
      type:
      - object
      - 'null'
      required:
      - collected_at
      - credit_limit
      description: Details regarding the credit cards associated with this account.
      properties:
        collected_at:
          $ref: '#/components/schemas/collected_at'
        credit_limit:
          type:
          - number
          - 'null'
          format: float
          maxLength: 20
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The upper credit limit of the card.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: 192000.9
        limits:
          type: array
          items:
            $ref: '#/components/schemas/AccountCreditDataLimitsOpenFinanceBrazil'
        cutting_date:
          type:
          - string
          - 'null'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          description: The date when the credit card's bill is due.
          example: '2019-12-11'
        minimum_payment:
          type:
          - number
          - 'null'
          format: float
          maxLength: 20
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The minimum amount that the account owner needs to pay in the current credit period.

            '
          example: 2400.3
        network:
          $ref: '#/components/schemas/EnumAccountCreditCardNetwork'
        network_additional_info:
          type:
          - string
          - 'null'
          maxLength: 100
          pattern: '[\w\W\s]*'
          description: 'Additional information about the credit card network.

            '
          example: It's an orange card.
        cards:
          type: array
          minItems: 1
          description: Details regarding the cards associated with the account.
          items:
            $ref: '#/components/schemas/AccountCreditDataCardsOpenFinanceBrazil'
        next_payment_date:
          type:
          - string
          - 'null'
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        no_interest_payment:
          type:
          - number
          - 'null'
          format: float
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        interest_rate:
          type:
          - number
          - 'null'
          format: float
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        monthly_payment:
          type:
          - number
          - 'null'
          deprecated: true
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        last_payment_date:
          type:
          - string
          - 'null'
          deprecated: true
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
    AccountBalanceOpenFinanceBrazil:
      type: object
      required:
      - current
      description: 'Details regarding the current and available balances for the account.

        '
      properties:
        current:
          type:
          - number
          - 'null'
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The current balance is calculated differently according to the type of account.



            - **💰 Checking and saving accounts**:



            The user''s account balance at the `collected_at` timestamp.


            - **💳 Credit cards**:



            The amount the user has spent in the current card billing period (see `credit_data.cutting_date` for information on when the current billing period finishes).


            - **🏡 Loan accounts**:



            The amount remaining to pay on the users''s loan.

            '
          example: 5874.13
        available:
          type:
          - number
          - 'null'
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The balance that the account owner can use.


            - **💰 Checking and saving accounts**:



            The available balance may be different to the `current` balance due to pending transactions.


            - **💳 Credit cards**:



            The credit amount the user still has available for the current period. The amount is calculated as `credit_data.credit_limit` minus `balance.current`.


            - **🏡 Loan accounts**:



            The present value required to pay off the loan, as provided by the institution.



            **Note:** If the institution does not provide this value, we return `null`.

            '
          example: 5621.12
        blocked:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The amount that is currently blocked due to pending transactions.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `balances` field is available.

            '
          example: 60.32
        automatically_invested:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The amount that is automatically invested (as agreed upon with the institution).


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `balances` field is available.

            '
          example: 131.5
    AccountLoanDataBalloonPaymentsOpenFinanceBrazil:
      type:
      - object
      - 'null'
      description: Detailed information regarding any balloon payments for the loan, if applicable.
      required:
      - due_date
      - currency
