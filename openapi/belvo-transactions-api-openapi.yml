          type: string
          format: date
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          description: 'The date when the transaction occurred, in `YYYY-MM-DD` format, in `YYYY-MM-DD` format.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: '2019-10-23'
        transacted_at:
          type: string
          format: date-time
          pattern: (^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)
          description: 'The ISO-8601 timestamp of when the transaction occurred (in the UTC timezone).


            > **Note:** For transactions that occurred before 31.01.2024, the timestamp may only indicate the day (for example, `2016-01-29T00:00:00.000Z`). However, transactions that occurred after this date must include the date and time (`2024-02-20T12:29:03.374Z`).


            > **Institutions not abiding by this format:**

            > Some institutions may not provide the exact time of the transaction. In this case, the timestamp will be set to `00:00:00.000Z`.

            > Belvo has identified the following institutions as not abiding by the regulation and have raised the issue with regulators: Bradesco, Itau, and Sicoob.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network for **credit card and checking account transactions**.

            '
          example: '2024-02-20T12:29:03.374Z'
        accounting_date:
          type:
          - string
          - 'null'
          description: 'The date when the transaction was processed and accounted for by the institution, in `YYYY-MM-DD` format.

            > **Non-nullable:** A value must be returned by Brazil''s open finance network for **credit card transactions**.'
          example: '2019-10-23'
        inferred_accounting_date:
          type: string
          format: date
          description: 'In the case that the transaction occured on a weekend or public holiday, Belvo will infer the date that the transaction is accounted for by the institution. Typically, this is the next business day.

            '
          example: '2019-10-23'
        amount:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The transaction amount.

            ℹ️ The amount displayed is always positive as we indicate the direction of the transaction in the `type` parameter.

            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: 2145.45
        local_currency_amount:
          type:
          - number
          - 'null'
          format: float
          maxLength: 20
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The value of the transaction in the local currency.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network for **credit card transactions**.

            '
          example: 7623.64
        balance:
          type:
          - number
          - 'null'
          format: float
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        currency:
          type:
          - string
          - 'null'
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: 'The three-letter currency code (ISO-4217).

            '
          example: BRL
        description:
          type:
          - string
          - 'null'
          description: 'The description of transaction provided by the institution. Usually this

            is the text that the end user sees in the online platform.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: SEVEN BUDDHAS RFC:XXXXXXXXXX
        observations:
          type:
          - string
          - 'null'
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        merchant:
          $ref: '#/components/schemas/TransactionMerchantData'
        category:
          $ref: '#/components/schemas/EnumTransactionCategory'
        subcategory:
          $ref: '#/components/schemas/EnumTransactionSubcategory'
        reference:
          type:
          - string
          - 'null'
          maxLength: 128
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        type:
          $ref: '#/components/schemas/EnumTransactionType'
        status:
          $ref: '#/components/schemas/EnumTransactionStatus'
        credit_card_data:
          $ref: '#/components/schemas/TransactionCreditCardDataOpenFinanceBrazil'
        counterparty:
          $ref: '#/components/schemas/TransactionCounterparty'
        loan_data:
          $ref: '#/components/schemas/TransactionLoanDataOpenFinanceBrazil'
        payment_type:
          $ref: '#/components/schemas/EnumTransactionPaymentType'
        operation_type:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z_]{0,50}$
          description: 'The type of transaction. For example, a PIX payment or a deposit.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network for **non-loan account transactions**.

            '
          example: TRANSFERENCIA_MESMA_INSTITUICAO
        operation_type_additional_info:
          type:
          - string
          - 'null'
          maxLength: 140
          pattern: ^\S[\s\S]*$
          description: 'Additional information regarding the `operation_type`, if applicable.

            '
          example: Internal transfer.
        mcc:
          type:
          - integer
          - 'null'
          format: int32
          pattern: ^[0-9]{4}$
          description: 'The four-digit (ISO-18245 compliant) Merchant Category Code (MCC) for the transaction. This field is only applicable for credit card transactions.

            '
          example: 5137
    RequestTimeoutError:
      type: object
      title: Request Timeout
      description: 'Belvo has a limit regarding the time it takes to log in, retrieve account data, and log out. A timeout occurs when there is a very high amount of data and everything could not be obtained within the allotted time.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`request_timeout`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#408-request_timeout" target="_blank">408 request_timeout errors</a>.

            '
          example: request_timeout
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `request_timeout` errors, the description is:\n  \n  - `The request timed out, you can retry asking for less data by changing your query parameters`.\n"
          example: The request timed out, you can retry asking for less data by changing your query parameters
        request_id:
          $ref: '#/components/schemas/request_id'
    common_pagination_properties:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: The total number of results in your Belvo account.
          example: 130
        next:
          type:
          - string
          - 'null'
          format: uri
          description: 'The URL to next page of results. Each page consists of up to 100 items. If there are not enough results for an additional page, the value is `null`.


            In our documentation example, we use `{endpoint}` as a placeholder value. In production, this value will be replaced by the actual endpoint you are currently using (for example, `accounts` or `owners`).

            '
          example: https://sandbox.belvo.com/api/{endpoint}/?link=1bd948f7-245d-4313-b604-34d1044cb908&page=2
        previous:
          type:
          - string
          - 'null'
          format: uri
          description: 'The URL to the previous page of results. If there is no previous page, the

            value is `null`.

            '
          example: null
    EnumAccountLoanDataContractRemainingFrequency:
      type:
      - string
      - 'null'
      enum:
      - DAY
      - WEEK
      - MONTH
      - YEAR
      - NO_DEADLINE_REMAINING
      - null
      description: 'The frequency of the remaining contracted installment payments, as defined when the contract was first signed. We return one of the following:

        - `DAY`

        - `WEEK`

        - `MONTH`

        - `YEAR`

        - `NO_DEADLINE_REMAINING`

        - `null`

        '
      example: MONTH
    EnumTransactionCounterpartyType:
      type:
      - string
      - 'null'
      enum:
      - INDIVIDUAL
      - COMPANY
      - null
      description: "The transaction counterparty type. We return one of the following values:\n\n  - `INDIVIDUAL`\n  - `COMPANY`\n  - `null`\n"
      example: INDIVIDUAL
    InvalidResourcesError:
      type: object
      title: Invalid Resources
      description: 'This error occurs when you attempted to create a link where you added resources in `fetch_resources` that are unsupported by the institution.

        '
      properties:
        field:
          type: string
          description: 'The request parameter that is causing the error. For invalid resources, this will be set to `resources`.

            '
          example: resources
        code:
          type: string
          description: 'A unique error code (`invalid`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid" target="_blank">400 invalid_period errors</a>.

            '
          example: invalid
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid` errors relating to `fetch_resources`, the description is:\n  \n  - `The institution only supports the following resources: (comma-separated list of supported resources)`.\n"
          example: 'The institution only supports the following resources: EMPLOYMENT_RECORDS, OWNERS'
        request_id:
          $ref: '#/components/schemas/request_id'
    save_data:
