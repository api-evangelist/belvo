openapi: 3.2.0
info:
  title: Belvo API Docs Investment Transactions Brazil API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Investment Transactions Brazil
paths:
  /api/br/investment-transactions/:
    get:
      tags:
      - Investment Transactions Brazil
      operationId: ListInvestmentTransactionsBrazil
      summary: List investment transactions
      description: '## ▶️ Usage


        With the List Investment Transactions method, you can:


        1. **[Required]** List investment transactions related to a specific `link.id` (using the `link` query parameter).

        2. Get the details of a specific `investment-transaction.id` (using the `id` query parameter).


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.'
      parameters:
      - $ref: '#/components/parameters/link__required'
      - $ref: '#/components/parameters/pageSize_query'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/link__in'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/type_investments'
      - $ref: '#/components/parameters/type__in_investments'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of investment transaction objects.
                      items:
                        $ref: '#/components/schemas/InvestmentTransactionBrazil'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    post:
      tags:
      - Investment Transactions Brazil
      operationId: RetrieveInvestmentTransactionsBrazil
      summary: Retrieve investments for a link
      description: Retrieve investments for an existing link.
      parameters:
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The request body for investment transactions in Brazil.
              required:
              - link
              properties:
                link:
                  $ref: '#/components/schemas/link_request'
                date_from:
                  $ref: '#/components/schemas/date_from'
                date_to:
                  $ref: '#/components/schemas/date_to'
                save_data:
                  $ref: '#/components/schemas/save_data'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestmentTransactionBrazil'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestmentTransactionBrazil'
        '202':
          $ref: '#/components/responses/202_accepted_response'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/br/investment-transactions/{id}/:
    get:
      tags:
      - Investment Transactions Brazil
      operationId: DetailInvestmentTransactionBrazil
      summary: Get an investment transaction's details
      description: Get the details of a specific investment transaction.
      parameters:
      - name: id
        in: path
        required: true
        description: The `investment-transaction.id` you want to get detailed information about.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentTransactionBrazil'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    delete:
      tags:
      - Investment Transactions Brazil
      operationId: DestroyInvestmentTransactionBrazil
      summary: Delete an investment transaction
      description: Delete a specific investment transaction from your Belvo account.
      parameters:
      - name: id
        in: path
        required: true
        description: The `investment-transaction.id` that you want to delete.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    fields:
      name: fields
      in: query
      description: Return only the specified fields in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    omit:
      name: omit
      in: query
      description: Omit certain fields from being returned in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    created_at__lt:
      name: created_at__lt
      in: query
      description: Return items that were last updated in Belvo's database before this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-04-01'
    created_at__lte:
      name: created_at__lte
      in: query
      description: Return items that were last updated in Belvo's database before or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-03-30'
    page:
      name: page
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    created_at:
      name: created_at
      in: query
      description: Return items that were last updated in Belvo's database on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    type_investments:
      name: type
      in: query
      description: Return investments with this type. Can be either `BANCARIA`, `CREDITO`, `VARIABLE` , `FUND`, or `BOND`.
      schema:
        type: string
        example: VARIABLE
    link__required:
      name: link
      in: query
      required: true
      description: 'The `link.id` you want to filter by.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    created_at__range:
      name: created_at__range
      in: query
      description: Return accounts that were last updated in Belvo's database between two dates (in `YYYY-MM-DD` format). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          format: date
          example: '2022-03-03'
        example:
        - '2022-01-01'
        - '2022-12-31'
    pageSize_query:
      name: page_size
      in: query
      description: "Indicates how many results to return per page. By default we return 100 results per page. \n\nℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).\n"
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    type__in_investments:
      name: type__in
      in: query
      description: Return investments of this type. Can be either `BANCARIA`, `CREDITO`, `VARIABLE` , `FUND`, or `BOND`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: VARIABLE
    link__in:
      name: link__in
      in: query
      description: Return results only for these `link.id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 5722d0ba-69d7-42dc-8ff5-33767b83c5d6
    id__in:
      name: id__in
      in: query
      description: Return information for these resource `id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 6b3dea0f-be29-49d1-aabe-1a6d588642e6
    id:
      name: id
      in: query
      description: Return information only for this resource `id`.
      schema:
        type: string
        format: uuid
        example: 24ccab1d-3a86-4136-a6eb-e04bf52b356f
    created_at__gte:
      name: created_at__gte
      in: query
      description: Return items that were last updated in Belvo's database after or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-04'
    created_at__gt:
      name: created_at__gt
      in: query
      description: Return items that were last updated in Belvo's database after this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
  schemas:
    RequestTimeoutError:
      type: object
      title: Request Timeout
      description: 'Belvo has a limit regarding the time it takes to log in, retrieve account data, and log out. A timeout occurs when there is a very high amount of data and everything could not be obtained within the allotted time.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`request_timeout`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#408-request_timeout" target="_blank">408 request_timeout errors</a>.

            '
          example: request_timeout
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `request_timeout` errors, the description is:\n  \n  - `The request timed out, you can retry asking for less data by changing your query parameters`.\n"
          example: The request timed out, you can retry asking for less data by changing your query parameters
        request_id:
          $ref: '#/components/schemas/request_id'
    InvalidResourcesError:
      type: object
      title: Invalid Resources
      description: 'This error occurs when you attempted to create a link where you added resources in `fetch_resources` that are unsupported by the institution.

        '
      properties:
        field:
          type: string
          description: 'The request parameter that is causing the error. For invalid resources, this will be set to `resources`.

            '
          example: resources
        code:
          type: string
          description: 'A unique error code (`invalid`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid" target="_blank">400 invalid_period errors</a>.

            '
          example: invalid
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid` errors relating to `fetch_resources`, the description is:\n  \n  - `The institution only supports the following resources: (comma-separated list of supported resources)`.\n"
          example: 'The institution only supports the following resources: EMPLOYMENT_RECORDS, OWNERS'
        request_id:
          $ref: '#/components/schemas/request_id'
    save_data:
      type: boolean
      default: true
      description: 'Indicates whether or not to persist the data in Belvo. By default, this is set to `true` and we return a 201 Created response.


        When set to `false`, the data won''t be persisted and we return a 200 OK response.

        '
      example: true
    SessionExpiredError:
      type: object
      title: Session Expired
      description: 'This error occurs when you try to resume a request session that has already expired. This is usually because the user took too long to provide their authentication token.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`session_expired`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-session_expired" target="_blank">400 session_expired errors</a>.

            '
          example: session_expired
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `session_expired` errors, the description is:\n  \n  - `The session you are trying to resume has expired, please start again from register/retrieve endpoint`.\n"
          example: The session you are trying to resume has expired, please start again from register/retrieve endpoint
        request_id:
          $ref: '#/components/schemas/request_id'
    request_id:
      type: string
      pattern: '[a-f0-9]{32}'
      description: 'A 32-character unique ID of the request (matching a regex pattern of: `[a-f0-9]{32}`). Provide this ID when contacting the Belvo support team to accelerate investigations.

        '
      example: 9e7b283c6efa449c9c028a16b5c249fb
    InstitutionInactiveError:
      type: object
      title: Institution Inactive
      description: 'This error occurs when we (Belvo) have deactivated the institution in our API.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`institution_inactive`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-institution_inactive" target="_blank">400 institution_inactive errors</a>.

            '
          example: institution_inactive
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `institution_inactive` errors, the description is:\n  \n  - `The institution has been temporarily deactivated`.\n"
          example: The institution has been temporarily deactivated
        request_id:
          $ref: '#/components/schemas/request_id'
    ConsentWithoutAccountsError:
      type: object
      title: Consent Without Accounts
      description: 'This error occurs when your user has removed accounts associated with the consent they provided. For example, when your user first generated their consent, they had a checking and a loan account at the institution but has closed those accounts since then.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`consent_without_accounts`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#401-consent_without_accounts" target="_blank">401 consent_without_accounts errors</a>.

            '
          example: consent_without_accounts
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid` errors relating to `fetch_resources`, the description is:\n  \n  - `The institution only supports the following resources: (comma-separated list of supported resources)`.\n"
          example: 'The institution only supports the following resources: EMPLOYMENT_RECORDS, OWNERS'
        request_id:
          $ref: '#/components/schemas/request_id'
    Remuneration:
      type: object
      description: 'The remuneration details of the investment instrument.

        '
      properties:
        pre_fixed_rate:
          type:
          - number
          - 'null'
          format: float
          pattern: ‘^\d{1}\.\d{6}$’
          description: The fixed interest rate defined at issuance, expressed as a decimal (for example `0.150000` represents 15%).
          example: 0.05
        post_fixed_rate:
          type:
          - number
          - 'null'
          format: float
          pattern: ‘^\d{1}\.\d{6}$’
          description: The post-fixed interest rate defined at issuance, expressed as a decimal (for example `0.150000` represents 15%).
          example: 0.05
        rate_type:
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: '[\w\W-]*'
          description: "The type of remuneration rate applied to the financial instrument. Can be either:\n  - `LINEAR`\n  - `EXPONENCIAL`\n"
          example: LINEAR
        rate_periodicity:
          type:
          - string
          - 'null'
          description: "The frequency that the remuneration rate is applied to the financial instrument. Can be either:\n  - `DIARIO`\n  - `MENSAL`\n  - `ANUAL`\n  - `SEMESTRAL`\n"
          example: MENSAL
        calculation_base:
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: '[\w\W-]*'
          description: "Indicates whether the remuneration or interest calculation is based on business days (*dias úteis*) or calendar days (*dias corridos*).\n- `DIAS_UTEIS`\n  - `DIAS_CORRIDOS`\n"
          example: DIAS_CORRIDOS
        indexer:
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: '[\w\W-]*'
          description: "The index used as a reference to calculate the profitability or returns of the financial instrument. Can be one either:\n  - `CDI` \n  - `DI` \n  - `TR` \n  - `IPCA` \n  - `IGP_M` \n  - `IGP_DI` \n  - `INPC` \n  - `BCP` \n  - `TLC` \n  - `SELIC` \n  - `PRE_FIXADO` \n  - `OUTROS`\n"
          example: CDI
        indexer_additional_info:
          type:
          - string
          - 'null'
          maxLength: 50
          pattern: '[\w\W-]*'
          description: "Additional information regarding the `indexer` rate. Required when `indexer` is set to `OUTROS`. \n"
          example: IPCA + 5%
    UnauthorizedError:
      type: object
      title: Unauthorized Error
      description: 'This error occurs when you try to make an API call using incorrect Belvo API credentials (either your secret key or secret password, or both, are incorrect).

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`authentication_failed`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#401-authentication_failed" target="_blank">401 authentication_failed errors</a>.

            '
          example: authentication_failed
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `authentication_failed` errors, the description is:\n\n  - `Invalid Secret Keys`.\n"
          example: Invalid Secret Keys
        request_id:
          $ref: '#/components/schemas/request_id'
    InvestmentTransactionBrazil:
      type: object
      description: Details regarding the investment transaction.
      title: Investment Transaction Object (Brazil)
      x-tags:
      - Investment Transactions Brazil
      properties:
        id:
          $ref: '#/components/schemas/id'
        link:
          $ref: '#/components/schemas/link'
        collected_at:
          $ref: '#/components/schemas/collected_at'
        created_at:
          $ref: '#/components/schemas/created_at'
        investment:
          $ref: '#/components/schemas/InvestmentBrazil'
        internal_identification:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          minLength: 1
          maxLength: 100
          description: The institution's internal identification of the investment transaction.
          example: ABCD2126019929279212650822221989319253344
        value_date:
          type: string
          format: date
          description: "The date on which the transaction was settled, in `YYYY-MM-DD` format.\n\n> \U0001F4D8 `VARIABLE_INCOME`\n>\n> For `VARIABLE_INCOME` investments, you will only receive transactions up until the last trading date. For example, if today is 19.11.2024, you will only receive transactions up till 18.11.2024. \n\n> \U0001F4D8 `INVESTMENT_FUND` \n>\n> For `INVESTMENT_FUND` investments, this is the date when the transaction (purchase or redemption) is officially processed into fund shares or quotas. For purchases, this is the date the investor’s money is applied to acquire fund shares. For redemptions, this is the date when the fund shares are officially converted back into cash.\n"
          example: '2024-11-18'
        gross_value:
          type: number
          format: float
          pattern: ‘^-?\d{1,15}\.\d{2,4}$’
          description: 'The gross value of the transaction.


            > 🚧 Not applicable for `VARIABLE_INCOME` investments.

            '
          example: 60
        net_value:
          type: number
          format: float
          pattern: ‘^-?\d{1,15}\.\d{2,4}$’
          description: 'The net value of the transaction.


            > 🚧 Not applicable for `VARIABLE_INCOME` investments.

            '
          example: 60
        value:
          type: number
          format: float
          description: 'The value of the transaction.


            For **`VARIABLE_INCOME` investments**, this is the value of the trade executed by the client. If the client buys or sells stocks, this field indicates the total value of the trade (for example, the price per share × quantity).


            For **`INVESTMENT_FUND` investments**, this is the value requested by the client for a fund transaction.


            > 🚧 Only applicable for `VARIABLE_INCOME` and `INVESTMENT_FUND` investments.

            '
          example: 60
        unit_price:
          type: number
          format: float
          description: 'The price for an individual unit or quota.

            '
          example: 3
        price_factor:
          type: number
          format: float
          description: 'The number of units (shares) considered when calculating the price per share or unit for a transaction.


            > 🚧 Only applicable for `VARIABLE_INCOME` investments.

            '
          example: 1
        transaction_tax:
          type: number
          format: float
          description: 'The Financial Transaction Tax (*Imposto sobre Operações Financeiras (IOF)*) applied or withheld during the transaction.


            > 🚧 Not applicable for `VARIABLE_INCOME` investments.

            '
          example: 0
        income_tax:
          type: number
          format: float
          description: 'The Income Tax (*Imposto de Renda (IR)*) applied or withheld during the transaction.


            > 🚧 Not applicable for `VARIABLE_INCOME` investments.

            '
          example: 0
        quantity:
          type: number
          format: float
          description: 'The number of units, quotas, or assets involved in a transaction.

            '
          example: 20
        type:
          type: string
          enum:
          - INFLOW
          - OUTFLOW
          - 'null'
          description: "The transaction type (`INFLOW` or `OUTFLOW`) from the investment perspective. \n"
          example: INFLOW
        subtype:
          type: string
          description: 'The transaction subtype.


            - For `FIXED_INCOME_BANKING`: APLICACAO, RESGATE, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.

            - For `FIXED_INCOME_CREDIT`: COMPRA, VENDA, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, PRÊMIO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, MULTA, MORA, OUTROS.

            - For `VARIABLE_INCOME`: COMPRA, VENDA, DIVIDENDOS, JCP, ALUGUEIS, TRANSFERENCIA_TITULARIDADE, OUTROS.

            - For `INVESTMENT_FUND`: AMORTIZACAO, TRANSFERENCIA_DE_COTAS, APLICACAO, RESGATE, COME_COTAS, OUTROS.

            - For `TREASURY_BOND`: COMPRA, VENDA, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.

            '
          example: null
        subtype_additional_info:
          type: string
          pattern: ‘[\w\W\s]*’
          maxLength: 100
          description: 'Additional information about the transaction subtype. This field is mandatory when the subtype is `OUTROS`.

            '
          example: null
        indexer_percentage:
          type: number
          format: float
          description: 'The maximum percentage of the indexer for the contract (Bancaria) or transaction (Credito).


            > 🚧 Only applicable for `FIXED_INCOME_BANKING` and `FIXED_INCOME_CREDIT` investments.

            '
          example: 0
        rate:
          type: number
          format: float
          description: "The remuneration rate applied to the transaction. \n\n> \U0001F6A7 Only applicable for `FIXED_INCOME_BANKING`, `FIXED_INCOME_CREDIT`, and `TREASURY_BOND` investments.\n"
          example: 0
        exit_fee:
          type: number
          format: float
          description: 'The exit fee applied to the Investment Fund (Fundos de Investimento) transaction. This fee is charged when a client redeems or exits the fund.


            > 🚧 Only applicable for `INVESTMENT_FUND` investments.

            '
          example: 0
        broker_note_details:
          $ref: '#/components/schemas/BrokerNote'
    created_at:
      type: string
      format: date-time
      description: 'The ISO-8601 timestamp of when the data point was created in Belvo''s database.

        '
      example: '2022-02-09T08:45:50.406032Z'
    UnconfirmedLinkError:
      type: object
      title: Unconfirmed Link
      description: 'This error occurs when you try to access a link that was paused previously (and as such is not active now).


        A Link''s status is set to `unconfirmed_link` when your user has not completed the Link creation process successfully (for example, they might not provide a valid MFA token).

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`unconfirmed_link`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-unconfirmed_link" target="_blank">400 unconfirmed_link errors</a>.

            '
          example: unconfirmed_link
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `unconfirmed_link` errors, the description is:\n  \n  - `The link creation has not been completed yet`.\n"
          example: The link creation has not been completed yet
        request_id:
          $ref: '#/components/schemas/request_id'
    LoginError:
      type: object
      title: Login Error
      description: "This error can occur when:\n\n  - the credentials that your user provides are incorrect or missing.\n  - the MFA token your user provides is not supported by Belvo.\n  - there is an issue with the institution that prevents logins.\n  - the user's account is either locked or the user does not have permission to access their internet banking.\n"
      properties:
        code:
          type: string
          description: 'A unique error code (`login_error`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-login_error" target="_blank">400 login_error errors</a>.

            '
          example: login_error
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `login_error` errors, the description can be one of the following:\n\n  - `Invalid credentials provided to login to the institution`\n  - `A MFA token is required by the institution, but it's not supported yet by Belvo.`\n  - `Impossible to login, something unexpected happened while logging into the institution. Try again later.`\n  - `Login not attempted due to invalid credentials`\n  - `Missing credentials to login to the institution`\n  - `The user account access was forbidden by the institution`\n  - `The user account is locked, user needs to contact the institution to unlock it`\n  \n"
          example: Invalid credentials provided to login to the institution
        request_id:
          $ref: '#/components/schemas/request_id'
    InvalidPeriodError:
      type: object
      title: Invalid Period
      description: 'This error occurs when you request incomes for a link within a given date range, however, the period between `date_from` and `date_to` is less than 90 days.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_period`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_period" target="_blank">400 invalid_period errors</a>.

            '
          example: invalid_period
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_period` errors, the description is:\n  \n  - `The number of days between date_from and date_to must be at least 90 days`.\n"
          example: The number of days between date_from and date_to must be at least 90 days
        request_id:
          $ref: '#/components/schemas/request_id'
    TooManySessionsError:
      type: object
      title: Too Many Sessions
      description: "This error occurs when:\n\n  - a user is attempting to log in to their institution via Belvo while also already being logged in to their institution on a web browser or mobile app.\n  - you make a request for information while Belvo is scraping data from the institution for that user.\n"
      properties:
        code:
          type: string
          description: 'A unique error code (`too_many_sessions`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-too_many_sessions" target="_blank">400 too_many_sessions errors</a>.

            '
          example: too_many_sessions
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `too_many_sessions` errors, the description is:\n  \n  - `Impossible to login, a session is already opened with the institution for these credentials`.\n"
          example: Impossible to login, a session is already opened with the institution for these credentials
        request_id:
          $ref: '#/components/schemas/request_id'
    VoucherPaymentDetails:
      type: object
      title: Voucher Payment Details
      description: 'The voucher payment (also known as coupon payments) details of the investment instrument.


        > 🚧 Only applicable for `FIXED_INCOME_CREDIT` and `TREASURY_BOND` investments.

        >

        > This object is only applicable for `FIXED_INCOME_CREDIT` and `TREASURY_BOND` investments. For all other investment types, this object will be `null`.

        '
      properties:
        is_voucher_payment:
          type: boolean
          description: 'Indicates whether the financial instrument pays periodic interest (voucher payments).

            '
          example: true
        periodicity:
          type:
          - string
          - 'null'
          description: "The frequency that the voucher payments are made. Required when `is_voucher_payment` is set to `true`. Can be one of:\n  - `MENSAL` \n  - `TRIMESTRAL` \n  - `SEMESTRAL` \n  - `ANUAL` \n  - `IRREGULAR` \n  - `OUTROS`\n"
          example: MENSAL
        periodicity_additional_info:
          type:
          - string
          - 'null'
          maxLength: 50
          pattern: '[\w\W\s]*'
          description: 'Additional information about the voucher payment periodicity. Required when `periodicity` is set to `OUTROS`.

            '
          example: 30/360
    date_from:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
      minLength: 10
      maxLength: 10
      description: 'The date from which you want to start getting data for, in `YYYY-MM-DD` format.



        ⚠️ The value of `date_from` cannot be greater than `date_to`.

        '
      example: '2020-08-05'
    InstitutionUnavailableError:
      type: object
      title: Institution Unavailable
      description: 'This error occurs when the institution''s website that you''re trying to access is down due to maintenance or other issues, which means Belvo is unable to create new links or retrieve new data.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`institution_unavailable`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-institution_unavailable" target="_blank">400 institution_unavailable errors</a>.

            '
          example: institution_unavailable
        message:
          type: string
          description: "A short description of the error.\n\n\nFor `institution_unavailable` errors, the description is:\n  \n  - `The financial institution is unavailable`.\n"
          example: The financial institution is unavailable
        request_id:
          $ref: '#/components/schemas/request_id'
    BrokerNote:
      type:
      - object
      - 'null'
      title: Broker Note
      required:
      - broker_note_number
      - gross_value
      - brokerage_fee
      - clearing_settlement_fee
      - clearing_registration_fee
      - stock_exchange_asset_trade_notice_fee
      - stock_exchange_fee
      - clearing_custody_fee
      - taxes
      - income_tax
      - net_value
      description: 'Details regarding the broker note that is associated with this transaction. This object is only returned for transactions that are associated with a `VARIABLE_INCOME` investment type.


        > 📘 Info

        >

        > A broker note (*nota de corretagem*) is an official document issued by a brokerage detailing the transactions made by an investor on a given day. It includes information on the gross value of all purchases and sales, brokerage fees, clearing and settlement fees, clearing and registration fees, stock exchange asset trade notice fees, stock exchange fees, clearing custody fees, taxes, and income tax withheld at source.

        '
      properties:
        broker_note_number:
          type: string
          pattern: ‘^\d{1,16}$’
          minLength: 1
          maxLength: 16
          description: The broker note number.
          example: '1854009930314350'
        gross_value:
          type: number
          format: float
          description: The gross value of all purchases and sales for the day.
          example: 1000
        brokerage_fee:
          type: number
          format: float
          description: The total brokerage fee charged for the day.
          example: 10
        clearing_settlement_fee:
          type: number
          format: float
          description: The fee charged for clearing and settlement in custody.
          example: 2.5
        clearing_registration_fee:
          type: number
          format: float
          description: The fee charged for clearing and registration in custody.
          example: 1
        stock_exchange_asset_trade_notice_fee:
          type: number
          format: float
          description: The fee charged by the stock exchange for asset trade notifications.
          example: 0.5
        stock_exchange_fee:
          type: number
          format: float
          description: The fee charged by the stock exchange for registry services.
          example: 3
        clearing_custody_fee:
          type: number
          format: float
          description: The fee charged by financial institutions for custody services.
          example: 1.5
        taxes:
          type: number
          format: float
          description: The total amount taxes charged on the transaction for the day, excluding income tax withheld at source.
          example: 10
        income_tax:
          type: number
          format: float
          description: The total amount of income tax withheld at the source for the day.
          example: 5
        net_value:
          type: number
          format: float
          description: The net value of the broker note after deducting expenses for brokerage fees, clearing settlement fees, registration fees, ANA fees, emoluments, custody fees, taxes, and IRRF
          example: 980
    link_request:
      type: string
      format: uuid
      description: The `link.id` you want to retrieve information for.
      example: c81a1dea-6dd6-4999-8b9f-541ee8197058
    InvalidFetchHistorical:
      type: object
      title: Invalid Fetch Resources
      description: 'This error occurs when you attempted to create a link where you set `credentials_storage` to `nostore` and did not send any resources in the `fetch_resources`. For links where we don''t store credentials, you must send through an array of resources in `fetch_resources`.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_fetch_resources`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_fetch_resources" target="_blank">400 invalid_fetch_resources errors</a>.

            '
          example: invalid_fetch_resources
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_fetch_resources` errors, the description can be one of the following:\n\n  - `Single links without stored credentials must fetch resources`\n  \n"
          example: Single links without stored credentials must fetch resources
        request_id:
          $ref: '#/components/schemas/request_id'
    id:
      type: string
      format: uuid
      description: 'Belvo''s unique identifier for the current item.

        '
      example: 0d3ffb69-f83b-456e-ad8e-208d0998d71d
    UnsupportedOperationError:
      type: object
      title: Unsupported Operation
      description: 'This error occurs when you try to access some data operation that Belvo does not support for an institution. For example, trying to access the Balances resource for fiscal institutions.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`unsupported_operation`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-unsupported_operation" target="_blank">400 unsupported_operation errors</a>.

            '
          example: unsupported_operation
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `unsupported_operation` errors, the description is:\n  \n  - `The resource you are trying to access is not supported by this institution`.\n"
          example: The resource you are trying to access is not supported by this institution
        request_id:
          $ref: '#/components/schemas/request_id'
    collected_at:
      type: string
      format: date-time
      description: 'The ISO-8601 timestamp when the data point was collected.

        '
      example: '2022-02-09T08:45:50.406032Z'
    AccessToResourceDenied:
      type: object
      title: Access to Belvo API denied
      description: 'This error occurs when you try to access Belvo''s resource without the correct permissions.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`access_to_resource_denied`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#403-access_to_resource_denied" target="_blank">403 access_to_resource_denied</a>.

            '
          example: access_to_resource_denied
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `access_to_resource_denied` errors, the description is:\n  \n  - `You don't have access to this resource.`.\n"
          example: You don't have access to this resource.
        request_id:
          $ref: '#/components/schemas/request_id'
    UnexpectedError:
      type: object
      title: Unexpected Error
      description: 'This error occurs when we (Belvo) have encountered an internal system error (sorry about that) or due to an unsupported response from the institution.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`unexpected_error`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#500-unexpected_error" target="_blank">500 unexpected_error errors</a>.

            '
          example: unexpected_error
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `unexpected_error` errors, the description is:\n  \n  - `Belvo is unable to process the request due to an internal system issue or to an unsupported response from an institution`.\n"
          example: Belvo is unable to process the request due to an internal system issue or to an unsupported response from an institution
        request_id:
          $ref: '#/components/schemas/request_id'
    InvestmentBrazil:
      type: object
      title: Investments Object (Brazil)
      x-tags:
      - Investments Brazil
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier created by Belvo used to reference the current investment.
          example: 5359ddc5-31fc-4346-934b-cc24630a8d06
        type:
          type: string
          description: "The type of investment: Can be either\n\n  - `FIXED_INCOME_BANKING` (*Renda Fixa Bancária*)\n  - `FIXED_INCOME_CREDIT` (*Renda Fixa Crédito*)\n  - `VARIABLE_INCOME` (*Renda Variável*)\n  - `TREASURY_BOND` (*Tesouro Direto*)\n  - `INVESTMENT_FUND` (*Fundos de Investimento*)\n"
          example: FIXED_INCOME_BANKING
        issuer_id_number:
          type:
          - string
          - 'null'
          maxLength: 14
          pattern: ^\d{14}$
          description: 'The CNPJ number of the issuing institution. For Investment Funds, this is the CNPJ of the fund.


            > 🚧 Not applicable for `TREASURY_BOND` investments.

            '
          example: '10187609364567'
        isin_number:
          type:
          - string
          - 'null'
          maxLength: 12
          pattern: ‘^[A-Z]{2}([A-Z0-9]){9}\d{1}$’
          description: 'The ISO-6166 International Securities Identification Number (ISIN) for the financial instrument.

            '
          example: BRCST4CTF001
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: 'The three-letter currency code (ISO-4217) of the investment. For example, `BRL` for Brazilian Real.

            '
          example: BRL
        product_name:
          type: string
          maxLength: 250
          description: 'The name of the investment product.


            - For `FIXED_INCOME_BANKING`, this can be: CDB, RDB, LCI, or LCA.

            - For `FIXED_INCOME_CREDIT`, this can be: DEBENTURES, CRI, or CRA.

            - For `INVESTMENT_FUND`, this will be the name of the fund. For example: CONSTELLATION MASTER FIA

            - For `TREASURY_BOND`, this will be the name of the bond. For example: Tesouro Selic 2025.

            - For `VARIABLE_INCOME_INCOME`, this will be the name of the stock. For example AAPL.

            '
          example: CONSTELLATION MASTER FIA
        is_tax_exempt:
          type: boolean
          description: 'Indicates if the investment is exempt from taxes.


            > 🚧 Only applicable for `FIXED_INCOME_CREDIT` investments.

            '
          example: false
        clearing_code:
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: '[\w\W-]*'
          description: 'The clearing code of the investment.


            > 🚧 Only applicable for `FIXED_INCOME_BANKING` and `FIXED_INCOME_CREDIT`.

            '
          example: CDB421GPXXX
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: "The maturity date of the financial instrument. \n\n> \U0001F6A7 Only applicable for `FIXED_INCOME_BANKING`, `FIXED_INCOME_CREDIT`, and `TREASURY_BOND` investments.\n"
          example: '2022-01-01'
        issue_date:
          type:
          - string
          - 'null'
          format: date
          description: 'The date the financial instrument was issued.


            > 🚧 Only applicable for `FIXED_INCOME_BANKING` and `FIXED_INCOME_CREDIT`.

            '
          example: '2021-01-01'
        purchase_date:
          type:
          - string
          - 'null'
          format: date
          description: 'The date the financial instrument was purchased.


            > 🚧 Only applicable for `FIXED_INCOME_BANKING`, `FIXED_INCOME_CREDIT`, and `TREASURY_BOND` investments.

            '
          example: '2021-01-01'
        grace_period_date:
          type:
          - string
          - 'null'
          format: date
          description: 'The grace period date of the financial instrument.


            > 🚧 Only applicable for `FIXED_INCOME_BANKING` and `FIXED_INCOME_CREDIT`.

            '
          example: '2021-01-01'
        issue_unit_price:
          type:
          - number
          - 'null'
          format: float
          description: 'The unit price of the financial instrument at the time of issuance.


            > 🚧 Only applicable for `FIXED_INCOME_BANKING` and `FIXED_INCOME_CREDIT`.

            '
          example: 1000
        balance:
          $ref: '#/components/schemas/InvestmentBalance'
        remuneration:
          $ref: '#/components/schemas/Remuneration'
        classification_details:
          $ref: '#/components/schemas/ClassificationDetails'
        voucher_payment_details:
          $ref: '#/components/schemas/VoucherPaymentDetails'
        debtor_details:
          $ref: '#/components/schemas/DebtorDetails'
    InvestmentBalance:
      type: object
      title: Investment Instrument Balance
      description: 'The balance of the investment instrument, as of the `reference_date`.

        '
      properties:
        reference_date:
          type: string
          format: date-time
          description: 'The date and time that the balance was calculated for the investment instrument, in `YYYY-MM-DDTHH:MM:SSZ` format.

            '
          example: '2022-07-21T17:32:00Z'
        gross_value:
          type: number
          format: float
          description: The gross value of the investment instrument.
          example: 1000
        blocked_amount:
          type: number
          format: float
          description: The amount of the investment instrument that is blocked or unavailable for transactions.
          example: 100
        quantity:
          type: number
          format: float
          pattern: ‘^-?\d{1,15}\.\d{2,8}$’
          description: The number of units, quotas, or assets held on the reference date.
          example: 100
        gross_unit_price:
          type:
          - number
          - 'null'
          format: float
          pattern: ‘^-?\d{1,15}\.\d{2,8}$’
          description: The current gross unit value of the investment on the reference date
          example: 10
        net_value:
          type:
          - number
          - 'null'
          format: float
          pattern: ‘^-?\d{1,15}\.\d{2,8}$’
          description: The net value of the investment after deductions for taxes, fees, and other charges, as of the reference date.
          example: 900
        withheld_amount:
          type:
          - number
          - 'null'
          format: float
          pattern: ‘^\d{1,15}\.\d{2,4}$’
          description: The amount of the investment instrument that has been withheld or deducted from the net value.
          example: 10
        transaction_fee:
          type:
          - number
          - 'null'
          format: float
          pattern: ‘^\d{1,15}\.\d{2,4}$’
          description: The fees and taxes charged for the transaction.
          example: 5
