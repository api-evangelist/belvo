      - unarranged
      properties:
        arranged:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The agreed upon overdraft limit between the account holder and the institution.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `overdraft` field is available.

            '
          example: 5000.5
        used:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The overdraft value used.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `overdraft` field is available.

            '
          example: 1000.5
        unarranged:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The overdraft used that was not arranged between the account holder and the institution.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `overdraft` field is available.

            '
          example: 300.1
    date_from:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
      minLength: 10
      maxLength: 10
      description: 'The date from which you want to start getting data for, in `YYYY-MM-DD` format.



        ⚠️ The value of `date_from` cannot be greater than `date_to`.

        '
      example: '2020-08-05'
    EnumAccountCreditCardNetwork:
      type: string
      enum:
      - VISA
      - MASTERCARD
      - AMERICAN_EXPRESS
      - DINERS_CLUB
      - HIPERCARD
      - BANDEIRA_PROPRIA
      - CHEQUE_ELETRONICO
      - ELO
      - OTHER
      description: "The credit network that the card is associated with. We return one of the following values:\n\n  - `VISA`\n  - `MASTERCARD`\n  - `AMERICAN_EXPRESS`\n  - `DINERS_CLUB`\n  - `HIPERCARD`\n  - `BANDEIRA_PROPRIA`\n  - `CHEQUE_ELETRONICO`\n  - `ELO`\n  - `OTHER`\n\n  > **Non-nullable:** A value must be returned by Brazil's open finance network.\n"
      example: MASTERCARD
    UnsupportedOperationError:
      type: object
      title: Unsupported Operation
      description: 'This error occurs when you try to access some data operation that Belvo does not support for an institution. For example, trying to access the Balances resource for fiscal institutions.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`unsupported_operation`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-unsupported_operation" target="_blank">400 unsupported_operation errors</a>.

            '
          example: unsupported_operation
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `unsupported_operation` errors, the description is:\n  \n  - `The resource you are trying to access is not supported by this institution`.\n"
          example: The resource you are trying to access is not supported by this institution
        request_id:
          $ref: '#/components/schemas/request_id'
    link:
      type:
      - string
      - 'null'
      format: uuid
      description: The `link.id` the data belongs to.
      example: 30cb4806-6e00-48a4-91c9-ca55968576c8
    AccountLoanDataInterestRateDataOpenFinanceBrazil:
      type:
      - object
      - 'null'
      required:
      - tax_type
      - rate_type
      - calculation_base
      - reference_index_type
      - reference_index_subtype
      - reference_index_info
      - pre_fixed_rate
      - post_fixed_rate
      - additional_info
      description: Detailed information regarding the interest rate.
      properties:
        tax_type:
          $ref: '#/components/schemas/EnumAccountLoanDataInterestRateDataTaxType'
        rate_type:
          $ref: '#/components/schemas/EnumAccountLoanDataInterestRateDataRateType'
        type:
          $ref: '#/components/schemas/EnumAccountLoanDataInterestRateType'
        calculation_base:
          type: string
          pattern: ^[0-9]{2}\/[0-9]{3}$
          description: 'The base calculation for the interest rate.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: 30/360
        reference_index_type:
          $ref: '#/components/schemas/EnumAccountLoanDataInterestRateDataReferenceIndexType'
        reference_index_subtype:
          type:
          - string
          - 'null'
          description: 'The subtype of the reference index rate.

            '
          example: TR_TBF
        reference_index_info:
          type:
          - string
          - 'null'
          maxLength: 140
          pattern: ^[\w\W\s]{0,140}$
          description: 'Additional information regarding the reference index rate.

            '
          example: Additional information
        pre_fixed_rate:
          type: number
          format: float
          pattern: ^[01]\.\d{6}$
          description: 'The pre-fixed percentage rate of the interest rate.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: 0.062
        post_fixed_rate:
          type: number
          format: float
          pattern: ^[01]\.\d{6}$
          description: 'The post-fixed percentage rate of the interest rate.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: 0.062
        additional_info:
          type:
          - string
          - 'null'
          maxLength: 1200
          pattern: '[\w\W\s]*'
          description: 'Additional information regarding the interest rate.

            '
          example: Additional information
    EnumAccountCategoryOpenFinance:
      type:
      - string
      - 'null'
      enum:
