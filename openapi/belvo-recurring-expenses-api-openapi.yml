openapi: 3.2.0
info:
  title: Belvo API Docs Recurring Expenses API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Recurring Expenses
  description: 'Belvo''s Recurring Expenses API allows you to identify a user''s regular payments for subscription services, such as Netflix or gym memberships, as well as utility payments, such as electricity or phone bills. We return information for up to 365 days.


    > 📘 Info

    >

    > The recurring expenses resource is **only** available for Checking, Savings and Credit Card accounts associated with banking links.'
paths:
  /api/recurring-expenses/:
    get:
      tags:
      - Recurring Expenses
      operationId: ListRecurringExpenses
      summary: List recurring expenses
      description: '## ▶️ Usage


        With the List Recurring Expenses method, you can:


        1. List recurring expenses related to a specific `link.id` (using the `link` query parameter).

        2. Get the details of a specific `recurring-expense.id` (using the `id` query parameter).

        3. **[Not Recommended]** List all recurring expenses related to your Belvo account (without using any query parameters).


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.'
      parameters:
      - $ref: '#/components/parameters/link'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/link__in'
      - $ref: '#/components/parameters/account'
      - $ref: '#/components/parameters/account__in'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/id__in'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of recurring expense objects.
                      items:
                        $ref: '#/components/schemas/RecurringExpenses'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    post:
      tags:
      - Recurring Expenses
      operationId: RetrieveRecurringExpenses
      summary: Retrieve recurring expenses for a link
      description: 'Retrieve recurring expense insights for checking and savings accounts from a

        specific link. You can receive insights for a period of up to 365 days,

        depending on the transaction history available for each institution.'
      parameters:
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request body for the Retrieve Recurring Expenses method.
              required:
              - link
              properties:
                link:
                  $ref: '#/components/schemas/link_request'
                token:
                  $ref: '#/components/schemas/token'
                save_data:
                  $ref: '#/components/schemas/save_data'
                date_from:
                  $ref: '#/components/schemas/date_from'
                date_to:
                  $ref: '#/components/schemas/date_to'
      responses:
        '200':
          description: Ok (when save_data=false)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringExpenses'
        '201':
          description: Created (when save_data=true)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringExpenses'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/recurring-expenses/{id}/:
    get:
      tags:
      - Recurring Expenses
      operationId: DetailRecurringExpense
      summary: Get a recurring expense's details
      description: Get the details of a specific recurring expense.
      parameters:
      - name: id
        in: path
        required: true
        description: The `recurring-expenses.id` you want to get detailed information about.
        schema:
          type: string
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringExpenses'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    delete:
      tags:
      - Recurring Expenses
      operationId: DestroyRecurringExpense
      summary: Delete a recurring expense
      description: Delete a specific recurring expense from your Belvo account.
      parameters:
      - name: id
        in: path
        required: true
        description: The `recurring-expenses.id` that you want to delete
        schema:
          type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    omit:
      name: omit
      in: query
      description: Omit certain fields from being returned in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    link:
      name: link
      in: query
      description: 'The `link.id` you want to filter by.


        ℹ️ We highly recommend adding the `link.id` filter in order to improve your performance.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    page_size:
      name: page_size
      in: query
      description: 'Indicates how many results to return per page. By default we return 100 results per page.


        ℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).

        '
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    id:
      name: id
      in: query
      description: Return information only for this resource `id`.
      schema:
        type: string
        format: uuid
        example: 24ccab1d-3a86-4136-a6eb-e04bf52b356f
    account:
      name: account
      in: query
      description: 'The `account.id` you want to filter by.


        ℹ️ We highly recommend adding either the `link.id` or the `account.id` filters in order to improve your performance.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    link__in:
      name: link__in
      in: query
      description: Return results only for these `link.id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 5722d0ba-69d7-42dc-8ff5-33767b83c5d6
    fields:
      name: fields
      in: query
      description: Return only the specified fields in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    page:
      name: page
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    account__in:
      name: account__in
      in: query
      description: Return results only for these `account.id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 85b77707-90ef-46fd-9059-5a757f24247a
    id__in:
      name: id__in
      in: query
      description: Return information for these resource `id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 6b3dea0f-be29-49d1-aabe-1a6d588642e6
  schemas:
    last_accessed_at:
      type:
      - string
      - 'null'
      format: date-time
      description: 'The ISO-8601 timestamp of Belvo''s most recent successful access to the institution for the given link.

        '
      example: '2021-03-09T10:28:40.000Z'
    EnumInstitutionType:
      type: string
      enum:
      - bank
      - fiscal
      - employment
      description: "The type of institution. We return one of the following values:\n\n  - `bank`\n  - `fiscal`\n  - `employment`\n"
    EnumAccountLoanDataFeeChargeType:
      type: string
      enum:
      - SINGLE
      - PER_INSTALLMENT
      description: "Indicates the type of charge. We return one of the following values:\n\n  - `SINGLE`\n  - `PER_INSTALLMENT`\n\n   > **Non-nullable:** A value must be returned by Brazil's open finance network if the `fees` field is available.\n"
      example: SINGLE
    EnumAccountLoanDataInterestRateDataTaxType:
      type: string
      enum:
      - NOMINAL
      - EFFECTIVE
      description: "The type of interest rate tax. We return one of the following values:\n\n  - `NOMINAL`\n  - `EFFECTIVE`\n  \n  > **Non-nullable:** A value must be returned by Brazil's open finance network.\n"
      example: NOMINAL
    InstitutionUnavailableError:
      type: object
      title: Institution Unavailable
      description: 'This error occurs when the institution''s website that you''re trying to access is down due to maintenance or other issues, which means Belvo is unable to create new links or retrieve new data.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`institution_unavailable`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-institution_unavailable" target="_blank">400 institution_unavailable errors</a>.

            '
          example: institution_unavailable
        message:
          type: string
          description: "A short description of the error.\n\n\nFor `institution_unavailable` errors, the description is:\n  \n  - `The financial institution is unavailable`.\n"
          example: The financial institution is unavailable
        request_id:
          $ref: '#/components/schemas/request_id'
    InvalidFetchHistorical:
      type: object
      title: Invalid Fetch Resources
      description: 'This error occurs when you attempted to create a link where you set `credentials_storage` to `nostore` and did not send any resources in the `fetch_resources`. For links where we don''t store credentials, you must send through an array of resources in `fetch_resources`.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_fetch_resources`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_fetch_resources" target="_blank">400 invalid_fetch_resources errors</a>.

            '
          example: invalid_fetch_resources
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_fetch_resources` errors, the description can be one of the following:\n\n  - `Single links without stored credentials must fetch resources`\n  \n"
          example: Single links without stored credentials must fetch resources
        request_id:
          $ref: '#/components/schemas/request_id'
    EnumRecurringExpenseFrequency:
      type: string
      enum:
      - MONTHLY
      default: MONTHLY
      description: 'The frequency at which this recurring expense occurs.



        ℹ️ **Note:** Belvo only identifies `MONTHLY` frequencies.

        '
      example: MONTHLY
    AccountCreditDataOpenFinanceBrazil:
      type:
      - object
      - 'null'
      required:
      - collected_at
      - credit_limit
      description: Details regarding the credit cards associated with this account.
      properties:
        collected_at:
          $ref: '#/components/schemas/collected_at'
        credit_limit:
          type:
          - number
          - 'null'
          format: float
          maxLength: 20
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The upper credit limit of the card.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: 192000.9
        limits:
          type: array
          items:
            $ref: '#/components/schemas/AccountCreditDataLimitsOpenFinanceBrazil'
        cutting_date:
          type:
          - string
          - 'null'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          description: The date when the credit card's bill is due.
          example: '2019-12-11'
        minimum_payment:
          type:
          - number
          - 'null'
          format: float
          maxLength: 20
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The minimum amount that the account owner needs to pay in the current credit period.

            '
          example: 2400.3
        network:
          $ref: '#/components/schemas/EnumAccountCreditCardNetwork'
        network_additional_info:
          type:
          - string
          - 'null'
          maxLength: 100
          pattern: '[\w\W\s]*'
          description: 'Additional information about the credit card network.

            '
          example: It's an orange card.
        cards:
          type: array
          minItems: 1
          description: Details regarding the cards associated with the account.
          items:
            $ref: '#/components/schemas/AccountCreditDataCardsOpenFinanceBrazil'
        next_payment_date:
          type:
          - string
          - 'null'
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        no_interest_payment:
          type:
          - number
          - 'null'
          format: float
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        interest_rate:
          type:
          - number
          - 'null'
          format: float
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        monthly_payment:
          type:
          - number
          - 'null'
          deprecated: true
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
        last_payment_date:
          type:
          - string
          - 'null'
          deprecated: true
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
    EnumRecurringExpenseCategory:
      type: string
      enum:
      - Bills & Utilities
      - Credits & Loans
      - Insurance
      - Online Platforms & Leisure
      - Transport & Travel
      - Taxes
      description: 'The transaction category for the recurring expense.


        - `Online Platforms & Leisure` (Netflix, Spotify, Gym Memberships)

        - `Bills & Utilities` (electricity, telephone, internet)

        - `Credits & Loans` (credit card cash advances, student loan, watercraft lease)

        - `Insurance` (home, car, and health & life insurance)

        - `Transport & Travel` (Uber trip, airbnb, parking)

        - `Taxes` (service fee, donation, court taxes)

        '
      example: Online Platforms & Leisure
    AccountBalanceOpenFinanceBrazil:
      type: object
      required:
      - current
      description: 'Details regarding the current and available balances for the account.

        '
      properties:
        current:
          type:
          - number
          - 'null'
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The current balance is calculated differently according to the type of account.



            - **💰 Checking and saving accounts**:



            The user''s account balance at the `collected_at` timestamp.


            - **💳 Credit cards**:



            The amount the user has spent in the current card billing period (see `credit_data.cutting_date` for information on when the current billing period finishes).


            - **🏡 Loan accounts**:



            The amount remaining to pay on the users''s loan.

            '
          example: 5874.13
        available:
          type:
          - number
          - 'null'
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The balance that the account owner can use.


            - **💰 Checking and saving accounts**:



            The available balance may be different to the `current` balance due to pending transactions.


            - **💳 Credit cards**:



            The credit amount the user still has available for the current period. The amount is calculated as `credit_data.credit_limit` minus `balance.current`.


            - **🏡 Loan accounts**:



            The present value required to pay off the loan, as provided by the institution.



            **Note:** If the institution does not provide this value, we return `null`.

            '
          example: 5621.12
        blocked:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The amount that is currently blocked due to pending transactions.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `balances` field is available.

            '
          example: 60.32
        automatically_invested:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The amount that is automatically invested (as agreed upon with the institution).


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `balances` field is available.

            '
          example: 131.5
    AccountLoanDataBalloonPaymentsOpenFinanceBrazil:
      type:
      - object
      - 'null'
      description: Detailed information regarding any balloon payments for the loan, if applicable.
      required:
      - due_date
      - currency
      - amount
      properties:
        due_date:
          type:
          - string
          - 'null'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          description: 'The date that the balloon payment is to be paid, in `YYYY-MM-DD` format.

            '
          example: '2021-09-06'
        currency:
          type:
          - string
          - 'null'
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: 'The three-letter currency code (ISO-4217).

            '
          example: BRL
        amount:
          type:
          - number
          - 'null'
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The total amount of the balloon payment.

            '
          example: 45391.89
    AccountLoanDataFeesOpenFinanceBrazil:
      type:
      - object
      - 'null'
      required:
      - type
      - value
      - name
      - code
      - fee_charge_type
      - fee_charge
      - rate
      description: Breakdown of the fees applied to the loan.
      properties:
        type:
          $ref: '#/components/schemas/EnumAccountLoanDataFeeType'
        value:
          type:
          - number
          - 'null'
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          description: 'The total value of the fee. Same currency as the loan.

            '
          example: 5.6
        name:
          type: string
          maxLength: 140
          pattern: ^[\w\W\s]{0,140}$
          description: "The fee name.\n\n > **Non-nullable:** A value must be returned by Brazil's open finance network if the `fees` field is available.\n"
          example: Renovação de cadastro
        code:
          type: string
          maxLength: 140
          pattern: ^[\w\W\s]{0,140}$
          description: "The fee code.\n\n > **Non-nullable:** A value must be returned by Brazil's open finance network if the `fees` field is available.\n"
          example: CADASTRO
        fee_charge_type:
          $ref: '#/components/schemas/EnumAccountLoanDataFeeChargeType'
        fee_charge:
          $ref: '#/components/schemas/EnumAccountLoanDataFeeCharge'
        rate:
          type:
          - number
          - 'null'
          format: float
          pattern: ^[01]\.\d{6}$
