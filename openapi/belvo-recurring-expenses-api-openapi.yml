        internal_identification:
          type: string
          maxLength: 100
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          description: 'The institution''s internal identification for the account.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network if the `balances` field is available.

            '
          example: '92792126019929279212650822221989319252576'
        credit_data:
          $ref: '#/components/schemas/AccountCreditDataOpenFinanceBrazil'
        loan_data:
          $ref: '#/components/schemas/AccountLoanDataOpenFinanceBrazil'
        funds_data:
          type:
          - string
          - 'null'
          description: '**Note:** This field is not applicable for OF Brazil and will return null.

            '
          example: null
    SessionExpiredError:
