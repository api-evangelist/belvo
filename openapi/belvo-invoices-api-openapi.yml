            $ref: '#/components/schemas/InvoiceDetailSat'
        currency:
          type:
          - string
          - 'null'
          description: "The currency of the invoice. For example:\n \n - \U0001F1E7\U0001F1F7 BRL (Brazilian Real)\n - \U0001F1E8\U0001F1F4 COP (Colombian Peso)\n - \U0001F1F2\U0001F1FD MXN (Mexican Peso)\n - \U0001F1FA\U0001F1F8 USD (United States Dollar)\n"
          example: MXN
        subtotal_amount:
          type:
          - number
          - 'null'
          format: float
          description: 'The pretax amount of this invoice (sum of each item''s `pre_tax_amount`).

            '
          example: 400
        exchange_rate:
          type:
          - number
          - 'null'
          format: float
          description: 'The exchange rate used in this invoice for the currency.

            '
          example: 0.052
        tax_amount:
          type:
          - number
          - 'null'
          format: float
          description: 'The amount of tax for this invoice (sum of each item''s `tax_amount`).

            '
          example: 64
        discount_amount:
          type:
          - number
          - 'null'
          format: float
          description: 'The total amount discounted in this invoice.

            '
          example: 10
        total_amount:
          type:
          - number
          - 'null'
          format: float
          description: 'The total amount of the invoice (`subtotal_amount` + `tax_amount` - `discount_amount`)

            '
          example: 454
        related_invoices:
          type: array
          description: A list of related invoices.
          items:
            $ref: '#/components/schemas/RelatedInvoiceSat'
        payments:
          type: array
          description: 'A list detailing all the invoice payments.

            '
          items:
            $ref: '#/components/schemas/InvoicesPaymentsSat'
        payroll:
          $ref: '#/components/schemas/InvoicesPayrollSat'
        folio:
          type:
          - string
          - 'null'
          description: 'The internal control number that the taxpayer assigns to the invoice.

            '
          example: '26'
        series:
          type:
          - string
          - 'null'
          description: 'The series of the invoice, as defined by the taxpayer. This is an optional field used to group invoices.

            '
          example: A
        export_type:
          type:
          - string
          - 'null'
          description: The export type of the invoice, as defined by the legal entity in the country. For more information, see our <a href="https://developers.belvo.com/docs/sat-catalogs#export-type" target="_blank">SAT catalog reference article</a>.
          example: '01'
        xml:
          type:
          - string
          - 'null'
          description: 'XML of the invoice document.

            '
        warnings:
          $ref: '#/components/schemas/InvoiceWarningsSat'
        sender_blacklist_status:
          type:
          - string
          - 'null'
          deprecated: true
          description: '*This field has been deprecated. For more information regarding Belvo and deprecation, see our Deprecated fields explanation.*

            Please use `sender_tax_fraud_status` instead.

            '
          example: null
        receiver_blacklist_status:
          type:
          - string
          - 'null'
          deprecated: true
          description: '*This field has been deprecated. For more information regarding Belvo and deprecation, see our Deprecated fields explanation.*

            Please use `receiver_tax_fraud_status` instead.

            '
          example: null
