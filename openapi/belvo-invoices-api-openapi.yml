openapi: 3.2.0
info:
  title: Belvo API Docs Invoices API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Invoices
paths:
  /api/invoices/:
    get:
      tags:
      - Invoices
      operationId: ListInvoices
      description: '## ▶️ Usage


        With the List Invoices method, you can:


        1. List invoices related to a specific `link.id` (using the `link` query parameter).

        2. Get the details of a specific `invoice.id` (using the `id` query parameter).

        3. **[Not Recommended]** List all invoices related to your Belvo account (without using any query parameters).


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.


        ## 🚨 Deprecated Fields


        This resource may return deprecated fields. In the response documentation you may see that a field has been marked as **deprecated**. This means that this field is no longer maintained by the Belvo team. You may still receive data for this field depending on the institution, however, you should not rely on this field.'
      summary: List invoices
      parameters:
      - $ref: '#/components/parameters/link'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/link__in'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      - $ref: '#/components/parameters/invoice_date'
      - $ref: '#/components/parameters/invoice_date__lt'
      - $ref: '#/components/parameters/invoice_date__lte'
      - $ref: '#/components/parameters/invoice_date__gt'
      - $ref: '#/components/parameters/invoice_date__gte'
      - $ref: '#/components/parameters/invoice_date__range'
      - $ref: '#/components/parameters/invoice_identification'
      - $ref: '#/components/parameters/invoice_identification__in'
      - $ref: '#/components/parameters/status_invoice'
      - $ref: '#/components/parameters/status__in_invoice'
      - $ref: '#/components/parameters/type_invoice'
      - $ref: '#/components/parameters/type__in_invoice'
      - $ref: '#/components/parameters/total_amount'
      - $ref: '#/components/parameters/total_amount__lt'
      - $ref: '#/components/parameters/total_amount__lte'
      - $ref: '#/components/parameters/total_amount__gt'
      - $ref: '#/components/parameters/total_amount__gte'
      - $ref: '#/components/parameters/total_amount__range'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: Array of invoice objects.
                      items:
                        $ref: '#/components/schemas/InvoiceWithIdSat'
              examples:
                InvoiceIngresso:
                  $ref: '#/components/examples/InvoiceIngresoPaginated'
                InvoicePago:
                  $ref: '#/components/examples/InvoicePagoPaginated'
                InvoiceNomina:
                  $ref: '#/components/examples/InvoiceNominaPaginated'
                InvoiceEgreso:
                  $ref: '#/components/examples/InvoiceEgresoPaginated'
                InvoiceTraslado:
                  $ref: '#/components/examples/InvoiceTrasladoPaginated'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    post:
      tags:
      - Invoices
      operationId: RetrieveInvoices
      summary: Retrieve invoices for a link
      description: 'Retrieve invoice information from a specific fiscal link.


        > 📘 Info

        >

        > You can ask for up to **one** year (365 days) of invoices per request. If you need invoices for more than one year, just make another request.


        > 🚧 Warning

        >

        > This resource may return deprecated fields. Please check the response documentation for more information.'
      parameters:
      - $ref: '#/components/parameters/async'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - date_from
              - date_to
              - link
              - type
              properties:
                link:
                  $ref: '#/components/schemas/link_request'
                date_from:
                  $ref: '#/components/schemas/date_from'
                date_to:
                  $ref: '#/components/schemas/date_to'
                type:
                  $ref: '#/components/schemas/EnumInvoiceType'
                attach_xml:
                  $ref: '#/components/schemas/attach_xml'
                save_data:
                  $ref: '#/components/schemas/save_data'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceWithIdSat'
              examples:
                InvoiceIngresso:
                  $ref: '#/components/examples/InvoiceIngreso'
                InvoicePago:
                  $ref: '#/components/examples/InvoicePago'
                InvoiceNomina:
                  $ref: '#/components/examples/InvoiceNomina'
                InvoiceEgreso:
                  $ref: '#/components/examples/InvoiceEgreso'
                InvoiceTraslado:
                  $ref: '#/components/examples/InvoiceTraslado'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceWithIdSat'
              examples:
                InvoiceIngresso:
                  $ref: '#/components/examples/InvoiceIngreso'
                InvoicePago:
                  $ref: '#/components/examples/InvoicePago'
                InvoiceNomina:
                  $ref: '#/components/examples/InvoiceNomina'
                InvoiceEgreso:
                  $ref: '#/components/examples/InvoiceEgreso'
                InvoiceTraslado:
                  $ref: '#/components/examples/InvoiceTraslado'
        '202':
          $ref: '#/components/responses/202_accepted_response'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    patch:
      tags:
      - Invoices
      operationId: PatchInvoices
      summary: Complete an invoices request
      description: 'Used to resume an Invoice retrieve session that was paused because an MFA

        token was required by the institution.


        {% admonition type="info" %}

        This resource may return deprecated fields. Please check the response documentation for more information.

        {% /admonition %}'
      parameters:
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBody'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceWithIdSat'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceWithIdSat'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/invoices/{id}/:
    get:
      tags:
      - Invoices
      operationId: DetailInvoice
      summary: Get an invoice's details
      description: 'Get the details of a specific invoice.


        {% admonition type="info" %}

        This resource may return deprecated fields. Please check the response documentation for more information.

        {% /admonition %}'
      parameters:
      - name: id
        in: path
        required: true
        description: The `invoice.id` you want to get detailed information about.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceWithIdSat'
              examples:
                InvoiceIngresso:
                  $ref: '#/components/examples/InvoiceIngresoDetail'
                InvoicePago:
                  $ref: '#/components/examples/InvoicePagoDetail'
                InvoiceNomina:
                  $ref: '#/components/examples/InvoiceNominaDetail'
                InvoiceEgreso:
                  $ref: '#/components/examples/InvoiceEgresoDetail'
                InvoiceTraslado:
                  $ref: '#/components/examples/InvoiceTrasladoDetail'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    delete:
      tags:
      - Invoices
      operationId: DestroyInvoice
      summary: Delete an invoice
      description: Delete a specific invoice from your Belvo account.
      parameters:
      - name: id
        in: path
        required: true
        description: The `invoice.id` that you want to delete.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    omit:
      name: omit
      in: query
      description: Omit certain fields from being returned in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    created_at__lte:
      name: created_at__lte
      in: query
      description: Return items that were last updated in Belvo's database before or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-03-30'
    async:
      name: X-Belvo-Request-Mode
      in: header
      description: 'Recommended header parameter to make your POST request asynchronous (thus preventing timeouts and improving your data flow).


        When you make an asynchronous request, Belvo responds with a `202 - Accepted` payload, including the `request_id`. Once we have retrieved the requested information, you will receive a webhook with the link and request IDs.

        '
      schema:
        type: string
        enum:
        - async
        example: async
    invoice_date__lt:
      name: invoice_date__lt
      in: query
      description: Return balances issued before this date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
        example: '2022-03-02'
    link:
      name: link
      in: query
      description: 'The `link.id` you want to filter by.


        ℹ️ We highly recommend adding the `link.id` filter in order to improve your performance.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    page_size:
      name: page_size
      in: query
      description: 'Indicates how many results to return per page. By default we return 100 results per page.


        ℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).

        '
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    id:
      name: id
      in: query
      description: Return information only for this resource `id`.
      schema:
        type: string
        format: uuid
        example: 24ccab1d-3a86-4136-a6eb-e04bf52b356f
    invoice_date__gte:
      name: invoice_date__gte
      in: query
      description: Return invoices issued on this date or later (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
        example: '2022-05-04'
    type_invoice:
      name: type
      in: query
      description: Return invoices of this type. Can be either `OUTFLOW` or `INFLOW`.
      schema:
        type: string
        enum:
        - OUTFLOW
        - INFLOW
        example: OUTFLOW
    created_at__range:
      name: created_at__range
      in: query
      description: Return accounts that were last updated in Belvo's database between two dates (in `YYYY-MM-DD` format). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          format: date
          example: '2022-03-03'
        example:
        - '2022-01-01'
        - '2022-12-31'
    invoice_date__gt:
      name: invoice_date__gt
      in: query
      description: Return invoices issued after this date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
        example: '2022-05-06'
    link__in:
      name: link__in
      in: query
      description: Return results only for these `link.id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 5722d0ba-69d7-42dc-8ff5-33767b83c5d6
    invoice_date:
      name: invoice_date
      in: query
      description: Return invoices issued exactly on this date (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    created_at__gte:
      name: created_at__gte
      in: query
      description: Return items that were last updated in Belvo's database after or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-04'
    type__in_invoice:
      name: type__in
      in: query
      description: Return invoices of these types. Can be either `OUTFLOW` or `INFLOW`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - OUTFLOW
          - INFLOW
          example: OUTFLOW
    fields:
      name: fields
      in: query
      description: Return only the specified fields in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    invoice_date__range:
      name: invoice_date__range
      in: query
      description: Return invoices issued within this date range (`YYYY-MM-DD`). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          format: date
          example: '2022-05-06'
        example:
        - '2022-01-01'
        - '2022-12-31'
    page:
      name: page
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    total_amount__lte:
      name: total_amount__lte
      in: query
      description: Return invoices less than or equal to this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 541.02
    status__in_invoice:
      name: status__in
      in: query
      description: Return invoices with these statuses. Can be either `Vigente` (valid) or `Cancelado` (cancelled).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: Cancelado
    total_amount__gt:
      name: total_amount__gt
      in: query
      description: Return invoices greater than this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 520.02
    total_amount__lt:
      name: total_amount__lt
      in: query
      description: Return invoices less than this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 540.02
    total_amount__range:
      name: total_amount__range
      in: query
      description: Return invoices between these two values. The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: number
          format: float
          pattern: ^\d{1,15}\.\d{2,4}$
          example: 541.02
        example:
        - 100
        - 5000
    invoice_identification:
      name: invoice_identification
      in: query
      description: Return an invoice with this ID (as provided by the insitution).
      schema:
        type: string
        example: 862B9918-3K6H-4E0B-NAI9-2BE2D833B840
    id__in:
      name: id__in
      in: query
      description: Return information for these resource `id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 6b3dea0f-be29-49d1-aabe-1a6d588642e6
    total_amount:
      name: total_amount
      in: query
      description: Return invoices matching exactly this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 1000.02
    created_at__lt:
      name: created_at__lt
      in: query
      description: Return items that were last updated in Belvo's database before this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-04-01'
    total_amount__gte:
      name: total_amount__gte
      in: query
      description: Return invoices greater than or equal to this value.
      schema:
        type: number
        format: float
        pattern: ^\d{1,15}\.\d{2,4}$
        example: 519.02
    created_at:
      name: created_at
      in: query
      description: Return items that were last updated in Belvo's database on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    invoice_identification__in:
      name: invoice_identification__in
      in: query
      description: Return invoices with these IDs (as provided by the institution).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: 992B9918-3G6H-4E0B-DAI9-2BE2D833B833
    invoice_date__lte:
      name: invoice_date__lte
      in: query
      description: Return balances issued on this date or earlier (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
        example: '2022-03-01'
    status_invoice:
      name: status
      in: query
      description: Return invoices with this status. Can be either `Vigente` (valid) or `Cancelado` (cancelled).
      schema:
        type: string
        example: Vigente
    created_at__gt:
      name: created_at__gt
      in: query
      description: Return items that were last updated in Belvo's database after this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
  schemas:
    InvoicesPaymentsSat:
      type: object
      required:
      - date
      - payment_type
      - currency
      - exchange_rate
      - amount
      - operation_number
      - beneficiary_account_number
      - payer_rfc
