    InvoiceWithIdSat:
      type: object
      title: Invoices Object (Mexico)
      x-tags:
      - Invoices
      required:
      - type
      - invoice_identification
      - invoice_date
      - invoice_type
      - subtotal_amount
      - tax_amount
      - discount_amount
      - total_amount
