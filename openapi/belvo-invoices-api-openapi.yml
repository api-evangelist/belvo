      - DAILY
      - WEEKLY
      - TENTH_DAY
      - FOURTEENTH_DAY
      - FIFTEENTH_DAY
      - MONTHLY
      - BIMONTHLY
      - PER_TASK
      - COMMISSION
      - ONE_OFF
      - OTHER_PERIODICITY
      - 'null'
