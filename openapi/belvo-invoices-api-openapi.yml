          - 'null'
          description: 'The payroll type, as defined by the legal entity of the country.


            - 🇲🇽 Mexico <a href="https://developers.belvo.com/docs/sat-catalogs#payroll-type" target="_blank">SAT catalog reference article</a>

            '
          example: O
