      - payment_type_description
      - invoice_details
      - payroll
      - payments
      - collected_at
      properties:
        id:
          $ref: '#/components/schemas/id'
        link:
          $ref: '#/components/schemas/link'
        collected_at:
          $ref: '#/components/schemas/collected_at'
        created_at:
          $ref: '#/components/schemas/created_at'
        invoice_identification:
          type:
          - string
          - 'null'
          description: The fiscal institution's unique ID for the invoice.
          example: A1A1A1A1-2B2B-3C33-D44D-555555E55EE
        invoice_date:
          type:
          - string
          - 'null'
          description: The date of the invoice, in `YYYY-MM-DD` format.
          example: '2019-12-01'
        status:
          type:
          - string
          - 'null'
          description: 'The status of the invoice. Can be either *Vigente* (valid) or *Cancelado*

            (cancelled).

            '
          example: Vigente
        invoice_type:
          $ref: '#/components/schemas/EnumInvoiceSatInvoiceType'
        type:
          $ref: '#/components/schemas/EnumInvoiceType'
        tax_details:
          $ref: '#/components/schemas/TaxDetailsInvoicesSat'
        sender_id:
          type:
          - string
          - 'null'
          description: The fiscal ID of the invoice sender
          example: AAA111111AA11
        sender_fiscal_regime:
          type:
          - string
          - 'null'
          description: The tax regime of the sender, as defined by the legal entity in the country.
          example: '601'
        sender_name:
          type:
          - string
          - 'null'
          description: The name of the invoice sender.
          example: ACME CORP
        sender_tax_fraud_status:
          type:
          - string
          - 'null'
          description: 'Indicates whether or not the sender is on SAT''s tax fraud list for having submitted incorrect data, having outstanding payments, or having conducted business that is in violation of the fiscal institution''s regulations.<br><br>


            SAT updates the tax fraud list every three months. <br><br>


            For more information regarding the reason''s a taxpayer can be put on the tax fraud list, please see <a href="http://omawww.sat.gob.mx/cifras_sat/Paginas/datos/vinculo.html?page=ListCompleta69.html" target="_blank">Article 69</a> and <a href="http://omawww.sat.gob.mx/cifras_sat/Paginas/datos/vinculo.html?page=ListCompleta69B.html" target="_blank">Article 69-B</a> of Mexico''s Código Fiscal de la Federación.

            <br><br>


            Possible statuses are:


            - `INVESTIGATING` <br>

            The fiscal institution has identified irregularities and open an investigation regarding the taxpayer.

            <br>

            - `DISMISSED` <br>

            The fiscal institution has investigated the taxpayer and declared them innocent.

            <br>

            - `CONFIRMED` <br>

            The fiscal institution has confirmed that the taxpayer is guilty.

            <br>

            - `OVERTURNED` <br>

            The fiscal institution has reassessed a previously confirmed taxpayer and, based on new evidence, has taken the taxpayer off the tax fraud list.

            <br>

            - `NO_TAX_FRAUD_STATUS` <br>

            The receiver or sender is not found in the list (in other words, they are complying with the fiscal institution''s regulations).

            '
          example: NO_TAX_FRAUD_STATUS
        receiver_id:
          type:
          - string
          - 'null'
          description: The fiscal ID of the invoice receiver.
          example: BBB222222BB22
        receiver_postal_code:
          type: string
          description: The postal code of the receiver.
          example: '11560'
        receiver_fiscal_regime:
          type:
          - string
          - 'null'
          description: The tax regime of the receiver, as defined by the legal entity in the country.
          example: '601'
        receiver_name:
          type:
          - string
          - 'null'
          description: The name of the invoice receiver.
          example: BELVO CORP
        receiver_tax_fraud_status:
          type:
          - string
          - 'null'
          description: 'Indicates whether or not the receiver is on SAT''s tax fraud list for having submitted incorrect data, having outstanding payments, or having conducted business that is in violation of the fiscal institution''s regulations.<br><br>


            SAT updates the tax fraud list every three months. <br><br>


            For more information regarding the reason''s a taxpayer can be put on the tax fraud list, please see <a href="http://omawww.sat.gob.mx/cifras_sat/Paginas/datos/vinculo.html?page=ListCompleta69.html" target="_blank">Article 69</a> and <a href="http://omawww.sat.gob.mx/cifras_sat/Paginas/datos/vinculo.html?page=ListCompleta69B.html" target="_blank">Article 69-B</a> of Mexico''s Código Fiscal de la Federación.

            <br><br>


            Possible statuses are:


            - `INVESTIGATING` <br>

            The fiscal institution has identified irregularities and open an investigation regarding the taxpayer.

            <br>

            - `DISMISSED` <br>

            The fiscal institution has investigated the taxpayer and declared them innocent.

            <br>

            - `CONFIRMED` <br>

            The fiscal institution has confirmed that the taxpayer is guilty.

            <br>

            - `OVERTURNED` <br>

            The fiscal institution has reassessed a previously confirmed taxpayer and, based on new evidence, has taken the taxpayer off the tax fraud list.

            <br>

            - `NO_TAX_FRAUD_STATUS` <br>

            The receiver or sender is not found in the list (in other words, they are complying with the fiscal institution''s regulations).

            '
          example: NO_TAX_FRAUD_STATUS
        cancelation_status:
          type:
          - string
          - 'null'
          description: 'If the invoice is cancelled, this field indicates the status of the cancellation.

            '
        cancelation_update_date:
          type:
          - string
          - 'null'
          format: date
          description: 'The date of the invoice cancelation, in `YYYY-MM-DD` format.

            '
          example: '2019-12-02'
        certification_date:
          type:
          - string
          - 'null'
          format: date
          description: 'The date of the fiscal certification, in `YYYY-MM-DD` format.

            '
          example: '2019-12-01'
        certification_authority:
          type:
          - string
          - 'null'
          description: 'The fiscal ID of the certification provider.

            '
          example: CCC333333CC33
        payment_type:
          type:
          - string
          - 'null'
          description: 'The payment type code used for this invoice, as defined by the country legal entity.


            - 🇲🇽 Mexico <a href="https://developers.belvo.com/docs/sat-catalogs#payment-type" target="_blank">SAT catalog reference article</a>

            '
          example: '99'
        payment_type_description:
          type:
          - string
          - 'null'
          deprecated: true
          description: '*This field has been deprecated. For more information regarding Belvo and deprecation, see our Deprecated fields explanation.*

            '
          example: null
        payment_method:
          $ref: '#/components/schemas/EnumInvoiceSatPaymentMethod'
        payment_method_description:
          type:
          - string
          - 'null'
          deprecated: true
          description: '*This field has been deprecated. For more information regarding Belvo and deprecation, see our Deprecated fields explanation.*


            *The description of the payment method used for this invoice.*

            '
          example: null
        usage:
          type:
          - string
          - 'null'
          description: "The invoice's usage code, as defined by the legal entity of the country. \n\n- \U0001F1F2\U0001F1FD Mexico <a href=\"https://developers.belvo.com/docs/sat-catalogs#usage\" target=\"_blank\">SAT catalog reference article</a>\n"
          example: P01
        version:
          type:
          - string
          - 'null'
          description: 'The CFDI version of the invoice.

            '
          example: '3.3'
        place_of_issue:
          type:
          - string
          - 'null'
          description: 'The postcode of where the invoice was issued.

            '
          example: '01165'
        invoice_details:
          type: array
          description: 'A list of descriptions for each item (purchased product or service provided) in the invoice.

            '
