          example: MXN
        payment_method:
          type:
          - string
          - 'null'
          description: 'The payment method of the related invoice.

            '
          example: PPD
        partiality_number:
          type: integer
          format: int32
          description: 'The payment installment number.

            '
          example: 1
        previous_balance:
          type:
          - number
          - 'null'
          format: float
          description: 'The invoice amount before the payment.

            '
          example: 18877.84
        amount_paid:
          type:
          - number
          - 'null'
          format: float
          description: 'The amount paid in this installment.

            '
          example: 8000
        outstanding_balance:
          type:
          - number
          - 'null'
          format: float
          description: 'The amount remaining to be paid.

            '
          example: 10877.84
    UnauthorizedError:
      type: object
      title: Unauthorized Error
      description: 'This error occurs when you try to make an API call using incorrect Belvo API credentials (either your secret key or secret password, or both, are incorrect).

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`authentication_failed`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#401-authentication_failed" target="_blank">401 authentication_failed errors</a>.

            '
          example: authentication_failed
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `authentication_failed` errors, the description is:\n\n  - `Invalid Secret Keys`.\n"
          example: Invalid Secret Keys
        request_id:
          $ref: '#/components/schemas/request_id'
    InvoiceDetailSat:
      type: object
      required:
      - description
      - product_identification
      - quantity
      - unit_amount
      - unit_description
      - unit_code
      - pre_tax_amount
      - tax_percentage
      - tax_amount
      - total_amount
      properties:
        collected_at:
          $ref: '#/components/schemas/collected_at'
        description:
          type:
          - string
          - 'null'
          description: 'The description of the invoice item (an invoice can have one or more items).

            '
          example: December 2019 accounting fees
        product_identification:
          type:
          - string
          - 'null'
          description: The identification code of the product or the service, as defined by the legal entity in the country.\n- \U0001F1F2\U0001F1FD <a href="http://200.57.3.89/Pys/catPyS.aspx" target="_blank">Mexico</a>.
          example: '84101600'
        quantity:
          type:
          - number
          - 'null'
          format: float
          description: The quantity of this invoice item.
          example: 10
        unit_code:
          type:
          - string
          - 'null'
          description: The unit of measure, as defined by the legal entity in the country. \n- \U0001F1F2\U0001F1FD Mexico <a href="https://developers.belvo.com/docs/sat-catalogs#unit-code" target="_blank">SAT catalog reference</a>.
          example: E48
        unit_description:
          type:
          - string
          - 'null'
          description: The description of the item, as defined by the legal entity in the country.\n- \U0001F1F2\U0001F1FD Mexico <a href="https://developers.belvo.com/docs/sat-catalogs#unit-code" target="_blank">SAT catalog reference</a>.
          example: Unidad de servicio
        unit_amount:
          type:
          - number
          - 'null'
          format: float
          description: The price of one a singular item.
          example: 200
        discount:
          type:
          - number
          - 'null'
          format: float
          description: 'The discount amount applied to this invoice item.

            '
          example: 10
        tax_subject_code:
          type:
          - string
          - 'null'
          description: 'Indicates what tax this item is subject to, as defined by the legal entity in the country.

            '
          example: '02'
        identifier_number:
          type:
          - string
          - 'null'
          description: 'The identification number of the item, as defined by the seller. This can be used to identify the product or service in the seller''s system.

            '
          example: PROD-12345
        pre_tax_amount:
          type:
          - number
          - 'null'
          format: float
          description: 'The total price for this item before tax is applied (`quantity` x `unit_amount`).

            '
          example: 400
        tax_percentage:
          type:
          - number
          - 'null'
          format: float
          description: The tax percentage to apply.
          example: 16
        tax_amount:
          type:
          - number
          - 'null'
          format: float
          description: 'The amount of tax for this invoice item (`pre_tax_amount` x `tax_percentage`).

            '
          example: 64
        total_amount:
          type:
          - number
          - 'null'
          format: float
          description: The total price for this invoice item (`pre_tax_amount` + `tax_amount`).
          example: 464
        retained_taxes:
          type: array
          description: The retained tax on the invoice item.
          items:
            $ref: '#/components/schemas/InvoiceDetailRetainedTaxSat'
        transferred_taxes:
          type: array
          description: The transferred taxes related to the invoice.
          items:
            $ref: '#/components/schemas/InvoiceDetailTransferredTaxSat'
    link_request:
      type: string
      format: uuid
      description: The `link.id` you want to retrieve information for.
      example: c81a1dea-6dd6-4999-8b9f-541ee8197058
    id:
      type: string
      format: uuid
      description: 'Belvo''s unique identifier for the current item.

        '
      example: 0d3ffb69-f83b-456e-ad8e-208d0998d71d
    AccessToResourceDenied:
      type: object
      title: Access to Belvo API denied
      description: 'This error occurs when you try to access Belvo''s resource without the correct permissions.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`access_to_resource_denied`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#403-access_to_resource_denied" target="_blank">403 access_to_resource_denied</a>.

            '
          example: access_to_resource_denied
        message:
