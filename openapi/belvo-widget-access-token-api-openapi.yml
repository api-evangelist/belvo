    InvalidFetchHistorical:
      type: object
      title: Invalid Fetch Resources
      description: 'This error occurs when you attempted to create a link where you set `credentials_storage` to `nostore` and did not send any resources in the `fetch_resources`. For links where we don''t store credentials, you must send through an array of resources in `fetch_resources`.

        '
      properties:
        code:
          type: string
          description: 'A unique error code (`invalid_fetch_resources`) that allows you to classify and handle the error programmatically.



            ℹ️ Check our DevPortal for more information on how to handle <a href="https://developers.belvo.com/docs/belvo-api-errors#400-invalid_fetch_resources" target="_blank">400 invalid_fetch_resources errors</a>.

            '
          example: invalid_fetch_resources
        message:
          type: string
          description: "A short description of the error. \n\n\nFor `invalid_fetch_resources` errors, the description can be one of the following:\n\n  - `Single links without stored credentials must fetch resources`\n  \n"
          example: Single links without stored credentials must fetch resources
        request_id:
          $ref: '#/components/schemas/request_id'
    stale_in:
      type: string
      pattern: ^\d{1,3}d$
      description: 'Indicates how long any user-derived data should be stored in Belvo''s database for the link (both single and recurrent). For example, if you send through `90d`, Belvo will remove any data from its database relating to the user after 90 days. For more information, check out the <a href="https://developers.belvo.com/docs/data-retention-controls#stale_in" target="_blank">stale_in</a> section of our Data retention controls article.


        > 📘 Info

        >

        > Belvo will only remove data for links that have not been updated in the period you provide in `stale_in`. Belvo will only remove data for links that have not been updated in the period you provide in `stale_in`.


        By default Belvo stores user data for 365 days, unless the link is deleted.

        '
      example: 42d
    credentials_storage:
      type: string
      pattern: ^(store|nostore|\d{1,3}d)$
      description: "Indicates whether or not to store credentials (and the duration for which to store the credentials).\n\n- For recurrent links, this is set to `store` by default (and cannot be changed). \n- For single links, this is set to `365d` by default.\n\nCan be either:\n  - `store` to store credentials (until the link is deleted)\n  - `nostore` to not store credentials\n  -  Any value between `1d` and `365d` to indicate the number of days you want the credentials to be stored.\n\n For more information, check out the <a href=\"https://developers.belvo.com/docs/data-retention-controls#credentials_storage\" target=\"_blank\">credentials_storage</a> section of our Data retention controls article.\n"
      example: 27d
