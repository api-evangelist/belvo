openapi: 3.2.0
info:
  title: Belvo API Docs Owners API
  version: 1.223.0
  description: '# Introduction


    Reach new audiences and convert more users by easily and safely connecting to their financial data, understanding their behavior and enabling instant payments with open finance. Through our API, you can access:


    ## Available Information and Payment Methods


    Belvo is an open banking API for Latin America that allows companies to access banking and fiscal information in a secure as well as agile way. Through our API, you can access:


    - Banking Information in Brazil

    - Employment Information in Brazil

    - Employment Information in Mexico

    - Fiscal Information in Mexico

    - Fiscal Information in Chile


    You can also use our API to make payments in:


    - Brazil

    - Mexico


    ## Data Dictionaries


    If you woud like the response documentation in Excel or CSV form, please download them from our public GitHub Reposiitory: Belvo Open Finance Data Dictionaries. Our EXCEL and CSV files are additionally localized into Spanish and Portuguese (Brazil). ## Environments


    We currently offer two environments: sandbox and production. ### Sandbox


    Available for:


    - 🟢 Aggregation and Enrichment

    - ⚪️ Payment Initiation


    Use our Sandbox environment to build your integration. We offer dummy data that mimics that of real-world use cases, which means you can test out all the endpoints, use the widget, and implement webhooks - just as you would with real-world data! All you need to get started with the Sandbox environment is to get your API keys. We really recommend that you start creating your integration in this environment. ### Production


    Available for:


    - 🟢 Aggregation and Enrichment

    - 🟢 Payment Initiation


    After you have tested your integration in the Sandbox environment and are ready to go live, you''ll need to request access to our Production environment. After you request access, our Sales Team will get in contact with you to schedule a meeting just to ensure your needs are met, and then you''ll just need to go through a certification process with one of our engineers to make sure that your integration is running optimally. To prepare for the certification meeting, just follow our Integration checklist. Once your integration is certified, all you''ll need to do is:


    - [ ] Request Production API keys (and change your Sandbox API keys in the code to these new ones). - [ ] Change the base URL that you make requests to from `sandbox.belvo.com` to `api.belvo.com`. - [ ] If you''re using webhooks, make sure to set a Production URL for your webhooks. ## Response codes


    We use the following HTTP status code in the response depending on the

    success or failure:


    | Status Code | Description |

    |-----------|-------|

    | `200` | ✅ **Success** - The content is available in the response body. |

    | `201` | ✅ **Success** - The content was created successfully on Belvo. |

    | `204` | ✅ **Success** - No content to return. |

    | `400` | ❌ **Bad Request Error** - Request returned an error, detail in the content.|

    | `401` | ❌ **Unauthorized** - The Belvo credentials provided are not valid.|

    | `404` | ❌ **Not Found** - The resource you try to access cannot be found.|

    | `405` | ❌ **Method Not Allowed** - The HTTP method you are using is not accepted for this resource.|

    | `408` | ❌ **Request Timeout** - The request timed out and was terminated by the server.|

    | `428` | ❌ **MFA Token Required** - MFA token was required by the institution to connect. |

    | `500` | ❌ **Internal Server Error** - The detail of the error is available in the response body.|


    ## Error handling


    Belvo API errors are returned in JSON format. For example, an error might look like this:


    ```json

    [

    {

    "request_id": "a6e1c493d7a29d91aed4338e6fcf077d",

    "message": "This field is required.",

    "code": "required",

    "field": "link"

    }

    ]

    ```


    Typically, an error response will have the following parameters:


    - `request_id`: a unique ID for the request, you should share it with the Belvo support team for investigations. - `message`: human-readable description of the error. - `code`: a unique code for the error.'
  contact:
    name: Need help?
    url: https://developers.belvo.com
    email: support@belvo.com
  x-logo:
    url: https://files.readme.io/5111448-belvo-for-developers.svg
    altText: Belvo Logo
servers:
- url: https://sandbox.belvo.com
  description: Sandbox
security:
- basicAuth: []
tags:
- name: Owners
  description: 'An **owner** represents the person who has access to a Link and is the owner of all the accounts inside the Link.


    You can use this endpoint in order to get useful information about your client, such as:


    - their full name

    - key contact information

    - information about the ID document they used when opening the account'
paths:
  /api/owners/:
    get:
      tags:
      - Owners
      operationId: ListOwners
      summary: List owners
      description: '## ▶️ Usage


        With the List Owners method, you can:


        1. List owners related to a specific `link.id` (using the `link` query parameter).

        2. Get the details of a specific `owners.id` (using the `id` query parameter).

        3. **[Not Recommended]** List all owners related to your Belvo account (without using any query parameters).


        ## 📖 Pagination


        This method returns a paginated response (default: 100 items per page). You can use the `page_size` query parameter to increase the number of items returned to a maximum of 1000 items. You can use the `page` query parameter to navigate through the results. For more details on how to navigate Belvo''s paginated responses, see our Pagination Tips article.


        ## 🔦 Filtering Responses


        Please see the query list below for a list of fields that you can filter your responses by. For more information on how to use filters, see our Filtering responses article.


        ## 🚨 Deprecated Fields


        This resource may return deprecated fields. In the response documentation you may see that a field has been marked as **deprecated**. This means that this field is no longer maintained by the Belvo team. You may still receive data for this field depending on the institution, however, you should not rely on this field.'
      parameters:
      - $ref: '#/components/parameters/link'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/link__in'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/id__in'
      - $ref: '#/components/parameters/created_at'
      - $ref: '#/components/parameters/created_at__gt'
      - $ref: '#/components/parameters/created_at__gte'
      - $ref: '#/components/parameters/created_at__lt'
      - $ref: '#/components/parameters/created_at__lte'
      - $ref: '#/components/parameters/created_at__range'
      - $ref: '#/components/parameters/email'
      - $ref: '#/components/parameters/display_name__icontains'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/common_pagination_properties'
                - properties:
                    results:
                      type: array
                      description: "An array of either:\n\n  - Owner Individual (OFDA Brazil) objects\n  - Owner Business (OFDA Brazil) objects\n  - Owner Standard (Multi-Region) objects\n  \n  > \U0001F6A7 One schema type per response\n  >\n  > The response will contain an array of **one** of the schema types described above. In other words, there **will not** be a mix of schema types in the response.\n"
                      items:
                        oneOf:
                        - $ref: '#/components/schemas/OwnerIndividualOpenFinanceBrazil'
                        - $ref: '#/components/schemas/OwnerBusinessOpenFinanceBrazil'
                        - $ref: '#/components/schemas/Owner'
              examples:
                OwnerIndividualOfdaPaginated:
                  $ref: '#/components/examples/OwnerOfdaIndividualPaginated'
                OwnerBusinessOfdaPaginated:
                  $ref: '#/components/examples/OwnerOfdaBusinessPaginated'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    post:
      tags:
      - Owners
      operationId: RetrieveOwners
      summary: Retrieve owners for a link
      description: 'Retrieve owner information from a specific link.


        {% admonition type="info" %}

        This resource may return deprecated fields. Please check the response documentation for more information.

        {% /admonition %}'
      parameters:
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - link
              properties:
                link:
                  $ref: '#/components/schemas/link_request'
                token:
                  $ref: '#/components/schemas/token'
                save_data:
                  $ref: '#/components/schemas/save_data'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/OwnerIndividualOpenFinanceBrazil'
                  - $ref: '#/components/schemas/OwnerBusinessOpenFinanceBrazil'
                  - $ref: '#/components/schemas/Owner'
              examples:
                OwnerIndividualOfda:
                  $ref: '#/components/examples/OwnerOfdaIndividual'
                OwnerBusinessOfda:
                  $ref: '#/components/examples/OwnerOfdaBusiness'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/OwnerIndividualOpenFinanceBrazil'
                  - $ref: '#/components/schemas/OwnerBusinessOpenFinanceBrazil'
                  - $ref: '#/components/schemas/Owner'
              examples:
                OwnerIndividualOfda:
                  $ref: '#/components/examples/OwnerOfdaIndividual'
                OwnerBusinessOfda:
                  $ref: '#/components/examples/OwnerOfdaBusiness'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
    patch:
      tags:
      - Owners
      operationId: PatchOwners
      summary: Complete an owners request
      description: 'Used to resume an Owner retrieve session that was paused because an MFA

        token was required by the institution.


        {% admonition type="info" %}

        This resource may return deprecated fields. Please check the response documentation for more information.

        {% /admonition %}'
      parameters:
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBody'
      responses:
        '200':
          description: Ok (when `save_data=false`)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/OwnerIndividualOpenFinanceBrazil'
                  - $ref: '#/components/schemas/OwnerBusinessOpenFinanceBrazil'
              examples:
                OwnerIndividualOfda:
                  $ref: '#/components/examples/OwnerOfdaIndividual'
                OwnerBusinessOfda:
                  $ref: '#/components/examples/OwnerOfdaBusiness'
        '201':
          description: Created (when `save_data=true`)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/OwnerIndividualOpenFinanceBrazil'
                  - $ref: '#/components/schemas/OwnerBusinessOpenFinanceBrazil'
              examples:
                OwnerIndividualOfda:
                  $ref: '#/components/examples/OwnerOfdaIndividual'
                OwnerBusinessOfda:
                  $ref: '#/components/examples/OwnerOfdaBusiness'
        '400':
          $ref: '#/components/responses/400_bad_request_error'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
  /api/owners/{id}/:
    get:
      tags:
      - Owners
      operationId: DetailOwner
      summary: Get an owner's details
      description: 'Get the details of a specific owner.


        {% admonition type="info" %}

        This resource may return deprecated fields. Please check the response documentation for more information.

        {% /admonition %}'
      parameters:
      - name: id
        in: path
        required: true
        description: The `owner.id` you want to get detailed information about.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OwnerIndividualOpenFinanceBrazil'
                - $ref: '#/components/schemas/OwnerBusinessOpenFinanceBrazil'
                - $ref: '#/components/schemas/Owner'
              examples:
                OwnerIndividualOfdaDetails:
                  $ref: '#/components/examples/OwnerOfdaIndividuaDetail'
                OwnerBusinessOfdaDetails:
                  $ref: '#/components/examples/OwnerOfdaBusinessDetail'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
    delete:
      tags:
      - Owners
      operationId: DestroyOwner
      summary: Delete an owner
      description: Delete a specific owner from your Belvo account.
      parameters:
      - name: id
        in: path
        required: true
        description: The `owner.id` that you want to delete.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_access_denied_error'
        '404':
          $ref: '#/components/responses/404_not_found_error'
        '408':
          $ref: '#/components/responses/408_request_timeout_error'
        '428':
          $ref: '#/components/responses/428_token_required_error'
        '500':
          $ref: '#/components/responses/500_unexpected_error'
components:
  parameters:
    omit:
      name: omit
      in: query
      description: Omit certain fields from being returned in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    created_at__lte:
      name: created_at__lte
      in: query
      description: Return items that were last updated in Belvo's database before or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-03-30'
    link:
      name: link
      in: query
      description: 'The `link.id` you want to filter by.


        ℹ️ We highly recommend adding the `link.id` filter in order to improve your performance.

        '
      schema:
        type: string
        format: uuid
        example: 8848bd0c-9c7e-4f53-a732-ec896b11d4c4
    page_size:
      name: page_size
      in: query
      description: 'Indicates how many results to return per page. By default we return 100 results per page.


        ℹ️ The minimum number of results returned per page is 1 and the maximum is 1000. If you enter a value greater than 1000, our API will default to the maximum value (1000).

        '
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 1000
        example: 100
    id:
      name: id
      in: query
      description: Return information only for this resource `id`.
      schema:
        type: string
        format: uuid
        example: 24ccab1d-3a86-4136-a6eb-e04bf52b356f
    created_at__range:
      name: created_at__range
      in: query
      description: Return accounts that were last updated in Belvo's database between two dates (in `YYYY-MM-DD` format). The first value indicates the start of the range and the second value indicates the end of the range.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          format: date
          example: '2022-03-03'
        example:
        - '2022-01-01'
        - '2022-12-31'
    link__in:
      name: link__in
      in: query
      description: Return results only for these `link.id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 5722d0ba-69d7-42dc-8ff5-33767b83c5d6
    created_at__gte:
      name: created_at__gte
      in: query
      description: Return items that were last updated in Belvo's database after or on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-04'
    display_name__icontains:
      name: display_name__icontains
      in: query
      description: Return owners whose full display name partially matches your query. For example, `mar` will return results for Mark, Maria, Neymar, Remarque, and so on.
      schema:
        type: string
        minLength: 3
        example: Daniela
    fields:
      name: fields
      in: query
      description: Return only the specified fields in the response. For more information, see our <a href="https://developers.belvo.com/docs/searching-and-filtering" target="_blank">Filtering responses</a> DevPortal article.
      schema:
        type: string
    page:
      name: page
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    id__in:
      name: id__in
      in: query
      description: Return information for these resource `id`s.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 6b3dea0f-be29-49d1-aabe-1a6d588642e6
    created_at__lt:
      name: created_at__lt
      in: query
      description: Return items that were last updated in Belvo's database before this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-04-01'
    email:
      name: email
      in: query
      description: Returns owners whose email address match your query.
      schema:
        type: string
        format: email
        example: lopes.d@gmail.com
    created_at:
      name: created_at
      in: query
      description: Return items that were last updated in Belvo's database on this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
    created_at__gt:
      name: created_at__gt
      in: query
      description: Return items that were last updated in Belvo's database after this date (in `YYYY-MM-DD` format).
      schema:
        type: string
        format: date
        example: '2022-05-05'
  schemas:
    OwnerIndividualFinancialProfile:
      type:
      - object
      - 'null'
      required:
      - company_id
      - occupation_code
      - occupation_description
      - informed_income
      - patrimony
      description: Information regarding the financial profile of the individual.
      properties:
        company_id:
          type:
          - string
          - 'null'
          maxLength: 14
          pattern: ^\d{14}$
          description: 'The identifier of the company where the individual is employed.

            '
          example: '50685362000135'
        occupation_code:
          $ref: '#/components/schemas/EnumOwnerIndividualFinancialProfileOccupationCode'
        occupation_description:
          type:
          - string
          - 'null'
          maxLength: 100
          pattern: '[\w\W\s]*'
          description: 'Information regarding the individual''s occupation.

            '
          example: '01'
        informed_income:
          $ref: '#/components/schemas/OwnerIndividualInformedIncome'
        patrimony:
          $ref: '#/components/schemas/OwnerIndividualPatrimony'
    EnumOwnerInformedIncomeFrequency:
      type:
      - string
      - 'null'
      enum:
      - DAILY
      - WEEKLY
      - FORTNIGHTLY
      - MONTHLY
      - BIMONTHLY
      - QUARTERLY
      - BIANNUALLY
      - ANNUALLY
      - OTHERS
      description: "Indicates how often the individual receives their salary. We return one of the following values:\n\n  - `DAILY`\n  - `WEEKLY`\n  - `FORTNIGHTLY`\n  - `MONTHLY`\n  - `BIMONTHLY`\n  - `QUARTERLY`\n  - `BIANNUALLY`\n  - `ANNUALLY`\n  - `OTHERS`\n"
      example: MONTHLY
    OwnerIndividualFinancialRelation:
      type:
      - object
      - 'null'
      required:
      - start_date
      - product_services
      - product_services_additional_info
      - procurators
      - products
      description: Details regarding any additional relationship the individual has with the institution (for example, other accounts or products they have with the institution).
      properties:
        start_date:
          type: string
          format: date-time
          maxLength: 20
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$
          description: 'The ISO-8601 timestamp when the financial relationship between the individual and the institution started.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: '2021-05-21T08:30:00Z'
        product_services:
          type: array
          minItems: 1
          description: 'A list of products that the individual has with the institution.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          items:
            type: string
            description: 'The name of the product, according to the institution.

              '
            example: CONTA_DEPOSITO_A_VISTA
        product_services_additional_info:
          type:
          - string
          - 'null'
          maxLength: 100
          pattern: ^[\w\W]*$
          description: 'Additional information regarding the products that the individual has.

            '
          example: Joint account with Robin
        procurators:
          type: array
          description: Information regarding any individuals or companies that can act on behalf of the owner.
          items:
            $ref: '#/components/schemas/OwnerProcurators'
        products:
          type: array
          description: Details regarding any additional products that the individual has with the institution.
          items:
            $ref: '#/components/schemas/OwnerIndividualProducts'
        salary_portability_requests:
          type: array
          description: "Details regarding any salary portability requests that the individual has made with the institution.\n\nA salary portability is a request to transfer the individual's salary from their employer's 'payroll' bank account to another bank account.\n\n> \U0001F4D8 \n>\n> Please note that the receiving bank account cannot terminate a salary portability (or be informed that it has been termnated). Only the employer's payroll bank is able to provide this information. As such, the portabilities listed here may not be up-to-date.\n"
          items:
            $ref: '#/components/schemas/OwnerIndividualSalaryPortabilityRequests'
        payroll_accounts:
          type: array
          description: 'Details regarding any payroll bank accounts that are associated with the individual. That is, each time the indivudal has a new employer that they receive a salary from, it should be listed here.


            > 📘

            >

            > Past employers may not close the payroll account for the indiviual. As such, the payroll accounts listed here may not be up-to-date.

            '
          items:
            $ref: '#/components/schemas/OwnerIndividualPayrollAccounts'
    EnumOwnerPartyPersonType:
      type:
      - string
      - 'null'
      enum:
      - INDIVIDUAL
      - COMPANY
      description: "The type of person that is an ownership party of the account. We return one of the following values:\n\n  - `INDIVIDUAL`\n  - `COMPANY`\n  \n"
      example: INDIVIDUAL
    EnumOwnerMaritalStatus:
      type:
      - string
      - 'null'
      enum:
      - SINGLE
      - MARRIED
      - WIDOWED
      - SEPARATED
      - DIVORCED
      - CIVIL_UNION
      - OTHER
      description: "The individual's marital status. We return one of the following values:\n\n  - `SINGLE`\n  - `MARRIED`\n  - `WIDOWED`\n  - `SEPARATED`\n  - `DIVORCED`\n  - `CIVIL_UNION`\n  - `OTHER`\n"
      example: SINGLE
    OwnerAddresses:
      type:
      - object
      - 'null'
      required:
      - is_main
      - address
      - additional_info
      - district_name
      - town
      - town_code
      - state
      - postcode
      - country_name
      - country_code
      - latitude
      - longitude
      description: Detailed information regarding the owner's addresses.
      properties:
        is_main:
          type: boolean
          description: 'Boolean to indicate if this is the user''s main address.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: true
        address:
          type: string
          maxLength: 150
          pattern: ^[\w\W\s]{0,150}$
          description: 'The user''s address.


            > **Non-nullable:** A value must be returned by Brazil''s open finance network.

            '
          example: Av Naburo Ykesaki, 1270
        additional_info:
          type:
          - string
          - 'null'
          maxLength: 150
          pattern: ^[\w\W\s]{0,150}$
          description: 'Additional information regarding the user''s address.

            '
